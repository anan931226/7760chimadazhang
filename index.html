    var oralCount = papers2026OralFor(p).length;
    var navLinks = h3s.map(function(b, i){
      return '<a href="#p2026-h3-' + i + '">' + esc(b.text) + '</a>';
    });
    if(quizCount) navLinks.push('<a href="#p2026-mock-quiz" class="jump-nav-mock">模擬筆試</a>');
    if(oralCount) navLinks.push('<a href="#p2026-mock-oral" class="jump-nav-mock">模擬口試</a>');
    var navHtml = navLinks.length ? '<div class="jump-nav">' + navLinks.join('') + '</div>' : '';

    var h3count = -1;
    var htmlParts = [];
    var sectionOpen = false;
    p.blocks.forEach(function(b){
      if(b.type === 'h3'){
        h3count++;
        if(sectionOpen) htmlParts.push('</div>');
        htmlParts.push('<div class="sec-card ' + paper2026SectionClass(b.text) + '">');
        sectionOpen = true;
        htmlParts.push('<div class="block-h3" id="p2026-h3-' + h3count + '">' + inline(b.text) + '</div>');
      } else {
        htmlParts.push(renderBlocks([b]));
      }
    });
    if(sectionOpen) htmlParts.push('</div>');
    var blocksHtml = htmlParts.join('');

    pane.innerHTML =
      '<h1 class="chapter-title">' + esc(p.title) + '</h1>' +
      (p.source_citation ? '<div class="chapter-meta">' + esc(p.source_citation) + '</div>' : '') +
      (p.credit ? '<div class="chapter-credit">筆記內容由 ' + esc(p.credit) + ' 提供</div>' : '') +
      '<hr class="divider">' +
      navHtml +
      blocksHtml +
      renderPaper2026MockExam(p);
    pane.scrollTop = 0;
    document.querySelector('#view-papers2026 .content-pane').scrollTop = 0;
    wirePaper2026MockExam();
  }

  function paper2026NN(p){ return p.id.replace(/^p/, ''); }

  function paper2026SectionClass(text){
    var t = String(text || '');
    if(/^Background/i.test(t)) return 'sec-bg';
    if(/^Evaluation/i.test(t)) return 'sec-eval';
    if(/^Application/i.test(t)) return 'sec-app';
    return '';
  }

  function papers2026QuizFor(p){
    var nn = paper2026NN(p);
    return STATE.papers2026Quiz.filter(function(q){ return q.chapter_id === 'papers2026-' + nn; });
  }

  function papers2026OralFor(p){
    var nn = paper2026NN(p);
    return STATE.papers2026Oral.filter(function(o){ return o.id === 'papers2026-oral-' + nn; });
  }

  function renderBulletText(text){
    var lines = String(text || '').split('\n').filter(function(l){ return l.trim().length; });
    return '<ul class="mock-oral-answer-list">' + lines.map(function(l){
      var m = l.match(/^(\s*)-\s?(.*)$/);
      var indent = m ? Math.floor(m[1].length / 2) : 0;
      var t = m ? m[2] : l;
      return '<li style="margin-left:' + (indent * 16) + 'px">' + inline(t) + '</li>';
    }).join('') + '</ul>';
  }

  function renderPaper2026MockExam(p){
    var quiz = papers2026QuizFor(p);
    var oral = papers2026OralFor(p);
    if(!quiz.length && !oral.length) return '';

    var quizHtml = mockQuizCardsHtml(quiz.map(papers2026ToQuizShape));

    var oralHtml = oral.map(function(o){
      return '<div class="mock-oral-card">' +
        (o.title ? '<div class="mock-oral-title">' + esc(o.title) + '</div>' : '') +
        '<div class="mock-oral-scenario">' + inline(o.scenario) + '</div>' +
        (o.sub_questions && o.sub_questions.length ?
          '<ol class="mock-oral-subq">' + o.sub_questions.map(function(sq){
            return '<li>' + inline(sq) + '</li>';
          }).join('') + '</ol>' : '') +
        '<button class="mock-oral-toggle btn btn-ghost">顯示參考答案</button>' +
        '<div class="mock-oral-answer" hidden>' + renderBulletText(o.reference_answer) + '</div>' +
      '</div>';
    }).join('');

    return '<hr class="divider">' +
      '<div class="mock-exam-section">' +
        (quizHtml ? '<h2 class="mock-exam-heading" id="p2026-mock-quiz">模擬筆試（' + quiz.length + ' 題）</h2>' + quizHtml : '') +
        (oralHtml ? '<h2 class="mock-exam-heading" id="p2026-mock-oral">模擬口試</h2>' + oralHtml : '') +
      '</div>';
  }

  /* normalize a papers2026_quiz row into the shape renderMine/allAttempts
     expect, so its answers/favorites sit in the same 錯題/收藏/落點分析 as
     chapter and exam questions. chapter_id points at a real pseudo-chapter
     row ("papers2026-NN", one per paper) seeded alongside the real chapters,
     so 落點分析's ordinary chapterId grouping needs no special-casing. */
  function papers2026ToQuizShape(q){
    return {
      id: q.id,
      chapterId: q.chapter_id,
      question: q.question,
      options: q.options,
      answerIndex: q.answer_index,
      explanation: q.explanation,
      isPapers2026: true
    };
  }

  function wirePaper2026MockExam(){
    wireMockQuizCards('#view-papers2026', function(qid){
      var q = STATE.papers2026Quiz.filter(function(x){ return x.id === qid; })[0];
      return q ? papers2026ToQuizShape(q) : null;
    }, 'papers2026');

    document.querySelectorAll('#view-papers2026 .mock-oral-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.mock-oral-card');
        var ans = card.querySelector('.mock-oral-answer');
        ans.hidden = !ans.hidden;
        btn.textContent = ans.hidden ? '顯示參考答案' : '隱藏參考答案';
      });
    });
  }

  /* ---------- exam (歷屆考古題) tab ---------- */
  var examBrowse = null; // newBrowse() 產出的物件；null 表示停在設定頁
  /* set when the 考古題 view was entered by jumping from a 版本落差筆記 entry, so
     the question can offer a way back to the note it came from instead of
     stranding the reader in the question browser. Holds the entry id so the
     browser can scroll back to that exact finding, not just its top. */
  var vgnReturn = null;

  function examYears(){
    var years = {};
    STATE.examQuestions.forEach(function(q){ years[q.year] = (years[q.year]||0) + 1; });
    return Object.keys(years).map(Number).sort(function(a,b){ return b - a; }).map(function(y){
      return { year: y, count: years[y] };
    });
  }

  /* 題庫範圍的值編碼成 "<來源>:<鍵>"，鍵是年度／章節 id／篇 id，或 __all__。
     三個來源共用同一個瀏覽器，所以下拉選單是同一個，用 optgroup 分組。 */
  function examScopeOptions(){
    var out = '';
    var years = examYears();
    out += '<optgroup label="歷屆考古題">' +
      '<option value="exam:__all__">全部年度混合（' + STATE.examQuestions.length + ' 題）</option>' +
      years.map(function(y){
        return '<option value="exam:' + y.year + '">' + y.year + ' 年（' + y.count + ' 題）</option>';
      }).join('') + '</optgroup>';

    var chaptersWithQ = allChapters().filter(function(c){ return questionCountFor(c.id) > 0; })
      .sort(function(a, b){ return (a.num || 999) - (b.num || 999); });
    if(chaptersWithQ.length){
      out += '<optgroup label="章節筆記題庫">' +
        '<option value="chapter:__all__">全部章節混合（' + allQuestions().length + ' 題）</option>' +
        chaptersWithQ.map(function(c){
          return '<option value="chapter:' + esc(c.id) + '">' + esc(c.title) + '（' + questionCountFor(c.id) + ' 題）</option>';
        }).join('') + '</optgroup>';
    }

    var p26 = {};
    STATE.papers2026Quiz.forEach(function(q){ p26[q.chapter_id] = (p26[q.chapter_id] || 0) + 1; });
    var p26Ids = Object.keys(p26).sort();
    if(p26Ids.length){
      out += '<optgroup label="2026麻專18篇">' +
        '<option value="p26:__all__">全部篇章混合（' + STATE.papers2026Quiz.length + ' 題）</option>' +
        p26Ids.map(function(cid){
          var ch = findChapter(cid);
          return '<option value="p26:' + esc(cid) + '">' + esc(ch ? ch.title : cid) + '（' + p26[cid] + ' 題）</option>';
        }).join('') + '</optgroup>';
    }
    return out;
  }

  /* 把一串 question_id 還原成瀏覽器用的 exam 形狀，三個題庫都查。續作進度只存
     question_ids，所以還原時要自己認出每個 id 屬於哪個題庫。對不到的（題目被刪或
     重灌換了 id）直接丟掉，寧可少幾題也不要讓整份進度壞掉。 */
  function browsePoolFromIds(ids){
    var examById = {}, chById = {}, p26ById = {};
    STATE.examQuestions.forEach(function(q){ examById[q.id] = q; });
    allQuestions().forEach(function(q){ chById[q.id] = q; });
    STATE.papers2026Quiz.forEach(function(q){ p26ById[q.id] = q; });
    return (ids || []).map(function(id){
      if(examById[id]) return examById[id];
      if(chById[id]){
        var ch = findChapter(chById[id].chapterId);
        return quizToExamShape(chById[id], 'chapter', ch ? ch.title : '章節題');
      }
      if(p26ById[id]){
        var r = p26ById[id], c = findChapter(r.chapter_id);
        return quizToExamShape(papers2026ToQuizShape(r), 'papers2026', c ? c.title : r.chapter_id);
      }
      return null;
    }).filter(Boolean);
  }

  /* 續作卡片要講清楚上次做的是哪一批，但 quiz_sessions 沒有存題庫範圍，所以從第一
     題反推是哪個題庫——精確到年度／章名沒有意義（混合模式本來就跨很多批）。 */
  function browseSourceLabel(pool){
    if(!pool.length) return '題目瀏覽';
    var first = pool[0];
    if(!first._source) return '歷屆考古題';
    return first._source === 'papers2026' ? '2026麻專18篇' : '章節筆記題庫';
  }

  /* ---------- 依章節的範圍 ----------
     每個 Miller 章底下掛兩種題：考古題（miller_chapters 有引用到這一章的）與該章
     各篇筆記的題目。**跨章題會出現在它引用到的每一章**，這裡刻意跟落點分析相反——
     落點只算主章是為了分母不虛胖，但「這一章有哪些題」本來就該把碰到它的題目全部
     看到。用 taxonomy 的 notes[] 而不是 primary_note，否則像 Ch.46 的第二篇筆記
     ch50 那 6 題會被默默漏掉。 */
  var CHAPTER_INDEX = null;
  function chapterQuestionIndex(){
    if(CHAPTER_INDEX) return CHAPTER_INDEX;
    var byChapter = {};
    function bucket(n){ return byChapter[n] || (byChapter[n] = { exam: [], notes: [] }); }
    STATE.examQuestions.forEach(function(q){
      (q.miller_chapters || []).forEach(function(n){ bucket(n).exam.push(q); });
    });
    var noteToChapters = {};
    STATE.chapterTaxonomy.forEach(function(t){
      (t.notes || []).forEach(function(nid){
        (noteToChapters[nid] || (noteToChapters[nid] = [])).push(t.chapter);
      });
    });
    allQuestions().forEach(function(q){
      (noteToChapters[q.chapterId] || []).forEach(function(n){ bucket(n).notes.push(q); });
    });
    CHAPTER_INDEX = byChapter;
    return byChapter;
  }

  /* 章號 900 以上是第十版刪掉、只存在第九版的章（目前只有 933 = 第九版 Ch.33） */
  function millerChapterLabel(t){
    var n = t.chapter >= 900 ? ('第九版 Ch.' + (t.chapter - 900)) : ('Ch.' + t.chapter);
    return n + ' ' + t.title;
  }

  function chapterPool(num){
    var b = chapterQuestionIndex()[num];
    if(!b) return [];
    var exam = b.exam.slice().sort(function(a, c){ return a.year - c.year || a.question_no - c.question_no; });
    var notes = b.notes.map(function(q){
      var ch = findChapter(q.chapterId);
      return quizToExamShape(q, 'chapter', ch ? ch.title : '章節題');
    });
    return exam.concat(notes);
  }

  /* 一題可能同時掛在同一個大類底下的好幾章，所以整類混合要去重，否則題數會虛胖、
     同一題還會在瀏覽時出現兩次。 */
  function categoryPool(catId){
    if(catId === 'cat-papers2026') return examPoolFor('p26:__all__');
    var rows = STATE.chapterTaxonomy.filter(function(t){ return t.category_id === catId; })
      .sort(function(a, b){ return a.chapter - b.chapter; });
    var seen = {}, out = [];
    rows.forEach(function(t){
      chapterPool(t.chapter).forEach(function(q){
        if(seen[q.id]) return;
        seen[q.id] = true;
        out.push(q);
      });
    });
    return out;
  }

  function chapterScopeOptions(){
    var idx = chapterQuestionIndex();
    var byCat = {};
    STATE.chapterTaxonomy.forEach(function(t){
      (byCat[t.category_id] || (byCat[t.category_id] = [])).push(t);
    });
    var out = '';
    STATE.chapterCategories.slice()
      .sort(function(a, b){ return (a.sort_order || 0) - (b.sort_order || 0); })
      .forEach(function(c){
        if(c.id === 'cat-papers2026') return; // 沒有 Miller 章號，最後單獨列一組
        var rows = (byCat[c.id] || []).filter(function(t){
          var b = idx[t.chapter];
          return b && (b.exam.length + b.notes.length) > 0;
        }).sort(function(a, b){ return a.chapter - b.chapter; });
        if(!rows.length) return;
        out += '<optgroup label="' + esc(c.name) + '">' +
          '<option value="cat:' + esc(c.id) + '">整類混合（' + categoryPool(c.id).length + ' 題）</option>' +
          rows.map(function(t){
            var b = idx[t.chapter];
            return '<option value="mch:' + t.chapter + '">' + esc(millerChapterLabel(t)) +
              '（' + (b.exam.length + b.notes.length) + ' 題）</option>';
          }).join('') + '</optgroup>';
      });

    var p26 = {};
    STATE.papers2026Quiz.forEach(function(q){ p26[q.chapter_id] = (p26[q.chapter_id] || 0) + 1; });
    var p26Ids = Object.keys(p26).sort();
    if(p26Ids.length){
      out += '<optgroup label="2026麻專18篇（無 Miller 章號對應）">' +
        '<option value="p26:__all__">全部篇章混合（' + STATE.papers2026Quiz.length + ' 題）</option>' +
        p26Ids.map(function(cid){
          var ch = findChapter(cid);
          return '<option value="p26:' + esc(cid) + '">' + esc(ch ? ch.title : cid) + '（' + p26[cid] + ' 題）</option>';
        }).join('') + '</optgroup>';
    }
    return out;
  }

  function examPoolFor(value){
    var sep = value.indexOf(':');
    var kind = value.slice(0, sep), key = value.slice(sep + 1);

    if(kind === 'mch') return chapterPool(Number(key));
    if(kind === 'cat') return categoryPool(key);

    if(kind === 'chapter'){
      var chOrder = {};
      STATE.chapters.forEach(function(c){ chOrder[c.id] = (c.num == null ? 999 : c.num); });
      var qs = (key === '__all__' ? allQuestions()
                                  : allQuestions().filter(function(q){ return q.chapterId === key; })).slice();
      qs.sort(function(a, b){ return (chOrder[a.chapterId] || 999) - (chOrder[b.chapterId] || 999); });
      return qs.map(function(q){
        var ch = findChapter(q.chapterId);
        return quizToExamShape(q, 'chapter', ch ? ch.title : '章節題');
      });
    }

    if(kind === 'p26'){
      var rows = (key === '__all__' ? STATE.papers2026Quiz
                                    : STATE.papers2026Quiz.filter(function(q){ return q.chapter_id === key; })).slice();
      rows.sort(function(a, b){ return String(a.chapter_id).localeCompare(String(b.chapter_id)); });
      return rows.map(function(r){
        var ch = findChapter(r.chapter_id);
        return quizToExamShape(papers2026ToQuizShape(r), 'papers2026', ch ? ch.title : r.chapter_id);
      });
    }

    var pool = (key === '__all__' ? STATE.examQuestions.slice()
                                  : STATE.examQuestions.filter(function(q){ return String(q.year) === key; }));
    pool.sort(function(a, b){ return a.year - b.year || a.question_no - b.question_no; });
    return pool;
  }

  /* 選範圍的兩種切法，以及兩個作答選項。都只活在記憶體裡：重畫設定頁時要記得住，
     但不值得為了跨裝置同步再開一張表。 */
  var BROWSE_MODE = 'bank';      // 'bank' 依題庫 ／ 'chapter' 依章節
  var BROWSE_SHUFFLE = false;    // 隨機排序
  var BROWSE_UNSEEN = false;     // 只出沒做過的

  function renderExamSetup(){
    var wrap = document.getElementById('exam-wrap');
    var total = STATE.examQuestions.length;
    var options = BROWSE_MODE === 'chapter' ? chapterScopeOptions() : examScopeOptions();

    var eid = getEmployeeId();
    /* 續作卡片也認舊的 'chapter' 那一列——測驗分頁收掉之前存的進度不該憑空消失，
       接續之後就會以 'browse' 存回去。 */
    var saved = eid ? (getSession(eid, SESSION_BROWSE) || getSession(eid, SESSION_CHAPTER)) : null;
    var savedPool = saved ? browsePoolFromIds(saved.question_ids) : [];
    if(saved && !savedPool.length) saved = null; // 題目全對不到就當作沒有進度

    wrap.innerHTML =
      '<div class="exam-setup">' +
        '<h2>題目瀏覽</h2>' +
        '<p class="exam-scope-hint">歷屆考古題、章節筆記題庫、2026麻專18篇 三個題庫共用這個瀏覽器。' +
        '不管從哪一批作答，紀錄都會進「我的紀錄」的錯題、收藏與落點分析。</p>' +
        (saved ?
          '<div class="resume-card">' +
            '<div>上次的「' + esc(browseSourceLabel(savedPool)) + '」還沒看完：第 <b>' +
              (Math.min(saved.idx, savedPool.length - 1) + 1) + ' / ' + savedPool.length +
              '</b> 題，目前答對 <b>' + saved.score + '</b> 題</div>' +
            '<div class="resume-actions">' +
              '<button class="btn btn-primary" id="exam-resume">繼續上次的進度</button>' +
              '<button class="btn btn-ghost" id="exam-discard">放棄，重新選</button>' +
            '</div>' +
            '<div class="ctl-hint">「放棄」只是清掉這個書籤，' +
              '之前答過的紀錄、錯題與收藏都不會動。</div>' +
          '</div>' : '') +
        (total ?
          '<label>分類方式</label>' +
          '<div class="scope-mode" role="group" aria-label="分類方式">' +
            '<button type="button" class="scope-mode-btn' + (BROWSE_MODE === 'bank' ? ' active' : '') + '" data-mode="bank">依題庫</button>' +
            '<button type="button" class="scope-mode-btn' + (BROWSE_MODE === 'chapter' ? ' active' : '') + '" data-mode="chapter">依章節</button>' +
          '</div>' +
          '<div class="ctl-hint">' + (BROWSE_MODE === 'chapter'
            ? '照 Miller 第十版的章節選。同一章的考古題和筆記題會<b>一起出現</b>，' +
              '詳解引用到多章的題目在每一章都看得到。'
            : '照三個題庫各自的分法選：考古題分年度、筆記題分篇章、18篇分論文。') + '</div>' +
          '<label>題庫範圍</label>' +
          '<select id="exam-year">' + options + '</select>' +
          '<div class="scope-stat" id="scope-stat"></div>' +
          '<div class="scope-opts">' +
            '<label class="scope-opt"><input type="checkbox" id="opt-shuffle"' + (BROWSE_SHUFFLE ? ' checked' : '') + '>' +
              '<span class="t">隨機排序<em>打亂出題順序。不勾就照年度題號或章節順序出題。</em></span></label>' +
            '<label class="scope-opt"><input type="checkbox" id="opt-unseen"' + (BROWSE_UNSEEN ? ' checked' : '') + '>' +
              '<span class="t">只出沒做過的<em>跳過你作答過的題目。認的是奇美人事號，換裝置也記得。</em></span></label>' +
          '</div>' +
          '<button class="btn btn-primary" id="exam-start">開始瀏覽</button>' +
          '<div class="ctl-hint">作答會即時計分，上方隨時看得到「答對／已作答」。' +
            '中途離開會記住進度，下次回到這頁可以接著做。</div>'
        : '<div class="empty-state" style="padding:20px 0;">考古題資料還沒上架。</div>') +
        (STATE.versionGapNotes.length ?
          '<div class="exam-vgn-entry">' +
            '<button class="btn btn-ghost" id="exam-vgn">版本落差筆記</button>' +
            '<div class="exam-vgn-hint">Miller 第九版→第十版的版本差異、教科書內部矛盾與考題對照，' +
              '共 ' + STATE.versionGapNotes.length + ' 則。答題時該題若有相關紀錄，也會直接出現在詳解下方。</div>' +
          '</div>' : '') +
      '</div>';

    var vgnBtn = document.getElementById('exam-vgn');
    if(vgnBtn) vgnBtn.addEventListener('click', renderVersionGapBrowser);

    var resumeBtn = document.getElementById('exam-resume');
    if(resumeBtn) resumeBtn.addEventListener('click', function(){
      vgnReturn = null;
      examBrowse = newBrowse(savedPool, saved.idx, saved.score);
      /* 立刻存一次，讓進度馬上落在 'browse' 那一列。接的若是測驗分頁留下的舊
         'chapter' 列，舊列就不再是唯一的副本了；兩列並存時讀取一律以 browse 優先。 */
      saveBrowse();
      renderExamLive();
    });
    var discardBtn = document.getElementById('exam-discard');
    if(discardBtn) discardBtn.addEventListener('click', function(){
      /* 兩個來源都要清。只清 browse 的話，測驗分頁留下的舊 chapter 列會在重畫後
         立刻遞補上來，使用者會看到「放棄」之後卡片沒消失、還換成一份更舊的進度。 */
      clearSession(eid, SESSION_BROWSE);
      clearSession(eid, SESSION_CHAPTER);
      renderExamSetup();
    });

    wrap.querySelectorAll('.scope-mode-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        BROWSE_MODE = btn.getAttribute('data-mode');
        renderExamSetup();
      });
    });

    var sel = document.getElementById('exam-year');
    var shuffleBox = document.getElementById('opt-shuffle');
    var unseenBox = document.getElementById('opt-unseen');

    /* 每個範圍「做過幾題／還沒做幾題」，選單一換就重算。這是站上「記得我做到哪裡」
       真正的呈現：它是從 attempts 導出來的，所以 87 個範圍全部自動有，跳題、換
       裝置、換題庫都不會失準。 */
    function refreshStat(){
      var el = document.getElementById('scope-stat');
      if(!el || !sel) return;
      var pool = examPoolFor(sel.value);
      if(!eid){
        el.innerHTML = '這個範圍共 <b>' + pool.length + '</b> 題。設定奇美人事號之後這裡會顯示你做過幾題。';
        return;
      }
      var seen = answeredIdSet(eid);
      var done = pool.filter(function(q){ return seen[q.id]; }).length;
      var left = pool.length - done;
      el.innerHTML = '這個範圍共 <b>' + pool.length + '</b> 題：做過 <b>' + done +
        '</b>、還沒做 <b>' + left + '</b>' +
        (left === 0 && pool.length ? '（整批都做過了，勾「只出沒做過的」會是空的）' : '');
    }
    if(sel) sel.addEventListener('change', refreshStat);
    refreshStat();

    if(shuffleBox) shuffleBox.addEventListener('change', function(){ BROWSE_SHUFFLE = shuffleBox.checked; });
    if(unseenBox) unseenBox.addEventListener('change', function(){ BROWSE_UNSEEN = unseenBox.checked; });

    var startBtn = document.getElementById('exam-start');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        var pool = examPoolFor(sel.value);
        if(BROWSE_UNSEEN && eid){
          var seen = answeredIdSet(eid);
          var unseen = pool.filter(function(q){ return !seen[q.id]; });
          if(!unseen.length){
            window.alert('這個範圍你每一題都做過了。取消「只出沒做過的」就能重看一遍。');
            return;
          }
          pool = unseen;
        }
        if(!pool.length) return;
        if(BROWSE_SHUFFLE) pool = shuffle(pool);
        vgnReturn = null; // a fresh browse must not offer a stale "back to the note"
        examBrowse = newBrowse(pool, 0, 0);
        saveBrowse();
        renderExamLive();
      });
    }
  }

  /* ---------- 題目瀏覽的計分與續作 ----------
     瀏覽器允許跳題、回頭重答，所以分數不能用「答對就 ++」累加，要記在以題目 id
     為鍵的表上（最後一次作答為準），重看同一題才不會重複計分。送分題不列入分母
     也不列入分子——它本來就不寫 exam_attempts。
     picked 另外記，讓跳回已作答過的題目時能還原當時選的選項與對錯標示。 */
  /* 這裡刻意不留「這批是哪個範圍」的欄位。續作是靠 question_ids 還原（三個題庫
     混在一起查），續作卡片的題庫名稱是從 pool[0] 反推的，沒有任何地方需要範圍
     key；留一個沒人讀的欄位只會讓下一個人以為可以拿它來還原範圍。 */
  function newBrowse(pool, idx, score){
    var start = Math.min(idx || 0, Math.max(pool.length - 1, 0));
    return {
      list: pool,
      idx: start,
      answered: false,
      results: {},
      picked: {},
      /* 續作回來時只救得回總分和位置（quiz_sessions 沒有逐題結果的欄位），所以把
         上一輪的「答對 N／已作答到第 M 題」當成基數繼續往上加。代價是回頭重答一題
         已經走過的題目會讓分母多算一題；為了逐題精確度去加一張表不值得。 */
      baseRight: score || 0,
      baseDone: score ? start : 0,
      /* 三個旗標各管一件事，不要合併——之前把「存進度」和「顯示分數」綁在同一個
         旗標上，重測錯題需要「計分但不存」時就得拆開，這裡不再重蹈覆轍：
           ephemeral 要不要存續作進度
           scored    要不要顯示分數與結算
           records   要不要把作答寫進 attempts（錯題、落點分析、做過統計）
         一般瀏覽三者全開；重測錯題計分也記錄但不存進度；從版本落差筆記跳過來查
         一題則三者全關——那是查閱，不是測驗。 */
      ephemeral: false,
      scored: true,
      records: true
    };
  }
  function browseScore(){
    var right = examBrowse.baseRight, done = examBrowse.baseDone;
    Object.keys(examBrowse.results).forEach(function(qid){
      done++;
      if(examBrowse.results[qid]) right++;
    });
    return { right: right, done: done };
  }
  function saveBrowse(){
    if(!examBrowse || examBrowse.ephemeral) return;
    var eid = getEmployeeId();
    if(!eid) return;
    var s = browseScore();
    saveSession(eid, { questions: examBrowse.list, idx: examBrowse.idx, score: s.right }, SESSION_BROWSE);
  }

  function examOptionKeys(q){
    return Object.keys(q.options || {}).sort();
  }

  /* 把 exam_questions 的一列攤平成共通的 quiz 形狀，讓考古題能跟章節題、18 篇並列
     在「我的紀錄」的錯題與收藏清單裡。**只用於顯示**——作答一律走 exam 形狀，見下面
     answerIndex 上的說明。

     chapterId 取 miller_chapters 的**第一章**（詳解裡最先引用的那一章），再經
     chapter_taxonomy 翻成站上筆記 id。52 題跨章題（48 題跨 2 章、3 題跨 3 章、
     1 題跨 4 章）因此只算進主章：若每一章都算，落點分析的分母會超過實際作答
     的題數，百分比就不再是「我在這類答對幾成」。其餘關聯章仍留在
     exam_questions.miller_chapters 裡，要做「這章有哪些題」時照樣查得到。 */
  function examToQuizShape(q){
    var keys = examOptionKeys(q);
    var firstCorrect = q.answer ? q.answer.charAt(0) : null;
    var chs = q.miller_chapters || [];
    return {
      id: q.id,
      chapterId: chs.length ? millerChapterNote(chs[0]) : null,
      question: q.question,
      options: keys.map(function(k){ return q.options[k]; }),
      /* answer 可能是 "AB" 這種複選／送分（線上實際有 9 題），這個形狀只留得住第一
         個字母。**所以考古題不能用這個形狀來作答**——判對錯一律在 exam 形狀上用
         q.answer.indexOf(選項) 比，完整字串還在。這個形狀現在只用於顯示（錯題與
         收藏清單），顯示不碰答案，所以無損。 */
      answerIndex: firstCorrect ? keys.indexOf(firstCorrect) : -1,
      explanation: q.explanation,
      isExam: true,
      examTag: q.year + ' 年考古題 第 ' + q.question_no + ' 題'
    };
  }

  /* ---------- 題庫範圍：三個題庫共用考古題那個瀏覽器 ----------
     轉換方向是「quiz 形狀 -> exam 形狀」，不是反過來。考古題的 answer 是字串，
     複選送分題會是 "AB" 這種多個字母；examToQuizShape() 只取第一個字母，所以
     若把考古題轉成 quiz 形狀丟進來，複選題的其餘正確選項會被標成錯的。章節題
     與 18 篇都是單選、沒有附圖、沒有送分題，往 exam 形狀轉是無損的。

     _orig 留著原本的 quiz 形狀物件：作答時交給 recordAttempt() 依 isExam /
     isPapers2026 路由到正確的 attempts 表，收藏也用 _source 標對來源。 */
  function quizToExamShape(q, source, label){
    var options = {};
    (q.options || []).forEach(function(t, i){ options[String.fromCharCode(65 + i)] = t; });
    return {
      id: q.id,
      question: q.question,
      options: options,
      answer: q.answerIndex >= 0 ? String.fromCharCode(65 + q.answerIndex) : null,
      explanation: q.explanation,
      void: false,
      has_image: false,
      images: [],
      explanation_images: [],
      chapterId: q.chapterId,
      _source: source,
      _label: label,
      _orig: q
    };
  }

  /* 跳題選單的標籤。考古題用年度題號，另外兩個題庫沒有年度題號，用序號加來源
     篇名（章名／論文篇名），否則 382 個選項會全部長得一樣。 */
  function browseLabel(item, i){
    if(item._label) return (i + 1) + '. ' + item._label;
    return item.year + ' 年 第 ' + item.question_no + ' 題';
  }

  function examExplainImages(q){
    var imgs = q.explanation_images;
    if(!imgs || !imgs.length) return '';
    return '<div class="exam-explain-images">' + imgs.map(function(item){
      var path = typeof item === 'string' ? item : item.path;
      var caption = typeof item === 'string' ? '' : (item.caption || '');
      return '<figure class="exam-explain-figure">' +
        '<img src="' + esc(path) + '" alt="詳解附圖" loading="lazy">' +
        (caption ? '<figcaption class="mono">' + esc(caption) + '</figcaption>' : '') +
        '</figure>';
    }).join('') + '</div>';
  }

  function examReveal(q){
    return (q.void ?
        '<div class="exam-void-badge">本題送分（所有選項皆列為正確）</div>' :
        '<div class="exam-answer-tag mono">正確答案：' + esc(q.answer || '—') + '</div>') +
      (q.reference ? '<div class="exam-ref mono">' + esc(q.reference) + '</div>' : '') +
      /* 章節題與 18 篇的詳解寫的是筆記體（含 ~~ 這類標記），要走 inline()；
         考古題的詳解是原文照登，維持 esc()。 */
      (q.explanation ? '<div class="exam-explain"><span class="tag">詳解</span><div class="exam-explain-body">' +
          (q._source ? inline(q.explanation) : esc(q.explanation)) + '</div></div>' :
        '<div class="exam-explain exam-explain-empty">本題原始資料沒有留下詳解文字。</div>') +
      examExplainImages(q) +
      /* 版本落差筆記是用年度＋題號對到考古題的，其他題庫沒有這兩個欄位 */
      (q._source ? '' : versionGapInline(q));
  }

  /* ================= 版本落差筆記 =================
     Curated Miller 9th->10th edition-gap / textbook-self-contradiction findings,
     compiled by the 麻專站專案 session as a by-product of the 2020-2025 考古題
     citation-verification pass (Supabase table version_gap_notes, schema v11,
     public read-only; source of truth is
     source_materials/version_gap_notes/version_gap_notes.json, re-seeded whenever
     new findings are added).

     Two entry points, both inside the 考古題 tab rather than a 9th top-level tab
     since every finding is derived from a 考古題: (1) an inline 提醒 appended to
     each question's 詳解 for the 85 questions some finding names, (2) a
     standalone year/category-filtered browser reached from the 考古題 setup
     screen. Each row carries a pre-parsed `refs` array ([{year, question_no,
     option}]) so neither side has to re-parse the compiler's free-text q_label
     ("Q96–97" with an en dash, "Q40-C/D", positionally-paired multi-year forms)
     at runtime -- that parsing happens once, offline, in the JSON build step.

     Three things the compiler asked be preserved on a public site and that this
     code deliberately enforces: the "not an official erratum" disclaimer shown
     verbatim, `flagged` entries kept visually distinct rather than presented as
     equal to the other 75, and the short Miller quotes rendered at their current
     length (never expanded into long passages). */

  var VGN_META = {
    title: '版本落差與教科書內部矛盾筆記',
    eyebrow: "Miller's Anesthesia 9th → 10th",
    lede: '整理自2020–2025年麻醉專科考古題「引註校對」專案過程中，逐題比對Miller\'s Anesthesia第九版、第十版原文時發現的版本差異、教科書內部前後矛盾，以及考題與教科書不符之處。',
    coverage: '2020–2025，共600題',
    compiled: '2026-09-15',
    disclaimer: [
      '這些發現來自逐題核對考古題詳解與Miller\'s Anesthesia原文時的副產品，不是官方勘誤，也未經出版社或考選部確認——列出的每一項都已盡量附上頁碼與逐字原文，供讀者自行核對，而非直接採信的結論。',
      '各年份查核深度：2020–2025 全部六年皆已完成逐題逐選項的第十版引註查證（含章節、頁碼、逐字英文引文核對）。',
      '官方答案在所有案例中均未變動——本文件純粹記錄「原文本身怎麼寫」與「考題認定方向」之間的落差，供讀者自行判斷。'
    ],
    footer: '頁碼與引文均對應Miller\'s Anesthesia第十版（Gropper主編）；第九版引文另行標註。'
  };

  function vgnAll(){
    return STATE.versionGapNotes.slice().sort(function(a,b){ return (a.sort_order||0) - (b.sort_order||0); });
  }

  /* PostgREST returns jsonb as a real array, but tolerate a string just in case
     an older deploy or a hand-edited row hands back raw JSON text. */
  function vgnJson(v){
    if(typeof v === 'string'){ try { return JSON.parse(v); } catch(e){ return []; } }
    return v || [];
  }
  function vgnRefs(n){ return vgnJson(n.refs); }
  function vgnQuotes(n){ return vgnJson(n.quotes); }

  function vgnRefMatches(r, year, questionNo){
    return Number(r.year) === Number(year) && Number(r.question_no) === Number(questionNo);
  }

  function vgnFor(year, questionNo){
    return vgnAll().filter(function(n){
      return vgnRefs(n).some(function(r){ return vgnRefMatches(r, year, questionNo); });
    });
  }

  /* which option letters this finding calls out for this specific question --
     the compiler tags many findings down to the option (e.g. "Q10-D") */
  function vgnOptionsFor(n, year, questionNo){
    var seen = {};
    vgnRefs(n).forEach(function(r){
      if(vgnRefMatches(r, year, questionNo) && r.option) seen[r.option] = true;
    });
    return Object.keys(seen).sort();
  }

  function vgnEntryHtml(n, ctxYear, ctxNo, withJumps){
    var opts = ctxYear ? vgnOptionsFor(n, ctxYear, ctxNo) : [];
    var badge = [n.year_label, n.q_label, n.ch_label].filter(function(s){ return !!s; }).join(' · ');
    var jumps = '';
    if(withJumps){
      var seen = {}, list = [];
      vgnRefs(n).forEach(function(r){
        var key = r.year + '-' + r.question_no;
        if(seen[key]) return;
        seen[key] = true;
        list.push(r);
      });
      jumps = list.length ? '<div class="vgn-jumps">' + list.map(function(r){
        return '<button class="vgn-jump mono" data-year="' + esc(r.year) + '" data-no="' + esc(r.question_no) +
          '" data-entry="' + esc(n.id) + '">' +
          '去看 ' + esc(r.year) + ' 第 ' + esc(r.question_no) + ' 題</button>';
      }).join('') + '</div>' : '';
    }
    /* only the browser gets a DOM id -- the inline copy inside a 詳解 renders the
       same entry, and two elements sharing an id would break the scroll-back */
    return '<div class="vgn-entry' + (n.flagged ? ' flagged' : '') + '"' +
      (withJumps ? ' id="vgn-entry-' + esc(n.id) + '"' : '') + '>' +
      '<div class="vgn-entry-head">' +
        (badge ? '<span class="vgn-badge mono">' + esc(badge) + '</span>' : '') +
        '<span class="vgn-cat mono">' + esc(n.category_title) + '</span>' +
        (opts.length ? '<span class="vgn-opt mono">對應選項 ' + esc(opts.join('、')) + '</span>' : '') +
        (n.flagged ? '<span class="vgn-flagtag mono">待確認</span>' : '') +
      '</div>' +
      '<div class="vgn-headline">' + esc(n.headline) + '</div>' +
      '<div class="vgn-detail">' + esc(n.detail) + '</div>' +
      vgnQuotes(n).map(function(qt){
        return '<div class="vgn-quote mono"><span class="pg">' + esc(qt.pg) + '</span>：「' + esc(qt.en) + '」</div>';
      }).join('') +
      (n.flagged ? '<div class="vgn-flagnote">整理者對這一則尚未完全確定，請與其餘已逐條對過第十版原文的項目分開看待。</div>' : '') +
      jumps +
      '</div>';
  }

  function versionGapInline(q){
    var notes = vgnFor(q.year, q.question_no);
    if(!notes.length) return '';
    return '<div class="vgn-inline">' +
      '<div class="vgn-inline-head">' +
        '<span class="tag">版本落差提醒</span>' +
        '<span class="vgn-inline-sub">本題在「版本落差筆記」中有 ' + notes.length + ' 則相關紀錄</span>' +
      '</div>' +
      notes.map(function(n){ return vgnEntryHtml(n, q.year, q.question_no, false); }).join('') +
      '<div class="vgn-inline-foot">讀者自行整理的核對筆記，非官方勘誤；官方答案均未變動。</div>' +
      '</div>';
  }

  var vgnFilter = { years: [], cats: [] };

  function vgnYears(){
    var seen = {};
    vgnAll().forEach(function(n){
      vgnRefs(n).forEach(function(r){ seen[r.year] = true; });
    });
    return Object.keys(seen).map(Number).sort();
  }

  function vgnCats(){
    var seen = {}, out = [];
    vgnAll().forEach(function(n){
      if(seen[n.category_id]) return;
      seen[n.category_id] = true;
      out.push({ id: n.category_id, title: n.category_title, desc: n.category_desc });
    });
    return out;
  }

  function vgnMatches(n){
    if(vgnFilter.cats.length && vgnFilter.cats.indexOf(n.category_id) < 0) return false;
    if(vgnFilter.years.length){
      var hit = vgnRefs(n).some(function(r){ return vgnFilter.years.indexOf(Number(r.year)) >= 0; });
      if(!hit) return false;
    }
    return true;
  }

  function vgnToggle(list, val){
    var i = list.indexOf(val);
    if(i >= 0) list.splice(i, 1); else list.push(val);
  }

  function renderVersionGapBrowser(scrollToId){
    var wrap = document.getElementById('exam-wrap');
    var all = vgnAll();
    if(!all.length){
      wrap.innerHTML = '<div class="vgn-page"><div class="empty-state" style="padding:20px 0;">版本落差筆記還沒上架。</div>' +
        '<div class="quiz-nav"><button class="btn btn-ghost" id="vgn-back">回考古題選單</button></div></div>';
      document.getElementById('vgn-back').addEventListener('click', renderExamSetup);
      return;
    }

    var shown = all.filter(vgnMatches);
    var cats = vgnCats();
    var byCat = {};
    shown.forEach(function(n){ (byCat[n.category_id] = byCat[n.category_id] || []).push(n); });

    wrap.innerHTML =
      '<div class="vgn-page">' +
        '<div class="vgn-masthead">' +
          '<div class="vgn-eyebrow mono">' + esc(VGN_META.eyebrow) + '</div>' +
          '<h2 class="vgn-title">' + esc(VGN_META.title) + '</h2>' +
          '<p class="vgn-lede">' + esc(VGN_META.lede) + '</p>' +
          '<div class="vgn-meta mono">涵蓋 ' + esc(VGN_META.coverage) + '　·　整理日期 ' + esc(VGN_META.compiled) +
            '　·　共 ' + all.length + ' 則</div>' +
          '<details class="vgn-scope"><summary>關於這份整理的範圍與限制</summary>' +
            VGN_META.disclaimer.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
          '</details>' +
        '</div>' +
        '<div class="vgn-controls">' +
          '<div class="vgn-chiprow"><span class="vgn-chiplabel mono">年份</span>' +
            vgnYears().map(function(y){
              return '<button class="vgn-chip' + (vgnFilter.years.indexOf(y) >= 0 ? ' active' : '') +
                '" data-kind="year" data-val="' + y + '">' + y + '</button>';
            }).join('') +
          '</div>' +
          '<div class="vgn-chiprow"><span class="vgn-chiplabel mono">分類</span>' +
            cats.map(function(c){
              return '<button class="vgn-chip' + (vgnFilter.cats.indexOf(c.id) >= 0 ? ' active' : '') +
                '" data-kind="cat" data-val="' + esc(c.id) + '">' + esc(c.title) + '</button>';
            }).join('') +
            ((vgnFilter.years.length || vgnFilter.cats.length) ?
              '<button class="vgn-chip vgn-clear" data-kind="clear" data-val="">清除篩選</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="vgn-body">' +
          (shown.length ? cats.filter(function(c){ return byCat[c.id] && byCat[c.id].length; }).map(function(c){
            return '<section class="vgn-section">' +
              '<div class="vgn-sec-head"><h3>' + esc(c.title) + '</h3>' +
                '<span class="vgn-sec-count mono">' + byCat[c.id].length + ' 則</span></div>' +
              '<p class="vgn-sec-desc">' + esc(c.desc) + '</p>' +
              byCat[c.id].map(function(n){ return vgnEntryHtml(n, null, null, true); }).join('') +
              '</section>';
          }).join('') : '<div class="empty-state" style="padding:20px 0;">目前篩選條件下沒有符合的項目。</div>') +
        '</div>' +
        '<div class="vgn-footer">' + esc(VGN_META.footer) + '</div>' +
        '<div class="quiz-nav"><button class="btn btn-ghost" id="vgn-back">回考古題選單</button></div>' +
      '</div>';

    wrap.querySelectorAll('.vgn-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        var kind = btn.getAttribute('data-kind');
        if(kind === 'clear'){ vgnFilter.years = []; vgnFilter.cats = []; }
        else if(kind === 'year') vgnToggle(vgnFilter.years, Number(btn.getAttribute('data-val')));
        else vgnToggle(vgnFilter.cats, btn.getAttribute('data-val'));
        renderVersionGapBrowser();
      });
    });

    wrap.querySelectorAll('.vgn-jump').forEach(function(btn){
      btn.addEventListener('click', function(){
        vgnJumpToQuestion(btn.getAttribute('data-year'), btn.getAttribute('data-no'), btn.getAttribute('data-entry'));
      });
    });

    document.getElementById('vgn-back').addEventListener('click', renderExamSetup);

    /* coming back from a question: put the reader back on the finding they left
       from, not at the top of a page that lists every entry (the entry count
       moves as findings get added or retracted, so don't quote it here) */
    if(scrollToId){
      var target = document.getElementById('vgn-entry-' + scrollToId);
      if(target){
        target.scrollIntoView({ block: 'center' });
        target.classList.add('vgn-returned');
      }
    }
  }

  /* jump straight from a finding to the 考古題 it describes, reusing the same
     single-year browse pool the year dropdown builds so the jump selector and
     上一題/下一題 keep working from there */
  function vgnJumpToQuestion(year, questionNo, entryId){
    var pool = STATE.examQuestions.filter(function(q){ return String(q.year) === String(year); });
    pool.sort(function(a,b){ return a.question_no - b.question_no; });
    var idx = -1;
    pool.forEach(function(q, i){ if(Number(q.question_no) === Number(questionNo)) idx = i; });
    if(idx < 0) return;
    vgnReturn = entryId || null;
    /* 從版本落差筆記跳過來是查一題，不是開一輪；標成 ephemeral 才不會把使用者
       原本存著的題目瀏覽進度洗掉。 */
    examBrowse = newBrowse(pool, idx, 0);
    examBrowse.ephemeral = true;
    examBrowse.scored = false;
    /* 從筆記跳過來是查閱：使用者剛讀完這題的討論才點進來，答對幾乎是必然的。
       記錄的話會讓落點分析的正確率虛高，還會把這題標成「做過」，於是「只出沒
       做過的」以後永遠不會再拿出來——76 則筆記指向 84 題，不是小數目。 */
    examBrowse.records = false;
    renderExamLive();
  }

  function renderExamLive(){
    var wrap = document.getElementById('exam-wrap');
    if(!examBrowse || !examBrowse.list.length){ renderExamSetup(); return; }
    var q = examBrowse.list[examBrowse.idx];
    var keys = examOptionKeys(q);
    var sc = browseScore();

    wrap.innerHTML =
      '<div class="exam-live">' +
        '<div class="exam-progress">' +
          '<span class="idx mono">第 ' + (examBrowse.idx+1) + ' / ' + examBrowse.list.length + ' 題</span>' +
          (!examBrowse.scored ? '' :
            '<span class="score mono" title="答對 / 已作答">' + sc.right + ' / ' + sc.done + '</span>') +
          '<select class="exam-year-tag mono" id="exam-jump" title="跳到指定題目">' +
            examBrowse.list.map(function(item, i){
              return '<option value="' + i + '"' + (i === examBrowse.idx ? ' selected' : '') + '>' +
                esc(browseLabel(item, i)) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<div class="exam-jump-hint">點上方選單可直接跳到指定題目</div>' +
        '<div class="exam-q">' + (q._source ? inline(q.question) : esc(q.question)) +
          '<button class="fav-star' + (isFavorited(q.id) ? ' active' : '') + '" id="exam-fav" title="收藏這題">&#9733;</button>' +
        '</div>' +
        (q.has_image && q.images && q.images.length ?
          '<div class="exam-images">' + q.images.map(function(p){
            return '<img src="' + esc(p) + '" alt="題目附圖" loading="lazy">';
          }).join('') + '</div>' : '') +
        '<div class="exam-options" id="exam-options"></div>' +
        '<div id="exam-reveal-slot"></div>' +
        '<div class="quiz-nav exam-nav">' +
          '<button class="btn btn-ghost" id="exam-prev"' + (examBrowse.idx === 0 ? ' disabled' : '') + '>上一題</button>' +
          (vgnReturn ? '<button class="btn btn-ghost" id="exam-vgn-back">&#8592; 回版本落差筆記</button>' : '') +
          '<button class="btn btn-ghost" id="exam-back">回選單</button>' +
          (examBrowse.scored && sc.done ?
            '<button class="btn btn-ghost" id="exam-finish">結算成績</button>' : '') +
          '<button class="btn btn-primary" id="exam-next"' + (examBrowse.idx >= examBrowse.list.length-1 ? ' disabled' : '') + '>下一題</button>' +
        '</div>' +
        /* 三種情境的說明要分開講，否則會對使用者說謊：一般瀏覽會存進度，重測錯題
           計分但不存，從版本落差筆記跳過來查一題則兩者都不做。
           三段都要明講作答紀錄怎麼處理：前兩條會寫 attempts、第三條不會（records
           旗標）。只要有一段沒講，使用者就會拿另外兩段去反推，而且會推反。 */
        '<div class="ctl-hint exam-nav-hint">' +
          (!examBrowse.scored
            ? '這是從版本落差筆記跳過來查的單題，目的是對照著看，所以不計分，' +
              '作答也不會記進錯題與落點分析，更不會影響你存著的瀏覽進度。'
            : examBrowse.ephemeral
              ? '「結算成績」看這一輪的正確率與答錯的題目。重測不另外存進度，離開就結束這一輪，但作答紀錄照常留著。'
              : '「結算成績」看這一輪的正確率與答錯的題目，看完可以回到原本那一題。' +
                '「回選單」會保留進度，下次進來接得下去；作答紀錄也一樣會留著。') +
        '</div>' +
      '</div>';

    var optWrap = document.getElementById('exam-options');
    keys.forEach(function(k){
      var b = document.createElement('button');
      b.className = 'opt-btn';
      b.innerHTML = '<span class="k mono">' + k + '</span><span>' +
        (q._source ? inline(q.options[k]) : esc(q.options[k])) + '</span>';
      b.addEventListener('click', function(){ examAnswerPick(k); });
      optWrap.appendChild(b);
    });

    function goTo(i){
      examBrowse.idx = i;
      examBrowse.answered = false;
      saveBrowse();
      renderExamLive();
    }
    document.getElementById('exam-jump').addEventListener('change', function(){
      goTo(parseInt(this.value, 10));
    });
    document.getElementById('exam-prev').addEventListener('click', function(){
      if(examBrowse.idx > 0) goTo(examBrowse.idx - 1);
    });
    document.getElementById('exam-next').addEventListener('click', function(){
      if(examBrowse.idx < examBrowse.list.length-1) goTo(examBrowse.idx + 1);
    });
    document.getElementById('exam-back').addEventListener('click', function(){
      examBrowse = null;
      vgnReturn = null;
      renderExamSetup();
    });
    var finishBtn = document.getElementById('exam-finish');
    if(finishBtn) finishBtn.addEventListener('click', renderExamSummary);
    var vgnBackBtn = document.getElementById('exam-vgn-back');
    if(vgnBackBtn) vgnBackBtn.addEventListener('click', function(){
      var entryId = vgnReturn;
      examBrowse = null;
      vgnReturn = null;
      renderVersionGapBrowser(entryId);
    });
    document.getElementById('exam-fav').addEventListener('click', function(){
      var btn = document.getElementById('exam-fav');
      toggleFavorite(q.id, q._source || 'exam', function(){ btn.classList.toggle('active', isFavorited(q.id)); });
    });

    /* 跳回作答過的題目要還原當時的選項標示，否則使用者會以為自己沒答過而重答，
       分母也跟著虛胖。examBrowse.answered 只管「這一次 render 有沒有剛作答」。 */
    if(examBrowse.answered){
      examShowResult(q);
    } else if(Object.prototype.hasOwnProperty.call(examBrowse.picked, q.id)){
      examBrowse.answered = true;
      examShowResult(q, examBrowse.picked[q.id]);
    }
  }

  function examAnswerPick(picked){
    if(examBrowse.answered) return;
    examBrowse.answered = true;
    var q = examBrowse.list[examBrowse.idx];
    examBrowse.picked[q.id] = picked;
    if(!q.void){
      var correct = !!(q.answer && q.answer.indexOf(picked) !== -1);
      examBrowse.results[q.id] = correct; // 本輪自己的計分，只活在記憶體裡
      if(examBrowse.records){
        /* 章節題與 18 篇要記進各自的 attempts 表，recordAttempt() 會依 _orig 上的
           isPapers2026 旗標路由；考古題維持原本直接寫 exam_attempts 的路徑，
           連送出的 selected_key 都不變。 */
        if(q._source){
          recordAttempt(q._orig, examOptionKeys(q).indexOf(picked), correct);
        } else {
          recordExamAttempt(q, picked, correct);
        }
      }
    }
    saveBrowse();
    examShowResult(q, picked);
    /* 分數跟結算按鈕都在上方那塊，作答完要讓它們跟上 */
    var scEl = document.querySelector('.exam-progress .score');
    var sc = browseScore();
    if(scEl) scEl.textContent = sc.right + ' / ' + sc.done;
    if(examBrowse.scored && !document.getElementById('exam-finish')){
      var nav = document.querySelector('.exam-nav');
      var nextBtn = document.getElementById('exam-next');
      if(nav && nextBtn){
        var b = document.createElement('button');
        b.className = 'btn btn-ghost';
        b.id = 'exam-finish';
        b.textContent = '結算成績';
        b.addEventListener('click', renderExamSummary);
        nav.insertBefore(b, nextBtn);
      }
    }
  }

  /* 計分結算。瀏覽器可以跳題、可以只做一部分，所以分母是「已作答」而不是整批題數，
     另外把這一輪答錯的列出來讓使用者直接跳回去看——長期的錯題清單仍在「我的紀錄」。 */
  function renderExamSummary(){
    if(!examBrowse) { renderExamSetup(); return; }
    var wrap = document.getElementById('exam-wrap');
    var sc = browseScore();
    var pct = sc.done ? Math.round(sc.right / sc.done * 100) : 0;
    var wrongIdx = [];
    examBrowse.list.forEach(function(item, i){
      if(examBrowse.results[item.id] === false) wrongIdx.push(i);
    });

    wrap.innerHTML =
      '<div class="exam-summary">' +
        '<div class="label">本輪結算</div>' +
        '<div class="final mono">' + sc.right + ' / ' + sc.done + '</div>' +
        '<div class="label">' + pct + '% 正確率（整批共 ' + examBrowse.list.length + ' 題）</div>' +
        (wrongIdx.length ?
          '<div class="exam-summary-wrong">' +
            '<h3>這一輪答錯的 ' + wrongIdx.length + ' 題</h3>' +
            wrongIdx.map(function(i){
              return '<button class="exam-summary-row" data-idx="' + i + '">' +
                '<span class="ch-tag mono">' + esc(browseLabel(examBrowse.list[i], i)) + '</span>' +
                '<span class="q-txt">' + esc(examBrowse.list[i].question) + '</span></button>';
            }).join('') +
          '</div>' :
          (sc.done ? '<div class="exam-summary-wrong"><h3>這一輪沒有答錯的題目</h3></div>' : '')) +
        '<div class="quiz-nav" style="justify-content:center;margin-top:24px;">' +
          '<button class="btn btn-ghost" id="exam-sum-back">回題目</button>' +
          '<button class="btn btn-primary" id="exam-sum-menu">回選單</button>' +
        '</div>' +
      '</div>';

    wrap.querySelectorAll('.exam-summary-row').forEach(function(btn){
      btn.addEventListener('click', function(){
        examBrowse.idx = parseInt(btn.getAttribute('data-idx'), 10);
        examBrowse.answered = false;
        renderExamLive();
      });
    });
    document.getElementById('exam-sum-back').addEventListener('click', function(){
      examBrowse.answered = false;
      renderExamLive();
    });
    document.getElementById('exam-sum-menu').addEventListener('click', function(){
      examBrowse = null;
      vgnReturn = null;
      renderExamSetup();
    });
  }

  function examShowResult(q, picked){
    var buttons = document.querySelectorAll('#exam-options .opt-btn');
    buttons.forEach(function(btn){
      btn.disabled = true;
      if(q.void) return; // 送分：所有選項皆算正確，不標示對錯
      var k = btn.querySelector('.k').textContent;
      var isCorrect = q.answer && q.answer.indexOf(k) !== -1;
      if(isCorrect) btn.classList.add('correct');
      else if(picked && k === picked) btn.classList.add('incorrect');
    });
    document.getElementById('exam-reveal-slot').innerHTML = examReveal(q);
  }

  /* ---------- oral (口試考古題) tab ---------- */
  var oralBrowse = null; // {key, list:[], idx:0, revealed:false}

  function oralGroups(){
    var years = {}, noYear = 0;
    STATE.oralQuestions.forEach(function(q){
      if(q.year == null){ noYear++; return; }
      years[q.year] = (years[q.year]||0) + 1;
    });
    var list = Object.keys(years).map(Number).sort(function(a,b){ return b - a; }).map(function(y){
      return { year: y, count: years[y] };
    });
    if(noYear) list.push({ year: null, count: noYear });
    return list;
  }

  var ORAL_STATION_LABEL = {
    case1: '第一題', case2: '第二題', tee: 'TEE 站', nb: '神經阻滯站', mock: '模擬口試',
    bank1: '考古題彙編一', bank2: '考古題彙編二', bank3: '考古題彙編三', assoc: '學會題庫'
  };

  function renderOralSetup(){
    var wrap = document.getElementById('oral-wrap');
    var years = oralGroups();
    var total = STATE.oralQuestions.length;
    var options = years.map(function(y){
      var val = y.year == null ? '__none__' : y.year;
      var label = y.year == null ? '年份不詳' : (y.year + ' 年');
      return '<option value="' + val + '">' + label + '（' + y.count + ' 題）</option>';
    }).join('');

    wrap.innerHTML =
      '<div class="exam-setup">' +
        '<h2>口試考古題</h2>' +
        (total ?
          '<label>選擇年度</label>' +
          '<select id="oral-year"><option value="__all__">全部年度混合（' + total + ' 題）</option>' + options + '</select>' +
          '<button class="btn btn-primary" id="oral-start">開始練習</button>' +
          '<div class="empty-state" style="padding:14px 0 0;font-size:12.5px;">' +
            '收錄近年官方口試考古題、模擬口試，以及歷年彙編筆記與學會題庫（部分為掃描辨識，內容如有疏漏請對照原始教科書）。' +
          '</div>'
        : '<div class="empty-state" style="padding:20px 0;">口試考古題資料還沒上架。</div>') +
      '</div>';

    var startBtn = document.getElementById('oral-start');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        var y = document.getElementById('oral-year').value;
        var pool = y === '__all__' ? STATE.oralQuestions.slice() :
          y === '__none__' ? STATE.oralQuestions.filter(function(q){ return q.year == null; }) :
          STATE.oralQuestions.filter(function(q){ return String(q.year) === y; });
        pool.sort(function(a,b){
          var ay = a.year == null ? -1 : a.year, by = b.year == null ? -1 : b.year;
          return ay - by || String(a.station).localeCompare(String(b.station));
        });
        oralBrowse = { list: shuffle(pool), idx: 0, revealed: false };
        renderOralLive();
      });
    }
  }

  function renderOralLive(){
    var wrap = document.getElementById('oral-wrap');
    if(!oralBrowse || !oralBrowse.list.length){ renderOralSetup(); return; }
    var q = oralBrowse.list[oralBrowse.idx];
    var stationLabel = ORAL_STATION_LABEL[q.station] || q.station;
    var yearLabel = q.year == null ? '年份不詳' : (q.year + ' 年');

    wrap.innerHTML =
      '<div class="exam-live">' +
        '<div class="exam-progress">' +
          '<span class="idx mono">第 ' + (oralBrowse.idx+1) + ' / ' + oralBrowse.list.length + ' 題</span>' +
          '<span class="exam-year-tag mono">' + esc(yearLabel) + '・' + esc(stationLabel) + '</span>' +
        '</div>' +
        (q.title ? '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-size:16px;">' + esc(q.title) + '</h3>' : '') +
        '<div class="exam-q">' + esc(q.scenario) + '</div>' +
        (q.has_image && q.images && q.images.length ?
          '<div class="exam-images">' + q.images.map(function(p){
            return '<img src="' + esc(p) + '" alt="題目附圖" loading="lazy">';
          }).join('') + '</div>' : '') +
        (q.sub_questions && q.sub_questions.length ?
          '<ol style="padding-left:20px;margin:0 0 18px;line-height:1.8;">' +
            q.sub_questions.map(function(sq){
              return '<li>' + esc(sq.text) + (sq.weight != null ? ' <span class="mono" style="color:var(--ink-faint);font-size:12px;">(' + sq.weight + '%)</span>' : '') + '</li>';
            }).join('') +
          '</ol>' : '') +
        '<button class="btn btn-primary" id="oral-reveal"' + (oralBrowse.revealed ? ' disabled' : '') + '>顯示參考答案</button>' +
        '<div id="oral-reveal-slot"></div>' +
        '<div class="quiz-nav exam-nav">' +
          '<button class="btn btn-ghost" id="oral-prev"' + (oralBrowse.idx === 0 ? ' disabled' : '') + '>上一題</button>' +
          '<button class="btn btn-ghost" id="oral-back">回選單</button>' +
          '<button class="btn btn-primary" id="oral-next"' + (oralBrowse.idx >= oralBrowse.list.length-1 ? ' disabled' : '') + '>下一題</button>' +
        '</div>' +
      '</div>';

    document.getElementById('oral-reveal').addEventListener('click', function(){
      oralBrowse.revealed = true;
      renderOralReveal(q);
      document.getElementById('oral-reveal').disabled = true;
    });
    document.getElementById('oral-prev').addEventListener('click', function(){
      if(oralBrowse.idx > 0){ oralBrowse.idx--; oralBrowse.revealed = false; renderOralLive(); }
    });
    document.getElementById('oral-next').addEventListener('click', function(){
      if(oralBrowse.idx < oralBrowse.list.length-1){ oralBrowse.idx++; oralBrowse.revealed = false; renderOralLive(); }
    });
    document.getElementById('oral-back').addEventListener('click', function(){
      oralBrowse = null;
      renderOralSetup();
    });

    if(oralBrowse.revealed) renderOralReveal(q);
  }

  function renderOralReveal(q){
    document.getElementById('oral-reveal-slot').innerHTML =
      '<div class="exam-explain"><span class="tag">參考答案</span><div class="exam-explain-body">' + esc(q.reference_answer || '（本題暫無參考答案）') + '</div></div>' +
      (q.source_file ? '<div class="exam-ref mono">出處：' + esc(q.source_file) + '</div>' : '');
  }

  /* ---------- mine tab ---------- */
  /* 「重測這些」走的也是考古題那個瀏覽器——站上現在只剩這一個作答介面。重測是臨時
     的一輪：計分、可結算，但不存進度（ephemeral），才不會蓋掉使用者原本存著的
     題庫瀏覽進度。錯題／收藏清單本來就隨時再算得出來，沒有記位置的必要。 */
  function startBrowseWithPool(pool){
    var items = browsePoolFromIds(pool.map(function(q){ return q.id; }));
    if(!items.length) return;
    vgnReturn = null;
    examBrowse = newBrowse(shuffle(items), 0, 0);
    examBrowse.ephemeral = true;
    setTab('exam');
    renderExamLive();
  }

  /* 哪幾個大類是展開的。renderMine() 在切分頁、重設基準、重測錯題之後都會整個
     重畫，不記著的話使用者每次都要重新點開同一類。只存在記憶體，不進 storage。 */
  var MINE_OPEN_CATS = {};

  function renderMine(){
    var wrap = document.getElementById('mine-wrap');
    var id = getEmployeeId();
    if(!id){
      wrap.innerHTML =
        '<div class="empty-state" style="margin:60px auto;text-align:center;">' +
          '尚未設定奇美人事號。<br><button class="btn btn-primary" style="margin-top:14px;" id="mine-set-id">設定奇美人事號</button>' +
        '</div>';
      document.getElementById('mine-set-id').addEventListener('click', function(){ promptEmployeeId(); renderMine(); });
      return;
    }

    var latestAll = latestAttemptsByQuestion(id);
    var baseline = getBaseline(id);
    var latest = latestAttemptsByQuestion(id, baseline);
    var qById = quizIndexById();

    var wrongQuestions = Object.keys(latestAll)
      .filter(function(qid){ return latestAll[qid].is_correct === false; })
      .map(function(qid){ return qById[qid]; })
      .filter(Boolean);

    var favQuestions = STATE.favorites
      .filter(function(f){ return f.employee_id === id; })
      .map(function(f){ return qById[f.question_id]; })
      .filter(Boolean);

    var byChapter = {};
    Object.keys(latest).forEach(function(qid){
      var q = qById[qid]; if(!q) return;
      var key = q.chapterId;
      if(!key) return; // 仍有極少數題目對不到筆記（例如章號指到還沒建筆記的章）
      byChapter[key] = byChapter[key] || { total: 0, correct: 0 };
      byChapter[key].total++;
      if(latest[qid].is_correct) byChapter[key].correct++;
    });
    /* 落點分兩層：主畫面是 13 大類（chapter_categories），點開才看到該類底下各篇
       筆記。原本只有筆記那一層，600 題考古題進來以後會長到 62 列、中位數只有 8
       題，單看一列說明不了什麼；大類把分母做厚，筆記層留著定位弱點。2026麻專18篇
       自成一類（cat-papers2026）。chapters 81 列目前都有 category_id，__uncat__
       只是防呆，正常不會出現。 */
    var catName = {}, catOrder = {};
    STATE.chapterCategories.forEach(function(c){ catName[c.id] = c.name; catOrder[c.id] = c.sort_order; });
    var byCat = {};
    Object.keys(byChapter).forEach(function(cid){
      var ch = findChapter(cid);
      var catId = (ch && ch.category_id) ? ch.category_id : '__uncat__';
      var s = byChapter[cid];
      var c = byCat[catId] || (byCat[catId] = { total: 0, correct: 0, notes: [] });
      c.total += s.total;
      c.correct += s.correct;
      c.notes.push({ title: ch ? ch.title : cid, total: s.total, correct: s.correct,
                     pct: Math.round(s.correct/s.total*100) });
    });
    var catStats = Object.keys(byCat).map(function(catId){
      var c = byCat[catId];
      c.notes.sort(function(a,b){ return a.pct - b.pct || b.total - a.total; });
      return {
        id: catId,
        name: catName[catId] || '未分類',
        order: catOrder[catId] == null ? 999 : catOrder[catId],
        total: c.total, correct: c.correct,
        pct: Math.round(c.correct/c.total*100),
        notes: c.notes
      };
    }).sort(function(a,b){ return a.pct - b.pct || a.order - b.order; });

    function statBar(pct){
      return '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
    }
    function catStatHtml(s){
      return '<details class="cat-stat" data-cat="' + esc(s.id) + '"' + (MINE_OPEN_CATS[s.id] ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="caret">&#9654;</span>' +
          '<span class="t">' + esc(s.name) + '</span>' +
          statBar(s.pct) +
          '<span class="mono pct">' + s.pct + '%</span>' +
          '<span class="mono n">' + s.correct + '/' + s.total + '</span>' +
        '</summary>' +
        '<div class="cat-stat-notes">' + s.notes.map(function(n){
          return '<div class="chapter-stat-row"><span class="t">' + esc(n.title) + '</span>' +
            statBar(n.pct) +
            '<span class="mono pct">' + n.pct + '%</span>' +
            '<span class="mono n">' + n.correct + '/' + n.total + '</span></div>';
        }).join('') + '</div>' +
      '</details>';
    }

    var totalAnswered = Object.keys(latest).length;
    var totalCorrect = Object.keys(latest).filter(function(qid){ return latest[qid].is_correct; }).length;

    function qList(list){
      if(!list.length) return '<div class="empty-state" style="padding:14px 0;">目前沒有題目</div>';
      return list.map(function(q){
        var ch = findChapter(q.chapterId);
        /* 考古題現在也有 chapterId 了，但這份清單要能認出是哪一年第幾題，
           所以年度題號優先於章名——章名在上面的落點區塊已經看得到。 */
        var tag = q.examTag || (ch ? ch.title : '');
        return '<div class="mine-q-row"><span class="ch-tag">' + esc(tag) + '</span><span class="q-txt">' + esc(q.question) + '</span></div>';
      }).join('');
    }

    wrap.innerHTML =
      '<h2>我的紀錄 <span class="mono" style="color:var(--ink-faint);font-size:13px;">奇美人事號 ' + esc(id) + '</span></h2>' +
      '<div class="mine-overall">整體作答 <b class="mono">' + totalCorrect + ' / ' + totalAnswered + '</b>' +
        (totalAnswered ? '（' + Math.round(totalCorrect/totalAnswered*100) + '%）' : '') + '</div>' +
      '<div class="mine-grid">' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>落點（依大類正確率，由低到高）</h3>' +
            '<button class="btn btn-ghost" id="reset-baseline">重新開始這一輪</button></div>' +
          '<div class="baseline-note">' + (baseline ? '統計區間：' + esc(new Date(baseline).toLocaleString('zh-TW')) + ' 之後' : '統計區間：從第一次作答至今') + '</div>' +
          (catStats.length ?
            '<div class="cat-stat-list">' + catStats.map(catStatHtml).join('') + '</div>' +
            '<div class="cat-stat-foot">點一下大類可以展開該類底下各篇筆記的正確率。' +
              '百分比後面是「答對／已作答」的實際題數，題數太少的那幾列參考價值不高。<br>' +
              '「重新開始這一輪」只是把統計的起算點移到現在，作答紀錄、錯題和收藏都不會刪掉。</div>'
            : '<div class="empty-state" style="padding:14px 0;">' + (baseline ? '這一輪還沒有作答紀錄' : '還沒有作答紀錄') + '</div>') +
        '</div>' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>錯題（' + wrongQuestions.length + '）</h3>' +
            (wrongQuestions.length ? '<button class="btn btn-ghost" id="retry-wrong">重測這些</button>' : '') + '</div>' +
          '<div class="ctl-hint">最近一次答錯的題目。答對了就會自動從這裡消失。' +
            '「重測這些」會把它們打散後送進題目瀏覽器，計分但不另外存進度。</div>' +
          qList(wrongQuestions) +
        '</div>' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>收藏（' + favQuestions.length + '）</h3>' +
            (favQuestions.length ? '<button class="btn btn-ghost" id="retry-fav">重測這些</button>' : '') + '</div>' +
          '<div class="ctl-hint">作答時按題目右上角的星星就會收藏。再按一次取消。</div>' +
          qList(favQuestions) +
        '</div>' +
      '</div>';

    var retryWrongBtn = document.getElementById('retry-wrong');
    if(retryWrongBtn) retryWrongBtn.addEventListener('click', function(){ startBrowseWithPool(wrongQuestions); });
    var retryFavBtn = document.getElementById('retry-fav');
    if(retryFavBtn) retryFavBtn.addEventListener('click', function(){ startBrowseWithPool(favQuestions); });
    document.getElementById('reset-baseline').addEventListener('click', function(){
      resetBaseline(id, renderMine);
    });
    wrap.querySelectorAll('.cat-stat').forEach(function(d){
      d.addEventListener('toggle', function(){ MINE_OPEN_CATS[d.getAttribute('data-cat')] = d.open; });
    });
  }

  /* ---------- admin tab ---------- */
  function renderAdmin(){
    var wrap = document.getElementById('admin-wrap');
    var unlocked = false;
    try { unlocked = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; } catch(e){}

    if(!unlocked){
      wrap.innerHTML =
        '<div class="admin-gate">' +
          '<h2>後台通關密語</h2>' +
          '<input type="password" id="admin-pass" placeholder="輸入通關密語" autocomplete="off">' +
          '<button class="btn btn-primary" id="admin-unlock">進入</button>' +
          '<div class="form-status" id="admin-status"></div>' +
        '</div>';
      document.getElementById('admin-unlock').addEventListener('click', function(){
        var v = document.getElementById('admin-pass').value;
        if(v === ADMIN_PASSPHRASE){
          try { sessionStorage.setItem(ADMIN_SESSION_KEY, '1'); } catch(e){}
          renderAdmin();
        } else {
          setStatus('admin-status', '密語不對，再試一次', false);
        }
      });
      return;
    }

    /* 後台的兩個用途（使用者 2026-09-24 定的）：教學用要知道「大家哪裡弱」，成果
       發表要整體數字。所以主畫面一律是彙總，個人只留最後一張摘要表。

       原本這裡只讀 STATE.attempts，漏掉了考古題與 2026麻專18篇 的作答——那是
       兩倍以上的資料量，等於後台一直只看到全部作答的三分之一。改用 allAttempts()。 */
    var atts = allAttempts();
    var qById = quizIndexById();

    var people = {}, months = {}, byQ = {}, byCat = {};
    var catName = {}, catOrder = {};
    STATE.chapterCategories.forEach(function(c){ catName[c.id] = c.name; catOrder[c.id] = c.sort_order; });

    atts.forEach(function(a){
      var p = people[a.employee_id] || (people[a.employee_id] = { total: 0, correct: 0, last: a.answered_at });
      p.total++; if(a.is_correct) p.correct++;
      if(new Date(a.answered_at) > new Date(p.last)) p.last = a.answered_at;

      var mk = String(a.answered_at).slice(0, 7); // YYYY-MM
      var m = months[mk] || (months[mk] = { total: 0, correct: 0, people: {} });
      m.total++; if(a.is_correct) m.correct++; m.people[a.employee_id] = true;

      var qs = byQ[a.question_id] || (byQ[a.question_id] = { total: 0, correct: 0 });
      qs.total++; if(a.is_correct) qs.correct++;

      var q = qById[a.question_id];
      var ch = q ? findChapter(q.chapterId) : null;
      var cid = (ch && ch.category_id) ? ch.category_id : null;
      if(cid){
        var c = byCat[cid] || (byCat[cid] = { total: 0, correct: 0 });
        c.total++; if(a.is_correct) c.correct++;
      }
    });

    var users = Object.keys(people).sort(function(a, b){ return people[b].total - people[a].total; });
    var totalAtt = atts.length;
    var totalRight = atts.filter(function(a){ return a.is_correct; }).length;
    var distinctQ = Object.keys(byQ).length;
    var bankTotal = STATE.examQuestions.length + allQuestions().length + STATE.papers2026Quiz.length;
    var lastAt = atts.reduce(function(acc, a){
      return (!acc || new Date(a.answered_at) > new Date(acc)) ? a.answered_at : acc;
    }, null);

    function tile(n, label, sub){
      return '<div class="stat-tile"><div class="n mono">' + n + '</div><div class="l">' + label + '</div>' +
        (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
    }
    function pctBar(pct){
      return '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
    }

    /* 成果發表用：整體規模。人數刻意不列名字。 */
    var overview =
      '<h3>整體概況</h3>' +
      '<div class="stat-tiles">' +
        tile(users.length, '使用人數') +
        tile(totalAtt, '總作答次數') +
        tile(totalAtt ? Math.round(totalRight / totalAtt * 100) + '%' : '—', '整體正確率') +
        tile(distinctQ, '被作答過的題目', '題庫共 ' + bankTotal + ' 題') +
      '</div>' +
      (lastAt ? '<div class="admin-note">最近一次作答：' + esc(new Date(lastAt).toLocaleString('zh-TW')) + '</div>' : '');

    /* 成果發表用：有沒有在成長。按月看比按日穩定，資料少的時候也還讀得出趨勢。 */
    var mKeys = Object.keys(months).sort();
    var mMax = mKeys.reduce(function(a, k){ return Math.max(a, months[k].total); }, 0);
    var trend =
      '<h3>每月作答趨勢</h3>' +
      (mKeys.length ?
        '<div class="month-rows">' + mKeys.map(function(k){
          var m = months[k];
          var pct = Math.round(m.correct / m.total * 100);
          return '<div class="month-row">' +
            '<span class="mono mk">' + esc(k) + '</span>' +
            '<div class="bar"><div class="bar-fill" style="width:' + Math.round(m.total / mMax * 100) + '%"></div></div>' +
            '<span class="mono v">' + m.total + ' 題</span>' +
            '<span class="mono v2">' + Object.keys(m.people).length + ' 人</span>' +
            '<span class="mono v2">正確 ' + pct + '%</span>' +
          '</div>';
        }).join('') + '</div>'
        : '<div class="empty-state" style="padding:14px 0;">尚無資料</div>');

    /* 教學用：哪一類大家最弱。跟「我的紀錄」的落點同一套分類，但這裡是所有人合計。 */
    var catRows = Object.keys(byCat).map(function(cid){
      var c = byCat[cid];
      return { id: cid, name: catName[cid] || cid, order: catOrder[cid] == null ? 999 : catOrder[cid],
               total: c.total, correct: c.correct, pct: Math.round(c.correct / c.total * 100) };
    }).sort(function(a, b){ return a.pct - b.pct || a.order - b.order; });
    var weak =
      '<h3>各大類正確率（全部人合計，由低到高）</h3>' +
      '<div class="admin-note">最上面幾類就是教學最該補的地方。題數太少的那幾列參考價值不高。</div>' +
      (catRows.length ?
        catRows.map(function(s){
          return '<div class="chapter-stat-row"><span class="t">' + esc(s.name) + '</span>' +
            pctBar(s.pct) + '<span class="mono pct">' + s.pct + '%</span>' +
            '<span class="mono n">' + s.correct + '/' + s.total + '</span></div>';
        }).join('')
        : '<div class="empty-state" style="padding:14px 0;">尚無資料</div>');

    /* 教學用：大家都答錯的題目。低正確率有兩種可能——題目真的難，或題目本身有問題；
       後者靠這張表才抓得出來。門檻設 3 次是為了濾掉只有一個人答過一次的雜訊。 */
    var MIN_ATT = 3, HARD_PCT = 50;
    var hard = Object.keys(byQ).map(function(qid){
      var s = byQ[qid];
      return { id: qid, total: s.total, correct: s.correct, pct: Math.round(s.correct / s.total * 100) };
    }).filter(function(s){ return s.total >= MIN_ATT && s.pct < HARD_PCT; })
      .sort(function(a, b){ return a.pct - b.pct || b.total - a.total; })
      .slice(0, 25);
    var hardHtml =
      '<h3>最多人答錯的題目</h3>' +
      '<div class="admin-note">至少被作答 ' + MIN_ATT + ' 次、正確率低於 ' + HARD_PCT + '% 的題目，最多列 25 題。' +
        '正確率特別低的題目值得回頭看一眼——有可能是題目或詳解本身有問題。</div>' +
      (hard.length ?
        '<div class="table-wrap"><table class="admin-table">' +
          '<thead><tr><th>正確率</th><th>作答次數</th><th>來源</th><th>題目</th></tr></thead><tbody>' +
          hard.map(function(s){
            var q = qById[s.id];
            var ch = q ? findChapter(q.chapterId) : null;
            var tag = (q && q.examTag) || (ch ? ch.title : '');
            return '<tr><td class="mono">' + s.pct + '%</td><td class="mono">' + s.total + '</td>' +
              '<td>' + esc(tag) + '</td><td>' + esc(q ? q.question : s.id) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<div class="empty-state" style="padding:14px 0;">還沒有題目達到門檻</div>');

    /* 個人摘要留著——這是使用者原本做後台的目的。但只到摘要為止，不再列逐筆流水帳：
       那張表幫不上教學也幫不上發表，卻把每個人答錯哪一題攤在別人面前。 */
    var perPerson =
      '<h3>個人摘要</h3>' +
      '<div class="table-wrap"><table class="admin-table">' +
        '<thead><tr><th>奇美人事號</th><th>已答題數</th><th>答對數</th><th>正確率</th><th>最近作答</th></tr></thead>' +
        '<tbody>' + (users.length ? users.map(function(u){
          var s = people[u];
          return '<tr><td class="mono">' + esc(u) + '</td><td class="mono">' + s.total + '</td><td class="mono">' + s.correct + '</td>' +
            '<td class="mono">' + Math.round(s.correct / s.total * 100) + '%</td>' +
            '<td class="mono">' + esc(new Date(s.last).toLocaleString('zh-TW')) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty-state">目前還沒有任何作答紀錄</td></tr>') + '</tbody>' +
      '</table></div>';

    wrap.innerHTML =
      '<div class="admin-bar"><h2>後台：作答情形</h2><button class="btn btn-ghost" id="admin-lock">鎖定</button></div>' +
      overview + trend + weak + hardHtml + perPerson;

    document.getElementById('admin-lock').addEventListener('click', function(){
      try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch(e){}
      renderAdmin();
    });
  }

  /* ---------- add tab ---------- */
  function renderAdd(){
    var wrap = document.getElementById('add-wrap');
    var chapterOptions = allChapters().slice().sort(function(a,b){ return (a.num||999)-(b.num||999); })
      .map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.title) + '</option>'; }).join('');

    wrap.innerHTML =
      '<div class="form-card">' +
        '<h2>新增章節</h2>' +
        '<p class="hint">支援簡易語法：<code># / ## / ###</code> 標題、<code>- </code> 項目符號（每兩個空格縮排一層）、<code>**粗體**</code>、<code>&gt; 提醒文字</code>、<code>|欄位|欄位|</code> 表格列。送出後所有人打開網站都會看到。</p>' +
        '<div class="field"><label>章節標題</label><input type="text" id="new-chapter-title" placeholder="例如：Ch88 新章節主題"></div>' +
        '<div class="field"><label>內容</label><textarea id="new-chapter-body" placeholder="## 小標題&#10;- 重點一&#10;- 重點二"></textarea></div>' +
        '<button class="btn btn-primary" id="new-chapter-submit">新增章節</button>' +
        '<div class="form-status" id="new-chapter-status"></div>' +
      '</div>' +
      '<div class="form-card">' +
        '<h2>新增測驗題目</h2>' +
        '<div class="field"><label>所屬章節</label><select id="new-q-chapter">' + chapterOptions + '</select></div>' +
        '<div class="field"><label>題目</label><input type="text" id="new-q-text" placeholder="輸入題目敘述"></div>' +
        '<div class="field"><label>選項（點選圓圈標記正確答案）</label>' +
          [0,1,2,3].map(function(i){
            return '<div class="opt-row"><input type="radio" name="new-q-answer" value="' + i + '"' + (i===0?' checked':'') + '><input type="text" id="new-q-opt-' + i + '" placeholder="選項 ' + String.fromCharCode(65+i) + '"></div>';
          }).join('') +
        '</div>' +
        '<div class="field"><label>解析</label><textarea id="new-q-explain" style="min-height:90px;font-family:var(--font-body);"></textarea></div>' +
        '<button class="btn btn-primary" id="new-q-submit">新增題目</button>' +
        '<div class="form-status" id="new-q-status"></div>' +
      '</div>';

    document.getElementById('new-chapter-submit').addEventListener('click', submitNewChapter);
    document.getElementById('new-q-submit').addEventListener('click', submitNewQuestion);
  }

  function setStatus(elId, msg, ok){
    var s = document.getElementById(elId);
    s.textContent = msg;
    s.className = 'form-status ' + (ok ? 'ok' : 'err');
  }

  function submitNewChapter(){
    var title = document.getElementById('new-chapter-title').value.trim();
    var body = document.getElementById('new-chapter-body').value;
    if(!title){ setStatus('new-chapter-status', '請填寫章節標題', false); return; }
    var blocks = parseBody(body);
    var btn = document.getElementById('new-chapter-submit');
    btn.disabled = true;
    setStatus('new-chapter-status', '儲存中…', true);
    sbInsert('chapters', { id: uid('user-ch'), num: null, title: title, blocks: blocks })
      .then(function(row){
        STATE.chapters.push(row);
        setStatus('new-chapter-status', '已新增，所有人都看得到了。', true);
        document.getElementById('new-chapter-title').value = '';
        document.getElementById('new-chapter-body').value = '';
        renderAdd();
      })
      .catch(function(err){
        setStatus('new-chapter-status', '儲存失敗：' + err.message, false);
        btn.disabled = false;
      });
  }

  function submitNewQuestion(){
    var chapterId = document.getElementById('new-q-chapter').value;
    var question = document.getElementById('new-q-text').value.trim();
    var options = [0,1,2,3].map(function(i){ return document.getElementById('new-q-opt-' + i).value.trim(); });
    var answerIndex = parseInt((document.querySelector('input[name=new-q-answer]:checked') || {}).value || '0', 10);
    var explanation = document.getElementById('new-q-explain').value.trim();
    if(!question || options.some(function(o){ return !o; })){
      setStatus('new-q-status', '請填寫題目與全部四個選項', false); return;
    }
    var btn = document.getElementById('new-q-submit');
    btn.disabled = true;
    setStatus('new-q-status', '儲存中…', true);
    sbInsert('questions', {
      id: uid('user-q'), chapter_id: chapterId, question: question,
      options: options, answer_index: answerIndex, explanation: explanation
    }).then(function(row){
      STATE.questions.push({
        id: row.id, chapterId: row.chapter_id, question: row.question,
        options: row.options, answerIndex: row.answer_index, explanation: row.explanation
      });
      setStatus('new-q-status', '已新增，所有人都看得到了。', true);
      document.getElementById('new-q-text').value = '';
      [0,1,2,3].forEach(function(i){ document.getElementById('new-q-opt-' + i).value = ''; });
      document.getElementById('new-q-explain').value = '';
      renderAdd();
    }).catch(function(err){
      setStatus('new-q-status', '儲存失敗：' + err.message, false);
      btn.disabled = false;
    });
  }

  /* ================= boot ================= */
  function boot(){
    root.innerHTML = '<div class="empty-state" style="margin:auto;">載入中…</div>';
    loadAll().then(function(){
      // normalize question rows (Postgres snake_case -> the shape the rest of the app expects)
      STATE.questions = STATE.questions.map(function(q){
        return {
          id: q.id, chapterId: q.chapterId || q.chapter_id, question: q.question,
          options: q.options, answerIndex: (q.answerIndex != null ? q.answerIndex : q.answer_index),
          explanation: q.explanation
        };
      });
      renderShell();
      setTab('read');
    }).catch(function(err){
      root.innerHTML = '<div class="empty-state" style="margin:auto;">資料載入失敗：' + esc(err.message) + '<br>請重新整理頁面再試一次。</div>';
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
