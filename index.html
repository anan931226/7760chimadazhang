<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻專站</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F6F4EC;
  --panel:#FFFFFF;
  --panel-2:#EDEAE0;
  --line:#DAD5C5;
  --line-soft:#E4DFD0;
  --ink:#22221B;
  --ink-dim:#68655A;
  --ink-faint:#98958A;
  --ecg:#2A6F63;
  --ecg-dim:#1D544A;
  --ecg-soft:#DCEAE4;
  --spo2:#3D6E8C;
  --spo2-soft:#E1EAF0;
  --resp:#C1622A;
  --resp-soft:#F7E3D3;
  --nibp:#B23A2E;
  --nibp-soft:#FBE6E1;
  --sec-eval:#A2701E;
  --sec-eval-soft:#F3E7CD;
  --sec-app:#A85A3A;
  --sec-app-soft:#F1E0D6;
  --mark-bg:#F4DFA0;
  --ink-on-accent:#FFFFFF;
  --radius-card:10px;
  --radius-ctl:6px;
  --font-display:"Source Serif 4","Noto Serif TC",Georgia,serif;
  --font-body:"Noto Sans TC","IBM Plex Sans",sans-serif;
  --font-ui:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B17;
    --panel:#242320;
    --panel-2:#2C2A24;
    --line:#3B382F;
    --line-soft:#332F27;
    --ink:#ECE8DC;
    --ink-dim:#A9A497;
    --ink-faint:#726D60;
    --ecg:#5CC9B6;
    --ecg-dim:#2A9578;
    --ecg-soft:#1E332E;
    --spo2:#6FA8C9;
    --spo2-soft:#20303A;
    --resp:#E68A52;
    --resp-soft:#3A2416;
    --nibp:#F1836A;
    --nibp-soft:#3C1F18;
    --sec-eval:#E0B563;
    --sec-eval-soft:#372B15;
    --sec-app:#D08865;
    --sec-app-soft:#35211A;
    --mark-bg:#4A3A1E;
    --ink-on-accent:#12211D;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1B17;
  --panel:#242320;
  --panel-2:#2C2A24;
  --line:#3B382F;
  --line-soft:#332F27;
  --ink:#ECE8DC;
  --ink-dim:#A9A497;
  --ink-faint:#726D60;
  --ecg:#5CC9B6;
  --ecg-dim:#2A9578;
  --ecg-soft:#1E332E;
  --spo2:#6FA8C9;
  --spo2-soft:#20303A;
  --resp:#E68A52;
  --resp-soft:#3A2416;
  --nibp:#F1836A;
  --nibp-soft:#3C1F18;
  --sec-eval:#E0B563;
  --sec-eval-soft:#372B15;
  --sec-app:#D08865;
  --sec-app-soft:#35211A;
  --mark-bg:#4A3A1E;
  --ink-on-accent:#12211D;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}
::selection{background:var(--ecg-dim);color:#fff;}

a{color:var(--spo2);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ---------- app shell ---------- */
#root{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:24px;
  padding:0 20px;height:56px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.topbar .brand{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--font-display);
  font-weight:700;letter-spacing:.02em;
  font-size:18px;color:var(--ink);
  white-space:nowrap;
}
.topbar .brand .pulse{color:var(--ecg);font-size:15px;}
.topbar .brand .sub{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);
  letter-spacing:.12em;text-transform:uppercase;
}
.tabs{display:flex;gap:4px;margin-left:auto;}
.topbar .author{
  margin-left:12px;padding-left:12px;border-left:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  white-space:nowrap;letter-spacing:.02em;
}
.topbar .author .handle{color:var(--ink-dim);}
.theme-toggle{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-dim);border-radius:999px;width:32px;height:32px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  margin-left:12px;transition:color .15s ease,border-color .15s ease;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink-faint);}
.tab-btn{
  appearance:none;border:1px solid transparent;background:transparent;
  color:var(--ink-dim);font-family:var(--font-ui);font-weight:600;
  font-size:14px;letter-spacing:.02em;padding:8px 14px;border-radius:var(--radius-ctl);
  cursor:pointer;transition:color .15s ease,background .15s ease;
}
.tab-btn:hover{color:var(--ink);background:var(--panel-2);}
.tab-btn.active{color:var(--ink-on-accent);background:var(--ecg);}
.tab-btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}

.view{flex:1;display:none;min-height:0;}
.view.active{display:flex;}

/* ---------- read view ---------- */
#view-read{width:100%;}
.sidebar{
  width:300px;flex:none;
  border-right:1px solid var(--line);
  background:var(--panel);
  display:flex;flex-direction:column;
  max-height:calc(100vh - 56px);
}
.sidebar-search{padding:14px;border-bottom:1px solid var(--line);}
.sidebar-search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--radius-ctl);padding:9px 11px;
  font-size:13.5px;
}
.sidebar-search input:focus-visible{outline:2px solid var(--spo2);outline-offset:1px;}
.sidebar-search .count{
  margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
}
.chapter-list{overflow-y:auto;flex:1;padding:6px;}
.chapter-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-ctl);
  border-left:2px solid transparent;
  cursor:pointer;color:var(--ink-dim);
}
.chapter-item:hover{background:var(--panel-2);color:var(--ink);}
.chapter-item.active{
  background:var(--panel-2);color:var(--ink);
  border-left:2px solid var(--ecg);
}
.chapter-item .t{font-size:13px;line-height:1.35;}
.chapter-item .badge{
  margin-left:auto;flex:none;font-family:var(--font-mono);font-size:9px;
  color:var(--ecg);border:1px solid var(--ecg-dim);border-radius:3px;padding:1px 4px;
}

.content-pane{flex:1;overflow-y:auto;min-width:0;}
.content-inner{max-width:720px;margin:0 auto;padding:40px 32px 100px;}
.content-inner h1.chapter-title{
  font-family:var(--font-display);font-weight:700;font-size:30px;
  letter-spacing:.01em;margin:0 0 6px;text-wrap:balance;color:var(--ink);
}
.chapter-meta{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px;
}
.chapter-credit{font-size:12px;color:var(--ink-faint);margin:-10px 0 18px;}
.content-inner hr.divider{border:none;border-top:1px solid var(--line);margin:0 0 28px;}

.block-h2{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--ink);margin:30px 0 12px;text-wrap:balance;}
hr.content-divider{border:none;border-top:2px dashed var(--line);margin:40px 0;}
.block-h3{
  font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);
  margin:24px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:.55em;
}
.block-h3::before{content:"";width:16px;height:3px;background:var(--sec-accent,var(--ecg));display:inline-block;border-radius:2px;flex:0 0 auto;}
.block-h4{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink-dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
.block-p{margin:10px 0;color:var(--ink);}
.block-li{
  display:flex;gap:10px;margin:7px 0;padding-left:2px;
}
.block-li .bullet{flex:none;color:var(--sec-accent,var(--ecg));font-family:var(--font-mono);padding-top:2px;}
.block-li .txt{flex:1;min-width:0;}
.block-li.indent-0{margin-left:0;}
.block-li.indent-1{margin-left:22px;}
.block-li.indent-2{margin-left:44px;}
.block-li.indent-3{margin-left:66px;}
.block-li.indent-1 .bullet,.block-li.indent-2 .bullet,.block-li.indent-3 .bullet{color:var(--spo2);opacity:.8;}

.block-quote{
  margin:16px 0;padding:12px 14px;background:var(--resp-soft);
  border-left:3px solid var(--resp);border-radius:0 var(--radius-ctl) var(--radius-ctl) 0;
  color:var(--ink);
}
.block-quote .tag{
  font-family:var(--font-mono);font-size:10px;color:var(--resp);
  letter-spacing:.1em;margin-right:8px;
}

.block-link{margin:6px 0 20px;}
.block-link a{
  display:inline-block;padding:9px 14px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--radius-ctl);
  color:var(--spo2);font-size:13px;text-decoration:none;
}
.block-link a:hover{border-color:var(--spo2);}

.jump-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px;}
.jump-nav a{
  font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);text-decoration:none;
}
.jump-nav a:hover{border-color:var(--ecg);color:var(--ecg);}
.jump-nav a.jump-nav-mock{border-style:dashed;color:var(--spo2);}
.jump-nav a.jump-nav-mock:hover{border-color:var(--spo2);color:var(--spo2);}

#view-papers2026 table.block-table td{white-space:normal;}
#view-papers2026 .block-h3{scroll-margin-top:16px;}

/* section-card: colored background block per BEAR section (Background/Evaluation/Application) */
#view-papers2026 .sec-card{
  border-radius:var(--radius-card);border:1px solid var(--line);
  padding:18px 20px 20px;margin:0 0 20px;
}
#view-papers2026 .sec-card.sec-bg{--sec-accent:var(--spo2);background:var(--spo2-soft);}
#view-papers2026 .sec-card.sec-eval{--sec-accent:var(--sec-eval);background:var(--sec-eval-soft);}
#view-papers2026 .sec-card.sec-app{--sec-accent:var(--sec-app);background:var(--sec-app-soft);}
#view-papers2026 .sec-card > .block-h3:first-child{margin-top:0;}
#view-papers2026 .sec-card table.block-table th,
#view-papers2026 .sec-card table.block-table:not(:has(thead)) tr:first-child td{
  background:color-mix(in srgb, var(--sec-accent) 22%, var(--panel));
  color:var(--sec-accent);
}
#view-papers2026 .sec-card table.block-table tbody tr:nth-child(even) td{
  background:color-mix(in srgb, var(--sec-accent) 7%, var(--panel));
}
#view-papers2026 .sec-card .block-callout{
  background:color-mix(in srgb, var(--sec-accent) 15%, var(--panel));
  border-left-color:var(--sec-accent);
}
#view-papers2026 .sec-card .block-callout.callout-info{border-left-color:var(--ecg);}
#view-papers2026 .sec-card .block-callout.callout-warn{border-left-color:var(--resp);}

.mock-exam-section{margin-top:8px;}
.mock-exam-heading{font-family:var(--font-display);font-size:16px;margin:28px 0 14px;color:var(--ink);}
.mock-quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px;margin-bottom:14px;}
.mock-oral-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px;margin-bottom:14px;}
.mock-oral-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin-bottom:8px;}
.mock-oral-scenario{font-size:13.5px;line-height:1.7;color:var(--ink);margin-bottom:10px;}
.mock-oral-subq{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-dim);}
.mock-oral-toggle{margin-bottom:10px;}
.mock-oral-answer-list{margin:0;padding-left:16px;font-size:13px;line-height:1.75;color:var(--ink-dim);}
.mock-oral-answer-list li{margin-bottom:4px;}

.block-img{margin:18px 0;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-ctl);text-align:center;}
.block-img img{max-width:100%;height:auto;border-radius:3px;display:inline-block;}
.block-img figcaption{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--ink-dim);text-align:left;}

.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius-ctl);}
table.block-table{border-collapse:collapse;width:100%;font-size:13.5px;}
table.block-table td, table.block-table th{
  border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  padding:8px 12px;font-family:var(--font-mono);white-space:nowrap;
}
table.block-table th{background:var(--panel-2);color:var(--spo2);font-weight:600;text-align:left;}
table.block-table:not(:has(thead)) tr:first-child td{background:var(--panel-2);color:var(--spo2);font-weight:600;}
table.block-table tbody tr:nth-child(even) td{background:var(--panel-2);}
table.block-table tr:last-child td{border-bottom:none;}
table.block-table td:last-child,table.block-table th:last-child{border-right:none;}

.block-callout{margin:16px 0;padding:14px 16px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--spo2);border-radius:0 var(--radius-ctl) var(--radius-ctl) 0;}
.block-callout.callout-info{border-left-color:var(--ecg);}
.block-callout.callout-warn{border-left-color:var(--resp);}
.block-callout .callout-title{font-family:var(--font-display);font-weight:700;font-size:13.5px;margin-bottom:8px;color:var(--ink);}
.block-callout .block-p,.block-callout .block-li{margin:0 0 4px;}

b{color:var(--ink);font-weight:700;}
s{color:var(--ink-faint);}
mark{background:var(--mark-bg);color:var(--ink);padding:1px 4px;border-radius:3px;}

.empty-state{color:var(--ink-faint);padding:60px 32px;text-align:center;font-family:var(--font-display);}

/* ---------- quiz view ---------- */
#view-quiz{width:100%;justify-content:center;overflow-y:auto;}
.quiz-wrap{max-width:640px;width:100%;padding:40px 24px 100px;margin:0 auto;}
.quiz-setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.resume-card{
  background:var(--panel-2);border:1px solid var(--spo2);border-radius:var(--radius-ctl);
  padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--ink-dim);
}
.resume-card b{color:var(--ink);font-family:var(--font-mono);}
.resume-actions{display:flex;gap:10px;margin-top:12px;}
.quiz-setup h2, .quiz-live h2{font-family:var(--font-display);font-size:20px;margin:0 0 14px;}
.quiz-setup label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.quiz-setup select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px;border-radius:var(--radius-ctl);font-size:14px;margin-bottom:16px;
}
.quiz-setup-hint{
  margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line);
  font-size:12.5px;line-height:1.7;color:var(--ink-faint);
}
.btn{
  appearance:none;border:none;border-radius:var(--radius-ctl);
  padding:10px 18px;font-family:var(--font-ui);font-weight:600;font-size:14px;
  cursor:pointer;letter-spacing:.02em;
}
.btn-primary{background:var(--ecg);color:var(--ink-on-accent);}
.btn-primary:hover{background:color-mix(in srgb, var(--ecg) 85%, white);}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint);}
.btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.quiz-progress{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
.quiz-progress .idx{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.06em;}
.quiz-progress .score{font-family:var(--font-mono);font-size:22px;color:var(--ecg);font-weight:600;}
.quiz-chapter-tag{
  display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--spo2);
  border:1px solid color-mix(in srgb, var(--spo2) 45%, var(--panel));border-radius:3px;padding:2px 6px;margin-bottom:12px;
}
.quiz-q{font-size:17px;color:var(--ink);margin:0 0 18px;text-wrap:balance;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius-ctl);padding:12px 14px;font-size:14px;cursor:pointer;
  display:flex;gap:10px;line-height:1.5;
}
.opt-btn:hover:not(:disabled){border-color:var(--ink-faint);}
.opt-btn .k{font-family:var(--font-mono);color:var(--ink-faint);flex:none;}
.opt-btn.correct{border-color:var(--ecg);background:var(--ecg-soft);}
.opt-btn.correct .k{color:var(--ecg);}
.opt-btn.incorrect{border-color:var(--nibp);background:var(--nibp-soft);}
.opt-btn.incorrect .k{color:var(--nibp);}
.opt-btn:disabled{cursor:default;}
.quiz-explain{
  margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:var(--radius-ctl);
  border-left:3px solid var(--spo2);font-size:13.5px;color:var(--ink-dim);
}
.quiz-explain .tag{font-family:var(--font-mono);font-size:10px;color:var(--spo2);letter-spacing:.1em;margin-right:8px;}
.quiz-nav{display:flex;justify-content:flex-end;margin-top:20px;}
.quiz-done{text-align:center;}
.quiz-done .final{font-family:var(--font-mono);font-size:44px;color:var(--ecg);margin:8px 0;}
.quiz-done .label{color:var(--ink-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}

/* ---------- exam (歷屆考古題) view ---------- */
#view-exam{width:100%;justify-content:center;overflow-y:auto;}
.exam-wrap{max-width:640px;width:100%;padding:40px 24px 100px;margin:0 auto;}
.exam-setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.exam-setup h2{font-family:var(--font-display);font-size:20px;margin:0 0 14px;}
.exam-setup label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.exam-setup select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px;border-radius:var(--radius-ctl);font-size:14px;margin-bottom:16px;
}
.exam-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.exam-progress{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
.exam-progress .idx{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.06em;}
.exam-year-tag{
  display:inline-block;font-size:10px;color:var(--spo2);
  border:1px solid color-mix(in srgb, var(--spo2) 45%, var(--panel));border-radius:3px;padding:2px 6px;
}
select.exam-year-tag{
  appearance:none;-webkit-appearance:none;background:var(--panel);cursor:pointer;
  font-family:var(--font-mono);
}
.exam-jump-hint{font-size:11px;color:var(--ink-faint);text-align:right;margin:6px 0 14px;}
.exam-q{font-size:17px;color:var(--ink);margin:0 0 18px;text-wrap:balance;white-space:pre-wrap;}

      if(mLi){
        var indent = Math.floor(mLi[1].length / 2);
        blocks.push({type:"li", indent: indent, text: mLi[2].trim()});
        i++; continue;
      }

      var mQ = line.match(/^>\s?(.*)$/);
      if(mQ){
        blocks.push({type:"quote", text: mQ[1].trim()});
        i++; continue;
      }

      blocks.push({type:"p", text: line.trim()});
      i++;
    }
    return blocks;
  }

  /* ================= rendering: blocks -> HTML ================= */
  function renderBlocks(blocks){
    if(!blocks || !blocks.length){
      return '<div class="empty-state">此章節目前沒有內容。</div>';
    }
    return blocks.map(function(b){
      if(b.type === "h2") return '<div class="block-h2">' + inline(b.text) + '</div>';
      if(b.type === "h3") return '<div class="block-h3">' + inline(b.text) + '</div>';
      if(b.type === "h4") return '<div class="block-h4">' + inline(b.text) + '</div>';
      if(b.type === "quote") return '<div class="block-quote"><span class="tag">TIP</span>' + inline(b.text) + '</div>';
      if(b.type === "link") return '<div class="block-link"><a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + inline(b.text) + '</a></div>';
      if(b.type === "divider") return '<hr class="content-divider">';
      if(b.type === "img") return '<figure class="block-img"><img src="' + esc(b.path) + '" alt="筆記附圖" loading="lazy">' +
        (b.caption ? '<figcaption>' + b.caption.split("\n").map(function(l){ return inline(l); }).join('<br>') + '</figcaption>' : '') +
        '</figure>';
      if(b.type === "li") return '<div class="block-li indent-' + Math.min(b.indent,3) + '"><span class="bullet">&#9656;</span><span class="txt">' + inline(b.text) + '</span></div>';
      if(b.type === "table"){
        var thead = b.headerRow ? '<thead><tr>' + b.headerRow.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead>' : '';
        var rows = b.rows.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('');
        return '<div class="table-wrap"><table class="block-table">' + thead + '<tbody>' + rows + '</tbody></table></div>';
      }
      if(b.type === "callout") return '<div class="block-callout callout-' + esc(b.subtype || "note") + '">' +
        (b.title ? '<div class="callout-title">' + inline(b.title) + '</div>' : '') +
        renderBlocks(b.items) +
        '</div>';
      return '<div class="block-p">' + inline(b.text) + '</div>';
    }).join("");
  }

  function chapterMatches(c, term){
    if(!term) return true;
    var t = term.toLowerCase();
    if(c.title.toLowerCase().indexOf(t) !== -1) return true;
    for(var i=0;i<c.blocks.length;i++){
      var bt = c.blocks[i].text;
      if(bt && bt.toLowerCase().indexOf(t) !== -1) return true;
      if(c.blocks[i].type === "table"){
        var rows = c.blocks[i].rows;
        for(var r=0;r<rows.length;r++){
          for(var k=0;k<rows[r].length;k++){
            if(rows[r][k].toLowerCase().indexOf(t) !== -1) return true;
          }
        }
      }
    }
    return false;
  }

    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';

  /* normalize a papers2026_quiz row into the shape renderMine/allAttempts
     expect, so its answers/favorites sit in the same 錯題/收藏/落點分析 as
     chapter and exam questions. chapter_id points at a real pseudo-chapter
     row ("papers2026-NN", one per paper) seeded alongside the real chapters,
     so 落點分析's ordinary chapterId grouping needs no special-casing. */
  function papers2026ToQuizShape(q){
    return {
      id: q.id,
      chapterId: q.chapter_id,
      question: q.question,
      options: q.options,
      answerIndex: q.answer_index,
      explanation: q.explanation,
      isPapers2026: true
    };
  }

  function wirePaper2026MockExam(){
    document.querySelectorAll('.mock-quiz-q').forEach(function(card){
      var qid = card.getAttribute('data-qid');
      var q = STATE.papers2026Quiz.filter(function(x){ return x.id === qid; })[0];
      var answerIdx = parseInt(card.getAttribute('data-answer'), 10);
      var opts = card.querySelectorAll('.opt-btn');
      var starBtn = card.querySelector('.fav-star');
      if(starBtn){
        starBtn.addEventListener('click', function(){
          toggleFavorite(qid, 'papers2026', function(){ starBtn.classList.toggle('active', isFavorited(qid)); });
        });
      }
      opts.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(card.classList.contains('answered')) return;
          card.classList.add('answered');
          var chosen = parseInt(btn.getAttribute('data-idx'), 10);
          opts.forEach(function(b){
            b.disabled = true;
            var idx = parseInt(b.getAttribute('data-idx'), 10);
            if(idx === answerIdx) b.classList.add('correct');
            else if(idx === chosen) b.classList.add('incorrect');
          });
          var exp = card.querySelector('.quiz-explain');
          if(exp) exp.hidden = false;
          if(q) recordAttempt(papers2026ToQuizShape(q), chosen, chosen === answerIdx);
        });
      });
    });

    document.querySelectorAll('.mock-oral-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.mock-oral-card');
        var ans = card.querySelector('.mock-oral-answer');
        ans.hidden = !ans.hidden;
        btn.textContent = ans.hidden ? '顯示參考答案' : '隱藏參考答案';
      });
    });
  }

  /* ---------- quiz tab ---------- */

  function renderQuizLive(){
    var wrap = document.getElementById('quiz-wrap');
    if(!quiz || quiz.idx >= quiz.questions.length){
      var total = quiz ? quiz.questions.length : 0;
      var score = quiz ? quiz.score : 0;
      var eidDone = getEmployeeId();
      if(eidDone) clearSession(eidDone);
      wrap.innerHTML =
        '<div class="quiz-live quiz-done">' +
          '<div class="label">測驗結束</div>' +
          '<div class="final mono">' + score + ' / ' + total + '</div>' +
          '<div class="label">' + (total ? Math.round(score/total*100) : 0) + '% 正確率</div>' +
          '<div class="quiz-nav" style="justify-content:center;margin-top:24px;">' +
            '<button class="btn btn-ghost" id="quiz-again">再測一次</button>' +
          '</div>' +
        '</div>';
      document.getElementById('quiz-again').addEventListener('click', renderQuizSetup);
      return;
    }
    quiz.answered = false;
    var q = quiz.questions[quiz.idx];
    var ch = findChapter(q.chapterId);
    wrap.innerHTML =
      '<div class="quiz-live">' +
        '<div class="quiz-progress"><span class="idx mono">第 ' + (quiz.idx+1) + ' / ' + quiz.questions.length + ' 題</span><span class="score mono">' + quiz.score + '</span></div>' +
        (ch ? '<div class="quiz-chapter-tag">' + esc(ch.title) + '</div>' : '') +
        '<div class="quiz-q">' + esc(q.question) +
          '<button class="fav-star' + (isFavorited(q.id) ? ' active' : '') + '" id="quiz-fav" title="收藏這題">&#9733;</button>' +
        '</div>' +
        '<div class="quiz-options" id="quiz-options"></div>' +
        '<div id="quiz-explain-slot"></div>' +
        '<div class="quiz-nav"><button class="btn btn-primary" id="quiz-next" disabled>下一題</button></div>' +
      '</div>';

    document.getElementById('quiz-fav').addEventListener('click', function(){
      var btn = this;
      toggleFavorite(q.id, 'chapter', function(){ btn.classList.toggle('active', isFavorited(q.id)); });
    });

    var optWrap = document.getElementById('quiz-options');
    q.options.forEach(function(optText, idx){
      var b = document.createElement('button');
      b.className = 'opt-btn';
      b.innerHTML = '<span class="k mono">' + String.fromCharCode(65+idx) + '</span><span>' + esc(optText) + '</span>';
      b.addEventListener('click', function(){ answerQuiz(idx); });
      optWrap.appendChild(b);
    });

    document.getElementById('quiz-next').addEventListener('click', function(){
      quiz.idx++;
      var eidNext = getEmployeeId();
      if(eidNext && quiz.idx < quiz.questions.length) saveSession(eidNext, quiz);
      renderQuizLive();
    });
  }

  function answerQuiz(idx){
    if(quiz.answered) return;
    quiz.answered = true;
    var q = quiz.questions[quiz.idx];
    var correct = q.answerIndex;
    var buttons = document.querySelectorAll('#quiz-options .opt-btn');
    buttons.forEach(function(btn, i){
      btn.disabled = true;
      if(i === correct) btn.classList.add('correct');
      else if(i === idx) btn.classList.add('incorrect');
    });
    if(idx === correct) quiz.score++;
    recordAttempt(q, idx, idx === correct);
    document.getElementById('quiz-explain-slot').innerHTML =
      '<div class="quiz-explain"><span class="tag">解析</span>' + esc(q.explanation || '') + '</div>';
    document.getElementById('quiz-next').disabled = false;
  }

  /* ---------- exam (歷屆考古題) tab ---------- */
  var examBrowse = null; // {year:"__all__"|2020..2025, list:[], idx:0, answered:false}
  /* set when the 考古題 view was entered by jumping from a 版本落差筆記 entry, so
     the question can offer a way back to the note it came from instead of
     stranding the reader in the question browser. Holds the entry id so the
     browser can scroll back to that exact finding, not just its top. */
  var vgnReturn = null;

  function examYears(){
    var years = {};
    STATE.examQuestions.forEach(function(q){ years[q.year] = (years[q.year]||0) + 1; });
    return Object.keys(years).map(Number).sort(function(a,b){ return b - a; }).map(function(y){
      return { year: y, count: years[y] };
    });
  }

  function renderExamSetup(){
    var wrap = document.getElementById('exam-wrap');
    var years = examYears();
    var total = STATE.examQuestions.length;
    var options = years.map(function(y){
      return '<option value="' + y.year + '">' + y.year + ' 年（' + y.count + ' 題）</option>';
    }).join('');

    wrap.innerHTML =
      '<div class="exam-setup">' +
        '<h2>歷屆考古題</h2>' +
        (total ?
          '<label>選擇年度</label>' +
          '<select id="exam-year"><option value="__all__">全部年度混合（' + total + ' 題）</option>' + options + '</select>' +
          '<button class="btn btn-primary" id="exam-start">開始瀏覽</button>'
        : '<div class="empty-state" style="padding:20px 0;">考古題資料還沒上架。</div>') +
        (STATE.versionGapNotes.length ?
          '<div class="exam-vgn-entry">' +
            '<button class="btn btn-ghost" id="exam-vgn">版本落差筆記</button>' +
            '<div class="exam-vgn-hint">Miller 第九版→第十版的版本差異、教科書內部矛盾與考題對照，' +
              '共 ' + STATE.versionGapNotes.length + ' 則。答題時該題若有相關紀錄，也會直接出現在詳解下方。</div>' +
          '</div>' : '') +
      '</div>';

    var vgnBtn = document.getElementById('exam-vgn');
    if(vgnBtn) vgnBtn.addEventListener('click', renderVersionGapBrowser);

    var startBtn = document.getElementById('exam-start');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        var y = document.getElementById('exam-year').value;
        var pool = y === '__all__' ? STATE.examQuestions.slice() : STATE.examQuestions.filter(function(q){ return String(q.year) === y; });
        pool.sort(function(a,b){ return a.year - b.year || a.question_no - b.question_no; });
        vgnReturn = null; // a fresh browse must not offer a stale "back to the note"
        examBrowse = { year: y, list: pool, idx: 0, answered: false };
        renderExamLive();
      });
    }
  }

  function examOptionKeys(q){
    return Object.keys(q.options || {}).sort();
  }

  /* normalize an exam_questions row into the shape renderQuizLive/answerQuiz
     expect, so wrong exam questions can sit in the same 錯題 list and be
     retried through the ordinary quiz UI (chapter classification for exam
     questions is deferred, so chapterId stays null here on purpose). */
  function examToQuizShape(q){
    var keys = examOptionKeys(q);
    var firstCorrect = q.answer ? q.answer.charAt(0) : null;
    return {
      id: q.id,
      chapterId: null,
      question: q.question,
      options: keys.map(function(k){ return q.options[k]; }),
      answerIndex: firstCorrect ? keys.indexOf(firstCorrect) : -1,
      explanation: q.explanation,
      isExam: true,
      examTag: q.year + ' 年考古題 第 ' + q.question_no + ' 題'
    };
  }

  function examExplainImages(q){
    var imgs = q.explanation_images;
    if(!imgs || !imgs.length) return '';
    return '<div class="exam-explain-images">' + imgs.map(function(item){
      var path = typeof item === 'string' ? item : item.path;
      var caption = typeof item === 'string' ? '' : (item.caption || '');
      return '<figure class="exam-explain-figure">' +
        '<img src="' + esc(path) + '" alt="詳解附圖" loading="lazy">' +
        (caption ? '<figcaption class="mono">' + esc(caption) + '</figcaption>' : '') +
        '</figure>';
    }).join('') + '</div>';
  }

  function examReveal(q){
    return (q.void ?
        '<div class="exam-void-badge">本題送分（所有選項皆列為正確）</div>' :
        '<div class="exam-answer-tag mono">正確答案：' + esc(q.answer || '—') + '</div>') +
      (q.reference ? '<div class="exam-ref mono">' + esc(q.reference) + '</div>' : '') +
      (q.explanation ? '<div class="exam-explain"><span class="tag">詳解</span><div class="exam-explain-body">' + esc(q.explanation) + '</div></div>' :
        '<div class="exam-explain exam-explain-empty">本題原始資料沒有留下詳解文字。</div>') +
      examExplainImages(q) +
      versionGapInline(q);
  }

  /* ================= 版本落差筆記 =================
     Curated Miller 9th->10th edition-gap / textbook-self-contradiction findings,
     compiled by the 麻專站專案 session as a by-product of the 2020-2025 考古題
     citation-verification pass (Supabase table version_gap_notes, schema v11,
     public read-only; source of truth is
     source_materials/version_gap_notes/version_gap_notes.json, re-seeded whenever
     new findings are added).

     Two entry points, both inside the 考古題 tab rather than a 9th top-level tab
     since every finding is derived from a 考古題: (1) an inline 提醒 appended to
     each question's 詳解 for the 85 questions some finding names, (2) a
     standalone year/category-filtered browser reached from the 考古題 setup
     screen. Each row carries a pre-parsed `refs` array ([{year, question_no,
     option}]) so neither side has to re-parse the compiler's free-text q_label
     ("Q96–97" with an en dash, "Q40-C/D", positionally-paired multi-year forms)
     at runtime -- that parsing happens once, offline, in the JSON build step.

     Three things the compiler asked be preserved on a public site and that this
     code deliberately enforces: the "not an official erratum" disclaimer shown
     verbatim, `flagged` entries kept visually distinct rather than presented as
     equal to the other 75, and the short Miller quotes rendered at their current
     length (never expanded into long passages). */

  var VGN_META = {
    title: '版本落差與教科書內部矛盾筆記',
    eyebrow: "Miller's Anesthesia 9th → 10th",
    lede: '整理自2020–2025年麻醉專科考古題「引註校對」專案過程中，逐題比對Miller\'s Anesthesia第九版、第十版原文時發現的版本差異、教科書內部前後矛盾，以及考題與教科書不符之處。',
    coverage: '2020–2025，共600題',
    compiled: '2026-09-15',
    disclaimer: [
      '這些發現來自逐題核對考古題詳解與Miller\'s Anesthesia原文時的副產品，不是官方勘誤，也未經出版社或考選部確認——列出的每一項都已盡量附上頁碼與逐字原文，供讀者自行核對，而非直接採信的結論。',
      '各年份查核深度：2020–2025 全部六年皆已完成逐題逐選項的第十版引註查證（含章節、頁碼、逐字英文引文核對）。',
      '官方答案在所有案例中均未變動——本文件純粹記錄「原文本身怎麼寫」與「考題認定方向」之間的落差，供讀者自行判斷。'
    ],
    footer: '頁碼與引文均對應Miller\'s Anesthesia第十版（Gropper主編）；第九版引文另行標註。'
  };

  function vgnAll(){
    return STATE.versionGapNotes.slice().sort(function(a,b){ return (a.sort_order||0) - (b.sort_order||0); });
  }

  /* PostgREST returns jsonb as a real array, but tolerate a string just in case
     an older deploy or a hand-edited row hands back raw JSON text. */
  function vgnJson(v){
    if(typeof v === 'string'){ try { return JSON.parse(v); } catch(e){ return []; } }
    return v || [];
  }
  function vgnRefs(n){ return vgnJson(n.refs); }
  function vgnQuotes(n){ return vgnJson(n.quotes); }

  function vgnRefMatches(r, year, questionNo){
    return Number(r.year) === Number(year) && Number(r.question_no) === Number(questionNo);
  }

  function vgnFor(year, questionNo){
    return vgnAll().filter(function(n){
      return vgnRefs(n).some(function(r){ return vgnRefMatches(r, year, questionNo); });
    });
  }

  /* which option letters this finding calls out for this specific question --
     the compiler tags many findings down to the option (e.g. "Q10-D") */
  function vgnOptionsFor(n, year, questionNo){
    var seen = {};
    vgnRefs(n).forEach(function(r){
      if(vgnRefMatches(r, year, questionNo) && r.option) seen[r.option] = true;
    });
    return Object.keys(seen).sort();
  }

  function vgnEntryHtml(n, ctxYear, ctxNo, withJumps){
    var opts = ctxYear ? vgnOptionsFor(n, ctxYear, ctxNo) : [];
    var badge = [n.year_label, n.q_label, n.ch_label].filter(function(s){ return !!s; }).join(' · ');
    var jumps = '';
    if(withJumps){
      var seen = {}, list = [];
      vgnRefs(n).forEach(function(r){
        var key = r.year + '-' + r.question_no;
        if(seen[key]) return;
        seen[key] = true;
        list.push(r);
      });
      jumps = list.length ? '<div class="vgn-jumps">' + list.map(function(r){
        return '<button class="vgn-jump mono" data-year="' + esc(r.year) + '" data-no="' + esc(r.question_no) +
          '" data-entry="' + esc(n.id) + '">' +
          '去看 ' + esc(r.year) + ' 第 ' + esc(r.question_no) + ' 題</button>';
      }).join('') + '</div>' : '';
    }
    /* only the browser gets a DOM id -- the inline copy inside a 詳解 renders the
       same entry, and two elements sharing an id would break the scroll-back */
    return '<div class="vgn-entry' + (n.flagged ? ' flagged' : '') + '"' +
      (withJumps ? ' id="vgn-entry-' + esc(n.id) + '"' : '') + '>' +
      '<div class="vgn-entry-head">' +
        (badge ? '<span class="vgn-badge mono">' + esc(badge) + '</span>' : '') +
        '<span class="vgn-cat mono">' + esc(n.category_title) + '</span>' +
        (opts.length ? '<span class="vgn-opt mono">對應選項 ' + esc(opts.join('、')) + '</span>' : '') +
        (n.flagged ? '<span class="vgn-flagtag mono">待確認</span>' : '') +
      '</div>' +
      '<div class="vgn-headline">' + esc(n.headline) + '</div>' +
      '<div class="vgn-detail">' + esc(n.detail) + '</div>' +
      vgnQuotes(n).map(function(qt){
        return '<div class="vgn-quote mono"><span class="pg">' + esc(qt.pg) + '</span>：「' + esc(qt.en) + '」</div>';
      }).join('') +
      (n.flagged ? '<div class="vgn-flagnote">整理者對這一則尚未完全確定，請與其餘已逐條對過第十版原文的項目分開看待。</div>' : '') +
      jumps +
      '</div>';
  }

  function versionGapInline(q){
    var notes = vgnFor(q.year, q.question_no);
    if(!notes.length) return '';
    return '<div class="vgn-inline">' +
      '<div class="vgn-inline-head">' +
        '<span class="tag">版本落差提醒</span>' +
        '<span class="vgn-inline-sub">本題在「版本落差筆記」中有 ' + notes.length + ' 則相關紀錄</span>' +
      '</div>' +
      notes.map(function(n){ return vgnEntryHtml(n, q.year, q.question_no, false); }).join('') +
      '<div class="vgn-inline-foot">讀者自行整理的核對筆記，非官方勘誤；官方答案均未變動。</div>' +
      '</div>';
  }

  var vgnFilter = { years: [], cats: [] };

  function vgnYears(){
    var seen = {};
    vgnAll().forEach(function(n){
      vgnRefs(n).forEach(function(r){ seen[r.year] = true; });
    });
    return Object.keys(seen).map(Number).sort();
  }

  function vgnCats(){
    var seen = {}, out = [];
    vgnAll().forEach(function(n){
      if(seen[n.category_id]) return;
      seen[n.category_id] = true;
      out.push({ id: n.category_id, title: n.category_title, desc: n.category_desc });
    });
    return out;
  }

  function vgnMatches(n){
    if(vgnFilter.cats.length && vgnFilter.cats.indexOf(n.category_id) < 0) return false;
    if(vgnFilter.years.length){
      var hit = vgnRefs(n).some(function(r){ return vgnFilter.years.indexOf(Number(r.year)) >= 0; });
      if(!hit) return false;
    }
    return true;
  }

  function vgnToggle(list, val){
    var i = list.indexOf(val);
    if(i >= 0) list.splice(i, 1); else list.push(val);
  }

  function renderVersionGapBrowser(scrollToId){
    var wrap = document.getElementById('exam-wrap');
    var all = vgnAll();
    if(!all.length){
      wrap.innerHTML = '<div class="vgn-page"><div class="empty-state" style="padding:20px 0;">版本落差筆記還沒上架。</div>' +
        '<div class="quiz-nav"><button class="btn btn-ghost" id="vgn-back">回考古題選單</button></div></div>';
      document.getElementById('vgn-back').addEventListener('click', renderExamSetup);
      return;
    }

    var shown = all.filter(vgnMatches);
    var cats = vgnCats();
    var byCat = {};
    shown.forEach(function(n){ (byCat[n.category_id] = byCat[n.category_id] || []).push(n); });

    wrap.innerHTML =
      '<div class="vgn-page">' +
        '<div class="vgn-masthead">' +
          '<div class="vgn-eyebrow mono">' + esc(VGN_META.eyebrow) + '</div>' +
          '<h2 class="vgn-title">' + esc(VGN_META.title) + '</h2>' +
          '<p class="vgn-lede">' + esc(VGN_META.lede) + '</p>' +
          '<div class="vgn-meta mono">涵蓋 ' + esc(VGN_META.coverage) + '　·　整理日期 ' + esc(VGN_META.compiled) +
            '　·　共 ' + all.length + ' 則</div>' +
          '<details class="vgn-scope"><summary>關於這份整理的範圍與限制</summary>' +
            VGN_META.disclaimer.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
          '</details>' +
        '</div>' +
        '<div class="vgn-controls">' +
          '<div class="vgn-chiprow"><span class="vgn-chiplabel mono">年份</span>' +
            vgnYears().map(function(y){
              return '<button class="vgn-chip' + (vgnFilter.years.indexOf(y) >= 0 ? ' active' : '') +
                '" data-kind="year" data-val="' + y + '">' + y + '</button>';
            }).join('') +
          '</div>' +
          '<div class="vgn-chiprow"><span class="vgn-chiplabel mono">分類</span>' +
            cats.map(function(c){
              return '<button class="vgn-chip' + (vgnFilter.cats.indexOf(c.id) >= 0 ? ' active' : '') +
                '" data-kind="cat" data-val="' + esc(c.id) + '">' + esc(c.title) + '</button>';
            }).join('') +
            ((vgnFilter.years.length || vgnFilter.cats.length) ?
              '<button class="vgn-chip vgn-clear" data-kind="clear" data-val="">清除篩選</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="vgn-body">' +
          (shown.length ? cats.filter(function(c){ return byCat[c.id] && byCat[c.id].length; }).map(function(c){
            return '<section class="vgn-section">' +
              '<div class="vgn-sec-head"><h3>' + esc(c.title) + '</h3>' +
                '<span class="vgn-sec-count mono">' + byCat[c.id].length + ' 則</span></div>' +
              '<p class="vgn-sec-desc">' + esc(c.desc) + '</p>' +
              byCat[c.id].map(function(n){ return vgnEntryHtml(n, null, null, true); }).join('') +
              '</section>';
          }).join('') : '<div class="empty-state" style="padding:20px 0;">目前篩選條件下沒有符合的項目。</div>') +
        '</div>' +
        '<div class="vgn-footer">' + esc(VGN_META.footer) + '</div>' +
        '<div class="quiz-nav"><button class="btn btn-ghost" id="vgn-back">回考古題選單</button></div>' +
      '</div>';

    wrap.querySelectorAll('.vgn-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        var kind = btn.getAttribute('data-kind');
        if(kind === 'clear'){ vgnFilter.years = []; vgnFilter.cats = []; }
        else if(kind === 'year') vgnToggle(vgnFilter.years, Number(btn.getAttribute('data-val')));
        else vgnToggle(vgnFilter.cats, btn.getAttribute('data-val'));
        renderVersionGapBrowser();
      });
    });

    wrap.querySelectorAll('.vgn-jump').forEach(function(btn){
      btn.addEventListener('click', function(){
        vgnJumpToQuestion(btn.getAttribute('data-year'), btn.getAttribute('data-no'), btn.getAttribute('data-entry'));
      });
    });

    document.getElementById('vgn-back').addEventListener('click', renderExamSetup);

    /* coming back from a question: put the reader back on the finding they left
       from, not at the top of a 77-entry page */
    if(scrollToId){
      var target = document.getElementById('vgn-entry-' + scrollToId);
      if(target){
        target.scrollIntoView({ block: 'center' });
        target.classList.add('vgn-returned');
      }
    }
  }

  /* jump straight from a finding to the 考古題 it describes, reusing the same
     single-year browse pool the year dropdown builds so the jump selector and
     上一題/下一題 keep working from there */
  function vgnJumpToQuestion(year, questionNo, entryId){
    var pool = STATE.examQuestions.filter(function(q){ return String(q.year) === String(year); });
    pool.sort(function(a,b){ return a.question_no - b.question_no; });
    var idx = -1;
    pool.forEach(function(q, i){ if(Number(q.question_no) === Number(questionNo)) idx = i; });
    if(idx < 0) return;
    vgnReturn = entryId || null;
    examBrowse = { year: String(year), list: pool, idx: idx, answered: false };
    renderExamLive();
  }

  function renderExamLive(){
    var wrap = document.getElementById('exam-wrap');
    if(!examBrowse || !examBrowse.list.length){ renderExamSetup(); return; }
    var q = examBrowse.list[examBrowse.idx];
    var keys = examOptionKeys(q);

    wrap.innerHTML =
      '<div class="exam-live">' +
        '<div class="exam-progress">' +
          '<span class="idx mono">第 ' + (examBrowse.idx+1) + ' / ' + examBrowse.list.length + ' 題</span>' +
          '<select class="exam-year-tag mono" id="exam-jump" title="跳到指定題目">' +
            examBrowse.list.map(function(item, i){
              return '<option value="' + i + '"' + (i === examBrowse.idx ? ' selected' : '') + '>' +
                item.year + ' 年 第 ' + item.question_no + ' 題</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<div class="exam-jump-hint">點上方選單可直接跳到指定題目</div>' +
        '<div class="exam-q">' + esc(q.question) +
          '<button class="fav-star' + (isFavorited(q.id) ? ' active' : '') + '" id="exam-fav" title="收藏這題">&#9733;</button>' +
        '</div>' +
        (q.has_image && q.images && q.images.length ?
          '<div class="exam-images">' + q.images.map(function(p){
            return '<img src="' + esc(p) + '" alt="題目附圖" loading="lazy">';
          }).join('') + '</div>' : '') +
        '<div class="exam-options" id="exam-options"></div>' +
        '<div id="exam-reveal-slot"></div>' +
        '<div class="quiz-nav exam-nav">' +
          '<button class="btn btn-ghost" id="exam-prev"' + (examBrowse.idx === 0 ? ' disabled' : '') + '>上一題</button>' +
          (vgnReturn ? '<button class="btn btn-ghost" id="exam-vgn-back">&#8592; 回版本落差筆記</button>' : '') +
          '<button class="btn btn-ghost" id="exam-back">回選單</button>' +
          '<button class="btn btn-primary" id="exam-next"' + (examBrowse.idx >= examBrowse.list.length-1 ? ' disabled' : '') + '>下一題</button>' +
        '</div>' +
      '</div>';

    var optWrap = document.getElementById('exam-options');
    keys.forEach(function(k){
      var b = document.createElement('button');
      b.className = 'opt-btn';
      b.innerHTML = '<span class="k mono">' + k + '</span><span>' + esc(q.options[k]) + '</span>';
      b.addEventListener('click', function(){ examAnswerPick(k); });
      optWrap.appendChild(b);
    });

    document.getElementById('exam-jump').addEventListener('change', function(){
      examBrowse.idx = parseInt(this.value, 10);
      examBrowse.answered = false;
      renderExamLive();
    });
    document.getElementById('exam-prev').addEventListener('click', function(){
      if(examBrowse.idx > 0){ examBrowse.idx--; examBrowse.answered = false; renderExamLive(); }
    });
    document.getElementById('exam-next').addEventListener('click', function(){
      if(examBrowse.idx < examBrowse.list.length-1){ examBrowse.idx++; examBrowse.answered = false; renderExamLive(); }
    });
    document.getElementById('exam-back').addEventListener('click', function(){
      examBrowse = null;
      vgnReturn = null;
      renderExamSetup();
    });
    var vgnBackBtn = document.getElementById('exam-vgn-back');
    if(vgnBackBtn) vgnBackBtn.addEventListener('click', function(){
      var entryId = vgnReturn;
      examBrowse = null;
      vgnReturn = null;
      renderVersionGapBrowser(entryId);
    });
    document.getElementById('exam-fav').addEventListener('click', function(){
      var btn = document.getElementById('exam-fav');
      toggleFavorite(q.id, 'exam', function(){ btn.classList.toggle('active', isFavorited(q.id)); });
    });

    if(examBrowse.answered){ examShowResult(q); }
  }

  function examAnswerPick(picked){
    if(examBrowse.answered) return;
    examBrowse.answered = true;
    var q = examBrowse.list[examBrowse.idx];
    if(!q.void){
      var correct = !!(q.answer && q.answer.indexOf(picked) !== -1);
      recordExamAttempt(q, picked, correct);
    }
    examShowResult(q, picked);
  }

  function examShowResult(q, picked){
    var buttons = document.querySelectorAll('#exam-options .opt-btn');
    buttons.forEach(function(btn){
      btn.disabled = true;
      if(q.void) return; // 送分：所有選項皆算正確，不標示對錯
      var k = btn.querySelector('.k').textContent;
      var isCorrect = q.answer && q.answer.indexOf(k) !== -1;
      if(isCorrect) btn.classList.add('correct');
      else if(picked && k === picked) btn.classList.add('incorrect');
    });
    document.getElementById('exam-reveal-slot').innerHTML = examReveal(q);
  }

  /* ---------- oral (口試考古題) tab ---------- */
  var oralBrowse = null; // {key, list:[], idx:0, revealed:false}

  function oralGroups(){
    var years = {}, noYear = 0;
    STATE.oralQuestions.forEach(function(q){
      if(q.year == null){ noYear++; return; }
      years[q.year] = (years[q.year]||0) + 1;
    });
    var list = Object.keys(years).map(Number).sort(function(a,b){ return b - a; }).map(function(y){
      return { year: y, count: years[y] };
    });
    if(noYear) list.push({ year: null, count: noYear });
    return list;
  }

  var ORAL_STATION_LABEL = {
    case1: '第一題', case2: '第二題', tee: 'TEE 站', nb: '神經阻滯站', mock: '模擬口試',
    bank1: '考古題彙編一', bank2: '考古題彙編二', bank3: '考古題彙編三', assoc: '學會題庫'
  };

  function renderOralSetup(){
    var wrap = document.getElementById('oral-wrap');
    var years = oralGroups();
    var total = STATE.oralQuestions.length;
    var options = years.map(function(y){
      var val = y.year == null ? '__none__' : y.year;
      var label = y.year == null ? '年份不詳' : (y.year + ' 年');
      return '<option value="' + val + '">' + label + '（' + y.count + ' 題）</option>';
    }).join('');

    wrap.innerHTML =
      '<div class="exam-setup">' +
        '<h2>口試考古題</h2>' +
        (total ?
          '<label>選擇年度</label>' +
          '<select id="oral-year"><option value="__all__">全部年度混合（' + total + ' 題）</option>' + options + '</select>' +
          '<button class="btn btn-primary" id="oral-start">開始練習</button>' +
          '<div class="empty-state" style="padding:14px 0 0;font-size:12.5px;">' +
            '收錄近年官方口試考古題、模擬口試，以及歷年彙編筆記與學會題庫（部分為掃描辨識，內容如有疏漏請對照原始教科書）。' +
          '</div>'
        : '<div class="empty-state" style="padding:20px 0;">口試考古題資料還沒上架。</div>') +
      '</div>';

    var startBtn = document.getElementById('oral-start');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        var y = document.getElementById('oral-year').value;
        var pool = y === '__all__' ? STATE.oralQuestions.slice() :
          y === '__none__' ? STATE.oralQuestions.filter(function(q){ return q.year == null; }) :
          STATE.oralQuestions.filter(function(q){ return String(q.year) === y; });
        pool.sort(function(a,b){
          var ay = a.year == null ? -1 : a.year, by = b.year == null ? -1 : b.year;
          return ay - by || String(a.station).localeCompare(String(b.station));
        });
        oralBrowse = { list: shuffle(pool), idx: 0, revealed: false };
        renderOralLive();
      });
    }
  }

  function renderOralLive(){
    var wrap = document.getElementById('oral-wrap');
    if(!oralBrowse || !oralBrowse.list.length){ renderOralSetup(); return; }
    var q = oralBrowse.list[oralBrowse.idx];
    var stationLabel = ORAL_STATION_LABEL[q.station] || q.station;
    var yearLabel = q.year == null ? '年份不詳' : (q.year + ' 年');

    wrap.innerHTML =
      '<div class="exam-live">' +
        '<div class="exam-progress">' +
          '<span class="idx mono">第 ' + (oralBrowse.idx+1) + ' / ' + oralBrowse.list.length + ' 題</span>' +
          '<span class="exam-year-tag mono">' + esc(yearLabel) + '・' + esc(stationLabel) + '</span>' +
        '</div>' +
        (q.title ? '<h3 style="margin:0 0 10px;font-family:var(--font-display);font-size:16px;">' + esc(q.title) + '</h3>' : '') +
        '<div class="exam-q">' + esc(q.scenario) + '</div>' +
        (q.has_image && q.images && q.images.length ?
          '<div class="exam-images">' + q.images.map(function(p){
            return '<img src="' + esc(p) + '" alt="題目附圖" loading="lazy">';
          }).join('') + '</div>' : '') +
        (q.sub_questions && q.sub_questions.length ?
          '<ol style="padding-left:20px;margin:0 0 18px;line-height:1.8;">' +
            q.sub_questions.map(function(sq){
              return '<li>' + esc(sq.text) + (sq.weight != null ? ' <span class="mono" style="color:var(--ink-faint);font-size:12px;">(' + sq.weight + '%)</span>' : '') + '</li>';
            }).join('') +
          '</ol>' : '') +
        '<button class="btn btn-primary" id="oral-reveal"' + (oralBrowse.revealed ? ' disabled' : '') + '>顯示參考答案</button>' +
        '<div id="oral-reveal-slot"></div>' +
        '<div class="quiz-nav exam-nav">' +
          '<button class="btn btn-ghost" id="oral-prev"' + (oralBrowse.idx === 0 ? ' disabled' : '') + '>上一題</button>' +
          '<button class="btn btn-ghost" id="oral-back">回選單</button>' +
          '<button class="btn btn-primary" id="oral-next"' + (oralBrowse.idx >= oralBrowse.list.length-1 ? ' disabled' : '') + '>下一題</button>' +
        '</div>' +
      '</div>';

    document.getElementById('oral-reveal').addEventListener('click', function(){
      oralBrowse.revealed = true;
      renderOralReveal(q);
      document.getElementById('oral-reveal').disabled = true;
    });
    document.getElementById('oral-prev').addEventListener('click', function(){
      if(oralBrowse.idx > 0){ oralBrowse.idx--; oralBrowse.revealed = false; renderOralLive(); }
    });
    document.getElementById('oral-next').addEventListener('click', function(){
      if(oralBrowse.idx < oralBrowse.list.length-1){ oralBrowse.idx++; oralBrowse.revealed = false; renderOralLive(); }
    });
    document.getElementById('oral-back').addEventListener('click', function(){
      oralBrowse = null;
      renderOralSetup();
    });

    if(oralBrowse.revealed) renderOralReveal(q);
  }

  function renderOralReveal(q){
    document.getElementById('oral-reveal-slot').innerHTML =
      '<div class="exam-explain"><span class="tag">參考答案</span><div class="exam-explain-body">' + esc(q.reference_answer || '（本題暫無參考答案）') + '</div></div>' +
      (q.source_file ? '<div class="exam-ref mono">出處：' + esc(q.source_file) + '</div>' : '');
  }

  /* ---------- mine tab ---------- */
  function startQuizWithPool(pool){
    if(!pool.length) return;
    quiz = { questions: shuffle(pool), idx: 0, score: 0, answered: false };
    setTab('quiz');
    renderQuizLive();
  }

  function renderMine(){
    var wrap = document.getElementById('mine-wrap');
    var id = getEmployeeId();
    if(!id){
      wrap.innerHTML =
        '<div class="empty-state" style="margin:60px auto;text-align:center;">' +
          '尚未設定工號。<br><button class="btn btn-primary" style="margin-top:14px;" id="mine-set-id">設定工號</button>' +
        '</div>';
      document.getElementById('mine-set-id').addEventListener('click', function(){ promptEmployeeId(); renderMine(); });
      return;
    }

    var latestAll = latestAttemptsByQuestion(id);
    var baseline = getBaseline(id);
    var latest = latestAttemptsByQuestion(id, baseline);
    var qById = {};
    allQuestions().forEach(function(q){ qById[q.id] = q; });
    STATE.examQuestions.forEach(function(q){ qById[q.id] = examToQuizShape(q); });
    STATE.papers2026Quiz.forEach(function(q){ qById[q.id] = papers2026ToQuizShape(q); });

    var wrongQuestions = Object.keys(latestAll)
      .filter(function(qid){ return latestAll[qid].is_correct === false; })
      .map(function(qid){ return qById[qid]; })
      .filter(Boolean);

    var favQuestions = STATE.favorites
      .filter(function(f){ return f.employee_id === id; })
      .map(function(f){ return qById[f.question_id]; })
      .filter(Boolean);

    var byChapter = {};
    Object.keys(latest).forEach(function(qid){
      var q = qById[qid]; if(!q) return;
      var key = q.chapterId;
      if(!key) return; // 考古題目前沒有章節分類，落點統計先不計入
      byChapter[key] = byChapter[key] || { total: 0, correct: 0 };
      byChapter[key].total++;
      if(latest[qid].is_correct) byChapter[key].correct++;
    });
    var chapterStats = Object.keys(byChapter).map(function(cid){
      var ch = findChapter(cid);
      var s = byChapter[cid];
      return { title: ch ? ch.title : cid, total: s.total, correct: s.correct, pct: Math.round(s.correct/s.total*100) };
    }).sort(function(a,b){ return a.pct - b.pct; });

    var totalAnswered = Object.keys(latest).length;
    var totalCorrect = Object.keys(latest).filter(function(qid){ return latest[qid].is_correct; }).length;

    function qList(list){
      if(!list.length) return '<div class="empty-state" style="padding:14px 0;">目前沒有題目</div>';
      return list.map(function(q){
        var ch = findChapter(q.chapterId);
        var tag = ch ? ch.title : (q.examTag || '');
        return '<div class="mine-q-row"><span class="ch-tag">' + esc(tag) + '</span><span class="q-txt">' + esc(q.question) + '</span></div>';
      }).join('');
    }

    wrap.innerHTML =
      '<h2>我的紀錄 <span class="mono" style="color:var(--ink-faint);font-size:13px;">工號 ' + esc(id) + '</span></h2>' +
      '<div class="mine-overall">整體作答 <b class="mono">' + totalCorrect + ' / ' + totalAnswered + '</b>' +
        (totalAnswered ? '（' + Math.round(totalCorrect/totalAnswered*100) + '%）' : '') + '</div>' +
      '<div class="mine-grid">' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>落點（依章節正確率，由低到高）</h3>' +
            '<button class="btn btn-ghost" id="reset-baseline">重新開始這一輪</button></div>' +
          '<div class="baseline-note">' + (baseline ? '統計區間：' + esc(new Date(baseline).toLocaleString('zh-TW')) + ' 之後' : '統計區間：從第一次作答至今') + '</div>' +
          (chapterStats.length ? chapterStats.map(function(s){
            return '<div class="chapter-stat-row"><span class="t">' + esc(s.title) + '</span>' +
              '<div class="bar"><div class="bar-fill" style="width:' + s.pct + '%"></div></div>' +
              '<span class="mono pct">' + s.pct + '%</span></div>';
          }).join('') : '<div class="empty-state" style="padding:14px 0;">' + (baseline ? '這一輪還沒有作答紀錄' : '還沒有作答紀錄') + '</div>') +
        '</div>' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>錯題（' + wrongQuestions.length + '）</h3>' +
            (wrongQuestions.length ? '<button class="btn btn-ghost" id="retry-wrong">重測這些</button>' : '') + '</div>' +
          qList(wrongQuestions) +
        '</div>' +
        '<div class="mine-card">' +
          '<div class="mine-card-head"><h3>收藏（' + favQuestions.length + '）</h3>' +
            (favQuestions.length ? '<button class="btn btn-ghost" id="retry-fav">重測這些</button>' : '') + '</div>' +
          qList(favQuestions) +
        '</div>' +
      '</div>';

    var retryWrongBtn = document.getElementById('retry-wrong');
    if(retryWrongBtn) retryWrongBtn.addEventListener('click', function(){ startQuizWithPool(wrongQuestions); });
    var retryFavBtn = document.getElementById('retry-fav');
    if(retryFavBtn) retryFavBtn.addEventListener('click', function(){ startQuizWithPool(favQuestions); });
    document.getElementById('reset-baseline').addEventListener('click', function(){
      resetBaseline(id, renderMine);
    });
  }

  /* ---------- admin tab ---------- */
  function renderAdmin(){
    var wrap = document.getElementById('admin-wrap');
    var unlocked = false;
    try { unlocked = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; } catch(e){}

    if(!unlocked){
      wrap.innerHTML =
        '<div class="admin-gate">' +
          '<h2>後台通關密語</h2>' +
          '<input type="password" id="admin-pass" placeholder="輸入通關密語" autocomplete="off">' +
          '<button class="btn btn-primary" id="admin-unlock">進入</button>' +
          '<div class="form-status" id="admin-status"></div>' +
        '</div>';
      document.getElementById('admin-unlock').addEventListener('click', function(){
        var v = document.getElementById('admin-pass').value;
        if(v === ADMIN_PASSPHRASE){
          try { sessionStorage.setItem(ADMIN_SESSION_KEY, '1'); } catch(e){}
          renderAdmin();
        } else {
          setStatus('admin-status', '密語不對，再試一次', false);
        }
      });
      return;
    }

    var qById = {};
    allQuestions().forEach(function(q){ qById[q.id] = q; });

    var byUser = {};
    STATE.attempts.forEach(function(a){
      byUser[a.employee_id] = byUser[a.employee_id] || { total: 0, correct: 0, last: a.answered_at };
      byUser[a.employee_id].total++;
      if(a.is_correct) byUser[a.employee_id].correct++;
      if(new Date(a.answered_at) > new Date(byUser[a.employee_id].last)) byUser[a.employee_id].last = a.answered_at;
    });
    var users = Object.keys(byUser).sort(function(a,b){ return byUser[b].total - byUser[a].total; });

    var log = STATE.attempts.slice().sort(function(a,b){ return new Date(b.answered_at) - new Date(a.answered_at); }).slice(0, 300);

    wrap.innerHTML =
      '<div class="admin-bar"><h2>後台：作答情形</h2><button class="btn btn-ghost" id="admin-lock">鎖定</button></div>' +
      '<div class="table-wrap"><table class="admin-table">' +
        '<thead><tr><th>工號</th><th>已答題數</th><th>答對數</th><th>正確率</th><th>最近作答</th></tr></thead>' +
        '<tbody>' + (users.length ? users.map(function(u){
          var s = byUser[u];
          return '<tr><td class="mono">' + esc(u) + '</td><td class="mono">' + s.total + '</td><td class="mono">' + s.correct + '</td>' +
            '<td class="mono">' + Math.round(s.correct/s.total*100) + '%</td><td class="mono">' + esc(new Date(s.last).toLocaleString('zh-TW')) + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty-state">目前還沒有任何作答紀錄</td></tr>') + '</tbody>' +
      '</table></div>' +
      '<h3 style="margin-top:28px;">最近作答紀錄（最多300筆）</h3>' +
      '<div class="table-wrap"><table class="admin-table">' +
        '<thead><tr><th>時間</th><th>工號</th><th>章節</th><th>題目</th><th>結果</th></tr></thead>' +
        '<tbody>' + (log.length ? log.map(function(a){
          var q = qById[a.question_id];
          var ch = q ? findChapter(q.chapterId) : null;
          return '<tr><td class="mono">' + esc(new Date(a.answered_at).toLocaleString('zh-TW')) + '</td>' +
            '<td class="mono">' + esc(a.employee_id) + '</td>' +
            '<td>' + esc(ch ? ch.title : '') + '</td>' +
            '<td>' + esc(q ? q.question : a.question_id) + '</td>' +
            '<td>' + (a.is_correct ? '<span class="pill-ok">正確</span>' : '<span class="pill-bad">錯誤</span>') + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty-state">尚無資料</td></tr>') + '</tbody>' +
      '</table></div>';

    document.getElementById('admin-lock').addEventListener('click', function(){
      try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch(e){}
      renderAdmin();
    });
  }

  /* ---------- add tab ---------- */
  function renderAdd(){
    var wrap = document.getElementById('add-wrap');
    var chapterOptions = allChapters().slice().sort(function(a,b){ return (a.num||999)-(b.num||999); })
      .map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.title) + '</option>'; }).join('');

    wrap.innerHTML =
      '<div class="form-card">' +
        '<h2>新增章節</h2>' +
        '<p class="hint">支援簡易語法：<code># / ## / ###</code> 標題、<code>- </code> 項目符號（每兩個空格縮排一層）、<code>**粗體**</code>、<code>&gt; 提醒文字</code>、<code>|欄位|欄位|</code> 表格列。送出後所有人打開網站都會看到。</p>' +
        '<div class="field"><label>章節標題</label><input type="text" id="new-chapter-title" placeholder="例如：Ch88 新章節主題"></div>' +
        '<div class="field"><label>內容</label><textarea id="new-chapter-body" placeholder="## 小標題&#10;- 重點一&#10;- 重點二"></textarea></div>' +
        '<button class="btn btn-primary" id="new-chapter-submit">新增章節</button>' +
        '<div class="form-status" id="new-chapter-status"></div>' +
      '</div>' +
      '<div class="form-card">' +
        '<h2>新增測驗題目</h2>' +
        '<div class="field"><label>所屬章節</label><select id="new-q-chapter">' + chapterOptions + '</select></div>' +
        '<div class="field"><label>題目</label><input type="text" id="new-q-text" placeholder="輸入題目敘述"></div>' +
        '<div class="field"><label>選項（點選圓圈標記正確答案）</label>' +
          [0,1,2,3].map(function(i){
            return '<div class="opt-row"><input type="radio" name="new-q-answer" value="' + i + '"' + (i===0?' checked':'') + '><input type="text" id="new-q-opt-' + i + '" placeholder="選項 ' + String.fromCharCode(65+i) + '"></div>';
          }).join('') +
        '</div>' +
        '<div class="field"><label>解析</label><textarea id="new-q-explain" style="min-height:90px;font-family:var(--font-body);"></textarea></div>' +
        '<button class="btn btn-primary" id="new-q-submit">新增題目</button>' +
        '<div class="form-status" id="new-q-status"></div>' +
      '</div>';

    document.getElementById('new-chapter-submit').addEventListener('click', submitNewChapter);
    document.getElementById('new-q-submit').addEventListener('click', submitNewQuestion);
  }

  function setStatus(elId, msg, ok){
    var s = document.getElementById(elId);
    s.textContent = msg;
    s.className = 'form-status ' + (ok ? 'ok' : 'err');
  }

  function submitNewChapter(){
    var title = document.getElementById('new-chapter-title').value.trim();
    var body = document.getElementById('new-chapter-body').value;
    if(!title){ setStatus('new-chapter-status', '請填寫章節標題', false); return; }
    var blocks = parseBody(body);
    var btn = document.getElementById('new-chapter-submit');
    btn.disabled = true;
    setStatus('new-chapter-status', '儲存中…', true);
    sbInsert('chapters', { id: uid('user-ch'), num: null, title: title, blocks: blocks })
      .then(function(row){
        STATE.chapters.push(row);
        setStatus('new-chapter-status', '已新增，所有人都看得到了。', true);
        document.getElementById('new-chapter-title').value = '';
        document.getElementById('new-chapter-body').value = '';
        renderAdd();
      })
      .catch(function(err){
        setStatus('new-chapter-status', '儲存失敗：' + err.message, false);
        btn.disabled = false;
      });
  }

  function submitNewQuestion(){
    var chapterId = document.getElementById('new-q-chapter').value;
    var question = document.getElementById('new-q-text').value.trim();
    var options = [0,1,2,3].map(function(i){ return document.getElementById('new-q-opt-' + i).value.trim(); });
    var answerIndex = parseInt((document.querySelector('input[name=new-q-answer]:checked') || {}).value || '0', 10);
    var explanation = document.getElementById('new-q-explain').value.trim();
    if(!question || options.some(function(o){ return !o; })){
      setStatus('new-q-status', '請填寫題目與全部四個選項', false); return;
    }
    var btn = document.getElementById('new-q-submit');
    btn.disabled = true;
    setStatus('new-q-status', '儲存中…', true);
    sbInsert('questions', {
      id: uid('user-q'), chapter_id: chapterId, question: question,
      options: options, answer_index: answerIndex, explanation: explanation
    }).then(function(row){
      STATE.questions.push({
        id: row.id, chapterId: row.chapter_id, question: row.question,
        options: row.options, answerIndex: row.answer_index, explanation: row.explanation
      });
      setStatus('new-q-status', '已新增，所有人都看得到了。', true);
      document.getElementById('new-q-text').value = '';
      [0,1,2,3].forEach(function(i){ document.getElementById('new-q-opt-' + i).value = ''; });
      document.getElementById('new-q-explain').value = '';
      renderAdd();
    }).catch(function(err){
      setStatus('new-q-status', '儲存失敗：' + err.message, false);
      btn.disabled = false;
    });
  }

  /* ================= boot ================= */
  function boot(){
    root.innerHTML = '<div class="empty-state" style="margin:auto;">載入中…</div>';
    loadAll().then(function(){
      // normalize question rows (Postgres snake_case -> the shape the rest of the app expects)
      STATE.questions = STATE.questions.map(function(q){
        return {
          id: q.id, chapterId: q.chapterId || q.chapter_id, question: q.question,
          options: q.options, answerIndex: (q.answerIndex != null ? q.answerIndex : q.answer_index),
          explanation: q.explanation
        };
      });
      renderShell();
      setTab('read');
    }).catch(function(err){
      root.innerHTML = '<div class="empty-state" style="margin:auto;">資料載入失敗：' + esc(err.message) + '<br>請重新整理頁面再試一次。</div>';
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
