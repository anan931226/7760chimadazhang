<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻專站</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F6F4EC;
  --panel:#FFFFFF;
  --panel-2:#EDEAE0;
  --line:#DAD5C5;
  --line-soft:#E4DFD0;
  --ink:#22221B;
  --ink-dim:#68655A;
  --ink-faint:#98958A;
  --ecg:#2A6F63;
  --ecg-dim:#1D544A;
  --ecg-soft:#DCEAE4;
  --spo2:#3D6E8C;
  --spo2-soft:#E1EAF0;
  --resp:#C1622A;
  --resp-soft:#F7E3D3;
  --nibp:#B23A2E;
  --nibp-soft:#FBE6E1;
  --sec-eval:#A2701E;
  --sec-eval-soft:#F3E7CD;
  --sec-app:#A85A3A;
  --sec-app-soft:#F1E0D6;
  --mark-bg:#F4DFA0;
  --ink-on-accent:#FFFFFF;
  --radius-card:10px;
  --radius-ctl:6px;
  --font-display:"Source Serif 4","Noto Serif TC",Georgia,serif;
  --font-body:"Noto Sans TC","IBM Plex Sans",sans-serif;
  --font-ui:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B17;
    --panel:#242320;
    --panel-2:#2C2A24;
    --line:#3B382F;
    --line-soft:#332F27;
    --ink:#ECE8DC;
    --ink-dim:#A9A497;
    --ink-faint:#726D60;
    --ecg:#5CC9B6;
    --ecg-dim:#2A9578;
    --ecg-soft:#1E332E;
    --spo2:#6FA8C9;
    --spo2-soft:#20303A;
    --resp:#E68A52;
    --resp-soft:#3A2416;
    --nibp:#F1836A;
    --nibp-soft:#3C1F18;
    --sec-eval:#E0B563;
    --sec-eval-soft:#372B15;
    --sec-app:#D08865;
    --sec-app-soft:#35211A;
    --mark-bg:#4A3A1E;
    --ink-on-accent:#12211D;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1B17;
  --panel:#242320;
  --panel-2:#2C2A24;
  --line:#3B382F;
  --line-soft:#332F27;
  --ink:#ECE8DC;
  --ink-dim:#A9A497;
  --ink-faint:#726D60;
  --ecg:#5CC9B6;
  --ecg-dim:#2A9578;
  --ecg-soft:#1E332E;
  --spo2:#6FA8C9;
  --spo2-soft:#20303A;
  --resp:#E68A52;
  --resp-soft:#3A2416;
  --nibp:#F1836A;
  --nibp-soft:#3C1F18;
  --sec-eval:#E0B563;
  --sec-eval-soft:#372B15;
  --sec-app:#D08865;
  --sec-app-soft:#35211A;
  --mark-bg:#4A3A1E;
  --ink-on-accent:#12211D;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}
::selection{background:var(--ecg-dim);color:#fff;}

a{color:var(--spo2);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ---------- app shell ---------- */
#root{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:24px;
  padding:0 20px;height:56px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.topbar .brand{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--font-display);
  font-weight:700;letter-spacing:.02em;
  font-size:18px;color:var(--ink);
  white-space:nowrap;
}
.topbar .brand .pulse{color:var(--ecg);font-size:15px;}
.topbar .brand .sub{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);
  letter-spacing:.12em;text-transform:uppercase;
}
.tabs{display:flex;gap:4px;margin-left:auto;}
.topbar .author{
  margin-left:12px;padding-left:12px;border-left:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  white-space:nowrap;letter-spacing:.02em;
}
.topbar .author .handle{color:var(--ink-dim);}
.theme-toggle{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-dim);border-radius:999px;width:32px;height:32px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  margin-left:12px;transition:color .15s ease,border-color .15s ease;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink-faint);}
.tab-btn{
  appearance:none;border:1px solid transparent;background:transparent;
  color:var(--ink-dim);font-family:var(--font-ui);font-weight:600;
  font-size:14px;letter-spacing:.02em;padding:8px 14px;border-radius:var(--radius-ctl);
  cursor:pointer;transition:color .15s ease,background .15s ease;
}
.tab-btn:hover{color:var(--ink);background:var(--panel-2);}
.tab-btn.active{color:var(--ink-on-accent);background:var(--ecg);}
.tab-btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}

.view{flex:1;display:none;min-height:0;}
.view.active{display:flex;}

/* ---------- read view ---------- */
#view-read{width:100%;}
.sidebar{
  width:300px;flex:none;
  border-right:1px solid var(--line);
  background:var(--panel);
  display:flex;flex-direction:column;
  max-height:calc(100vh - 56px);
}
.sidebar-search{padding:14px;border-bottom:1px solid var(--line);}
.sidebar-search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--radius-ctl);padding:9px 11px;
  font-size:13.5px;
}
.sidebar-search input:focus-visible{outline:2px solid var(--spo2);outline-offset:1px;}
.sidebar-search .count{
  margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
}
.chapter-list{overflow-y:auto;flex:1;padding:6px;}
.chapter-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-ctl);
  border-left:2px solid transparent;
  cursor:pointer;color:var(--ink-dim);
}
.chapter-item:hover{background:var(--panel-2);color:var(--ink);}
.chapter-item.active{
  background:var(--panel-2);color:var(--ink);
  border-left:2px solid var(--ecg);
}
.chapter-item .t{font-size:13px;line-height:1.35;}
.chapter-item .badge{
  margin-left:auto;flex:none;font-family:var(--font-mono);font-size:9px;
  color:var(--ecg);border:1px solid var(--ecg-dim);border-radius:3px;padding:1px 4px;
}

.content-pane{flex:1;overflow-y:auto;min-width:0;}
.content-inner{max-width:720px;margin:0 auto;padding:40px 32px 100px;}
.content-inner h1.chapter-title{
  font-family:var(--font-display);font-weight:700;font-size:30px;
  letter-spacing:.01em;margin:0 0 6px;text-wrap:balance;color:var(--ink);
}
.chapter-meta{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px;
}
.chapter-credit{font-size:12px;color:var(--ink-faint);margin:-10px 0 18px;}
.content-inner hr.divider{border:none;border-top:1px solid var(--line);margin:0 0 28px;}

.block-h2{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--ink);margin:30px 0 12px;text-wrap:balance;}
hr.content-divider{border:none;border-top:2px dashed var(--line);margin:40px 0;}
.block-h3{
  font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);
  margin:24px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:.55em;
}
.block-h3::before{content:"";width:16px;height:3px;background:var(--sec-accent,var(--ecg));display:inline-block;border-radius:2px;flex:0 0 auto;}
.block-h4{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink-dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
.block-p{margin:10px 0;color:var(--ink);}
.block-li{
  display:flex;gap:10px;margin:7px 0;padding-left:2px;
}
.block-li .bullet{flex:none;color:var(--sec-accent,var(--ecg));font-family:var(--font-mono);padding-top:2px;}
.block-li .txt{flex:1;min-width:0;}
/* 縮排層級。筆記實際最深到第 10 層，但原本 CSS 只定義到 3、JS 又把更深的一律
   夾成 3，所以 753 個項目（約 18%）看起來跟第 3 層一模一樣，讀者分不出誰屬於誰。
   改成支援到第 6 層（第 4 層有 562 項、第 5 層 103 項，第 6 層以上合計只有 88 項，
   夾在 6 不會再損失結構）。每層的增量刻意遞減，否則手機上第 6 層會被擠到沒地方
   放字。 */
.block-li.indent-0{margin-left:0;}
.block-li.indent-1{margin-left:22px;}
.block-li.indent-2{margin-left:40px;}
.block-li.indent-3{margin-left:56px;}
.block-li.indent-4{margin-left:70px;}
.block-li.indent-5{margin-left:82px;}
.block-li.indent-6{margin-left:92px;}
.block-li.indent-1 .bullet,.block-li.indent-2 .bullet,.block-li.indent-3 .bullet,
.block-li.indent-4 .bullet,.block-li.indent-5 .bullet,.block-li.indent-6 .bullet{color:var(--spo2);opacity:.8;}
/* 光靠縮排在窄螢幕上不夠分辨層級，所以項目符號也隨深度變化 */
.block-li.indent-2 .bullet,.block-li.indent-5 .bullet{opacity:.65;}
.block-li.indent-3 .bullet,.block-li.indent-6 .bullet{opacity:.5;}
@media (max-width:640px){
  .block-li.indent-1{margin-left:14px;}
  .block-li.indent-2{margin-left:26px;}
  .block-li.indent-3{margin-left:36px;}
  .block-li.indent-4{margin-left:44px;}
  .block-li.indent-5{margin-left:50px;}
  .block-li.indent-6{margin-left:55px;}
}

.block-quote{
  margin:16px 0;padding:12px 14px;background:var(--resp-soft);
  border-left:3px solid var(--resp);border-radius:0 var(--radius-ctl) var(--radius-ctl) 0;
  color:var(--ink);
}
.block-quote .tag{
  font-family:var(--font-mono);font-size:10px;color:var(--resp);
  letter-spacing:.1em;margin-right:8px;
}

.block-link{margin:6px 0 20px;}
.block-link a{
  display:inline-block;padding:9px 14px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--radius-ctl);
  color:var(--spo2);font-size:13px;text-decoration:none;
}
.block-link a:hover{border-color:var(--spo2);}

.jump-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px;}
.jump-nav a{
  font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);text-decoration:none;
}
.jump-nav a:hover{border-color:var(--ecg);color:var(--ecg);}
.jump-nav a.jump-nav-mock{border-style:dashed;color:var(--spo2);}
.jump-nav a.jump-nav-mock:hover{border-color:var(--spo2);color:var(--spo2);}

#view-papers2026 table.block-table td{white-space:normal;}
#view-papers2026 .block-h3{scroll-margin-top:16px;}

/* section-card: colored background block per BEAR section (Background/Evaluation/Application) */
#view-papers2026 .sec-card{
  border-radius:var(--radius-card);border:1px solid var(--line);
  padding:18px 20px 20px;margin:0 0 20px;
}
#view-papers2026 .sec-card.sec-bg{--sec-accent:var(--spo2);background:var(--spo2-soft);}
#view-papers2026 .sec-card.sec-eval{--sec-accent:var(--sec-eval);background:var(--sec-eval-soft);}
#view-papers2026 .sec-card.sec-app{--sec-accent:var(--sec-app);background:var(--sec-app-soft);}
#view-papers2026 .sec-card > .block-h3:first-child{margin-top:0;}
#view-papers2026 .sec-card table.block-table th,
#view-papers2026 .sec-card table.block-table:not(:has(thead)) tr:first-child td{
  background:color-mix(in srgb, var(--sec-accent) 22%, var(--panel));
  color:var(--sec-accent);
}
#view-papers2026 .sec-card table.block-table tbody tr:nth-child(even) td{
  background:color-mix(in srgb, var(--sec-accent) 7%, var(--panel));
}
#view-papers2026 .sec-card .block-callout{
  background:color-mix(in srgb, var(--sec-accent) 15%, var(--panel));
  border-left-color:var(--sec-accent);
}
#view-papers2026 .sec-card .block-callout.callout-info{border-left-color:var(--ecg);}
#view-papers2026 .sec-card .block-callout.callout-warn{border-left-color:var(--resp);}

.mock-exam-section{margin-top:8px;}
.mock-exam-heading{font-family:var(--font-display);font-size:16px;margin:28px 0 14px;color:var(--ink);}
.mock-quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px;margin-bottom:14px;}
.mock-oral-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px;margin-bottom:14px;}
.mock-oral-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin-bottom:8px;}
.mock-oral-scenario{font-size:13.5px;line-height:1.7;color:var(--ink);margin-bottom:10px;}
.mock-oral-subq{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-dim);}
.mock-oral-toggle{margin-bottom:10px;}
.mock-oral-answer-list{margin:0;padding-left:16px;font-size:13px;line-height:1.75;color:var(--ink-dim);}
.mock-oral-answer-list li{margin-bottom:4px;}

.block-img{margin:18px 0;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-ctl);text-align:center;}
.block-img img{max-width:100%;height:auto;border-radius:3px;display:inline-block;}
.block-img figcaption{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--ink-dim);text-align:left;}

.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius-ctl);}
table.block-table{border-collapse:collapse;width:100%;font-size:13.5px;}
table.block-table td, table.block-table th{
  border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  padding:8px 12px;font-family:var(--font-mono);white-space:nowrap;
}
table.block-table th{background:var(--panel-2);color:var(--spo2);font-weight:600;text-align:left;}
table.block-table:not(:has(thead)) tr:first-child td{background:var(--panel-2);color:var(--spo2);font-weight:600;}
table.block-table tbody tr:nth-child(even) td{background:var(--panel-2);}
table.block-table tr:last-child td{border-bottom:none;}
table.block-table td:last-child,table.block-table th:last-child{border-right:none;}

.block-callout{margin:16px 0;padding:14px 16px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--spo2);border-radius:0 var(--radius-ctl) var(--radius-ctl) 0;}
.block-callout.callout-info{border-left-color:var(--ecg);}
.block-callout.callout-warn{border-left-color:var(--resp);}
.block-callout .callout-title{font-family:var(--font-display);font-weight:700;font-size:13.5px;margin-bottom:8px;color:var(--ink);}
.block-callout .block-p,.block-callout .block-li{margin:0 0 4px;}

b{color:var(--ink);font-weight:700;}
s{color:var(--ink-faint);}
mark{background:var(--mark-bg);color:var(--ink);padding:1px 4px;border-radius:3px;}

.empty-state{color:var(--ink-faint);padding:60px 32px;text-align:center;font-family:var(--font-display);}

/* ---------- quiz view ---------- */
.resume-card{
  background:var(--panel-2);border:1px solid var(--spo2);border-radius:var(--radius-ctl);
  padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--ink-dim);
}
.resume-card b{color:var(--ink);font-family:var(--font-mono);}
.resume-actions{display:flex;gap:10px;margin-top:12px;}
.btn{
  appearance:none;border:none;border-radius:var(--radius-ctl);
  padding:10px 18px;font-family:var(--font-ui);font-weight:600;font-size:14px;
  cursor:pointer;letter-spacing:.02em;
}
.btn-primary{background:var(--ecg);color:var(--ink-on-accent);}
.btn-primary:hover{background:color-mix(in srgb, var(--ecg) 85%, white);}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint);}
.btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-q{font-size:17px;color:var(--ink);margin:0 0 18px;text-wrap:balance;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius-ctl);padding:12px 14px;font-size:14px;cursor:pointer;
  display:flex;gap:10px;line-height:1.5;
}
.opt-btn:hover:not(:disabled){border-color:var(--ink-faint);}
.opt-btn .k{font-family:var(--font-mono);color:var(--ink-faint);flex:none;}
.opt-btn.correct{border-color:var(--ecg);background:var(--ecg-soft);}
.opt-btn.correct .k{color:var(--ecg);}
.opt-btn.incorrect{border-color:var(--nibp);background:var(--nibp-soft);}
.opt-btn.incorrect .k{color:var(--nibp);}
.opt-btn:disabled{cursor:default;}
.quiz-explain{
  margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:var(--radius-ctl);
  border-left:3px solid var(--spo2);font-size:13.5px;color:var(--ink-dim);
}
.quiz-explain .tag{font-family:var(--font-mono);font-size:10px;color:var(--spo2);letter-spacing:.1em;margin-right:8px;}
.quiz-nav{display:flex;justify-content:flex-end;margin-top:20px;}

/* ---------- exam (歷屆考古題) view ---------- */
#view-exam{width:100%;justify-content:center;overflow-y:auto;}
.exam-wrap{max-width:640px;width:100%;padding:40px 24px 100px;margin:0 auto;}
.exam-setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.exam-setup h2{font-family:var(--font-display);font-size:20px;margin:0 0 14px;}
.exam-scope-hint{margin:0 0 18px;font-size:12.5px;line-height:1.7;color:var(--ink-faint);}
.exam-setup label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
/* 範圍的兩種切法：依題庫／依章節 */
.scope-mode{display:inline-flex;gap:0;margin:0 0 18px;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
.scope-mode-btn{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;
  background:var(--panel);border:none;color:var(--ink-dim);
  padding:7px 18px;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.scope-mode-btn+.scope-mode-btn{border-left:1px solid var(--line);}
.scope-mode-btn:hover{color:var(--ink);}
.scope-mode-btn.active{background:var(--nibp);color:var(--panel);}
.scope-stat{font-size:12.5px;color:var(--ink-faint);margin:-8px 0 14px;line-height:1.7;}
.scope-stat b{color:var(--ink-dim);font-family:var(--font-mono);}
.scope-opts{display:flex;flex-direction:column;gap:12px;margin:0 0 20px;}
.scope-opt{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--ink);cursor:pointer;
  text-transform:none;letter-spacing:normal;font-family:inherit;margin-bottom:0;}
.scope-opt input{accent-color:var(--nibp);width:15px;height:15px;cursor:pointer;flex:none;margin-top:3px;}
.scope-opt .t{display:flex;flex-direction:column;gap:2px;min-width:0;}
.scope-opt em{font-style:normal;font-size:12px;line-height:1.6;color:var(--ink-faint);}
/* 控制項底下的小字說明 */
.ctl-hint{font-size:12px;line-height:1.65;color:var(--ink-faint);margin:-4px 0 16px;}
.ctl-hint b{color:var(--ink-dim);font-weight:600;}
.resume-card .ctl-hint{margin:10px 0 0;}
.mine-card .ctl-hint{margin:-6px 0 10px;}
.exam-nav-hint{margin:12px 0 0;text-align:right;}
.exam-setup select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px;border-radius:var(--radius-ctl);font-size:14px;margin-bottom:16px;
}
.exam-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.exam-progress{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.exam-progress .idx{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.06em;}
.exam-progress .score{font-family:var(--font-mono);font-size:18px;color:var(--ecg);font-weight:600;}
.exam-progress select.exam-year-tag{margin-left:auto;}
.exam-year-tag{
  display:inline-block;font-size:10px;color:var(--spo2);
  border:1px solid color-mix(in srgb, var(--spo2) 45%, var(--panel));border-radius:3px;padding:2px 6px;
}
select.exam-year-tag{
  appearance:none;-webkit-appearance:none;background:var(--panel);cursor:pointer;
  font-family:var(--font-mono);
}
.exam-jump-hint{font-size:11px;color:var(--ink-faint);text-align:right;margin:6px 0 14px;}
.exam-q{font-size:17px;color:var(--ink);margin:0 0 18px;text-wrap:balance;white-space:pre-wrap;}
/* 題目瀏覽的計分結算 */
.exam-summary{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:28px 24px;text-align:center;}
.exam-summary .final{font-family:var(--font-mono);font-size:44px;color:var(--ecg);margin:8px 0;}
.exam-summary .label{color:var(--ink-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
.exam-summary-wrong{text-align:left;margin:26px auto 0;max-width:640px;}
.exam-summary-wrong h3{font-family:var(--font-display);font-size:14px;margin:0 0 6px;color:var(--ink);}
.exam-summary-row{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line-soft);
  padding:8px 0;font:inherit;font-size:13px;color:inherit;cursor:pointer;
}
.exam-summary-row:last-child{border-bottom:none;}
.exam-summary-row:hover .q-txt{color:var(--ink);}
.exam-summary-row .ch-tag{flex:none;font-size:10.5px;color:var(--spo2);letter-spacing:.03em;}
.exam-summary-row .q-txt{flex:1;min-width:0;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exam-images{display:flex;flex-direction:column;gap:10px;margin:0 0 18px;}
.exam-images img{max-width:100%;border-radius:var(--radius-ctl);border:1px solid var(--line);}
.exam-explain-images{display:flex;flex-direction:column;gap:14px;margin:14px 0 0;}
.exam-explain-figure{margin:0;}
.exam-explain-figure img{max-width:100%;border-radius:var(--radius-ctl);border:1px solid var(--line);display:block;}
.exam-explain-figure figcaption{font-size:11.5px;color:var(--ink-dim);margin-top:4px;}
.exam-options{display:flex;flex-direction:column;gap:10px;}
.exam-void-badge{
  margin-top:16px;padding:10px 14px;background:var(--resp-soft);border-left:3px solid var(--resp);
  border-radius:var(--radius-ctl);color:var(--resp);font-size:13.5px;
}
.exam-answer-tag{margin-top:16px;color:var(--ecg);font-size:14px;}
.exam-ref{margin-top:6px;color:var(--ink-faint);font-size:11.5px;}
.exam-explain{
  margin-top:12px;padding:12px 14px;background:var(--panel-2);border-radius:var(--radius-ctl);
  border-left:3px solid var(--spo2);font-size:13.5px;color:var(--ink-dim);
}
.exam-explain .tag{font-family:var(--font-mono);font-size:10px;color:var(--spo2);letter-spacing:.1em;margin-right:8px;display:block;margin-bottom:6px;}
.exam-explain-body{white-space:pre-wrap;line-height:1.7;}

/* ---- 版本落差筆記 (version-gap notes) ---- */
.exam-vgn-entry{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);}
.exam-vgn-hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px;line-height:1.6;}

.vgn-inline{
  margin-top:14px;padding:12px 14px;background:var(--sec-eval-soft);
  border-left:3px solid var(--sec-eval);border-radius:var(--radius-ctl);
}
.vgn-inline-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.vgn-inline-head .tag{font-family:var(--font-mono);font-size:10px;color:var(--sec-eval);letter-spacing:.1em;}
.vgn-inline-sub{font-size:11.5px;color:var(--ink-dim);}
.vgn-inline-foot{margin-top:10px;font-size:11px;color:var(--ink-faint);}

.vgn-entry{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius-ctl);
  padding:12px 14px;margin-bottom:10px;
}
.vgn-entry:last-of-type{margin-bottom:0;}
/* flagged = the compiler is not fully certain; must never read as equal to the rest */
.vgn-entry.flagged{border-color:color-mix(in srgb, var(--nibp) 45%, var(--line));background:var(--nibp-soft);}
.vgn-entry-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;}
.vgn-badge{font-size:10.5px;color:var(--spo2);background:var(--spo2-soft);border-radius:3px;padding:2px 7px;}
.vgn-cat{font-size:10.5px;color:var(--ink-faint);}
.vgn-opt{font-size:10.5px;color:var(--resp);background:var(--resp-soft);border-radius:3px;padding:2px 7px;}
.vgn-flagtag{font-size:10.5px;color:var(--nibp);border:1px solid color-mix(in srgb, var(--nibp) 45%, var(--panel));border-radius:3px;padding:2px 7px;}
.vgn-headline{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:4px;}
.vgn-detail{font-size:13px;color:var(--ink-dim);line-height:1.75;}
.vgn-quote{
  margin-top:8px;padding:8px 11px;background:var(--panel-2);border-radius:var(--radius-ctl);
  font-size:11.5px;line-height:1.65;color:var(--ink-dim);overflow-wrap:break-word;
}
.vgn-quote .pg{color:var(--ecg);}
.vgn-flagnote{margin-top:8px;font-size:11px;color:var(--nibp);}
.vgn-jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.vgn-jump{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);
  border-radius:var(--radius-ctl);padding:4px 10px;font-size:11px;cursor:pointer;
}
.vgn-jump:hover{color:var(--ink);border-color:var(--ink-faint);}
/* brief marker on the entry the reader just came back to, so a long list
   doesn't leave them hunting for where they were */
.vgn-returned{box-shadow:0 0 0 2px var(--ecg);}

.vgn-page{max-width:780px;}
.vgn-masthead{padding-bottom:18px;border-bottom:1px solid var(--line);}
.vgn-eyebrow{font-size:10.5px;color:var(--ecg);letter-spacing:.14em;margin-bottom:8px;}
.vgn-title{font-family:var(--font-display);font-size:22px;margin:0 0 10px;line-height:1.35;}
.vgn-lede{font-size:13px;color:var(--ink-dim);line-height:1.75;margin:0 0 12px;}
.vgn-meta{font-size:11px;color:var(--ink-faint);}
.vgn-scope{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-ctl);padding:10px 14px;}
.vgn-scope summary{cursor:pointer;font-size:12.5px;color:var(--ecg);}
.vgn-scope p{font-size:12px;color:var(--ink-dim);line-height:1.75;margin:10px 0 0;}
.vgn-controls{padding:14px 0;border-bottom:1px solid var(--line-soft);}
.vgn-chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.vgn-chiprow:last-child{margin-bottom:0;}
.vgn-chiplabel{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;margin-right:4px;}
.vgn-chip{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);
  border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:var(--font-ui);
}
.vgn-chip:hover{border-color:var(--ink-faint);color:var(--ink);}
.vgn-chip.active{background:var(--ecg);border-color:var(--ecg);color:var(--ink-on-accent);}
.vgn-chip.vgn-clear{color:var(--ink-faint);}
.vgn-section{margin-top:28px;}
.vgn-sec-head{display:flex;align-items:baseline;gap:10px;}
.vgn-sec-head h3{font-family:var(--font-display);font-size:16px;margin:0;}
.vgn-sec-count{font-size:11px;color:var(--ink-faint);}
.vgn-sec-desc{font-size:12px;color:var(--ink-dim);margin:4px 0 14px;line-height:1.7;}
.vgn-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);line-height:1.7;}
@media (max-width:640px){
  .vgn-title{font-size:19px;}
  .vgn-entry{padding:10px 12px;}
}
.exam-explain-empty{color:var(--ink-faint);font-style:italic;}
.exam-nav.quiz-nav{justify-content:space-between;}

/* ---------- add view ---------- */
#view-add{width:100%;overflow-y:auto;justify-content:center;}
.add-wrap{max-width:640px;width:100%;padding:40px 24px 100px;display:flex;flex-direction:column;gap:24px;}
.readonly-banner{
  background:var(--nibp-soft);border:1px solid var(--nibp);color:var(--nibp);
  border-radius:var(--radius-ctl);padding:12px 14px;font-size:13.5px;display:none;
}
.readonly-banner.show{display:block;}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.form-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
.form-card .hint{color:var(--ink-faint);font-size:12.5px;margin:0 0 18px;line-height:1.6;}
.form-card .hint code{background:var(--panel-2);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:11.5px;color:var(--spo2);}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.field input[type=text], .field textarea, .field select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 11px;border-radius:var(--radius-ctl);font-size:14px;resize:vertical;
}
.field textarea{min-height:160px;font-family:var(--font-mono);font-size:13px;line-height:1.6;}
.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--spo2);outline-offset:1px;}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.opt-row input[type=radio]{accent-color:var(--ecg);flex:none;}
.opt-row input[type=text]{flex:1;}
.form-status{margin-top:12px;font-size:13px;}
.form-status.ok{color:var(--ecg);}
.form-status.err{color:var(--nibp);}

/* ---------- id badge ---------- */
.id-badge{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-dim);font-family:var(--font-mono);font-size:11.5px;
  padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:border-color .15s ease,color .15s ease;
}
.id-badge:hover{border-color:var(--spo2);color:var(--ink);}
.id-badge.unset{color:var(--resp);border-color:color-mix(in srgb, var(--resp) 40%, var(--panel));}

/* ---------- favorite star ---------- */
.fav-star{
  appearance:none;border:none;background:transparent;color:var(--ink-faint);
  font-size:20px;line-height:1;cursor:pointer;vertical-align:middle;margin-left:10px;
  transition:color .15s ease,transform .1s ease;
}
.fav-star:hover{color:var(--resp);transform:scale(1.12);}
.fav-star.active{color:var(--resp);}

/* ---------- mine tab ---------- */
.mine-wrap{max-width:980px;margin:0 auto;padding:32px 24px 80px;}
.mine-wrap h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;display:flex;align-items:baseline;gap:10px;}
.mine-overall{color:var(--ink-dim);font-size:14px;margin-bottom:24px;}
.mine-overall b{color:var(--ecg);}
.mine-grid{display:grid;grid-template-columns:1fr;gap:16px;}
.mine-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px;
}
.mine-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.mine-card-head h3{font-family:var(--font-display);font-size:15px;margin:0;color:var(--ink);}
.baseline-note{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin:-4px 0 14px;}
.mine-q-row{
  display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.mine-q-row:last-child{border-bottom:none;}
.mine-q-row .ch-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--spo2);letter-spacing:.03em;}
.mine-q-row .q-txt{color:var(--ink-dim);}
.chapter-stat-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
.chapter-stat-row .t{flex:1;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chapter-stat-row .bar{width:110px;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;flex:none;}
.chapter-stat-row .bar-fill{height:100%;background:var(--nibp);}
.chapter-stat-row .bar-fill{background:linear-gradient(90deg,var(--nibp),var(--resp) 50%,var(--ecg));}
.chapter-stat-row .pct{width:38px;text-align:right;color:var(--ink-faint);flex:none;}
.chapter-stat-row .n{width:46px;text-align:right;color:var(--ink-faint);flex:none;font-size:11px;}
/* 落點的大類層（13 大類，點開才看到底下各篇筆記） */
.cat-stat{border-bottom:1px solid var(--line-soft);}
.cat-stat:last-child{border-bottom:none;}
.cat-stat>summary{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;cursor:pointer;list-style:none;}
.cat-stat>summary::-webkit-details-marker{display:none;}
.cat-stat>summary:hover .t{color:var(--nibp);}
.cat-stat>summary .caret{flex:none;width:11px;font-size:9px;color:var(--ink-faint);transition:transform .15s ease;}
.cat-stat[open]>summary .caret{transform:rotate(90deg);}
.cat-stat>summary .t{flex:1;min-width:0;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-stat>summary .bar{width:110px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;flex:none;}
.cat-stat>summary .bar-fill{height:100%;background:linear-gradient(90deg,var(--nibp),var(--resp) 50%,var(--ecg));}
.cat-stat>summary .pct{width:38px;text-align:right;color:var(--ink-dim);flex:none;}
.cat-stat>summary .n{width:46px;text-align:right;color:var(--ink-faint);flex:none;font-size:11px;}
.cat-stat-notes{padding:2px 0 10px 21px;}
.cat-stat-notes .chapter-stat-row{font-size:12.5px;padding:4px 0;}
.cat-stat-foot{font-size:11.5px;color:var(--ink-faint);margin-top:10px;}

/* ---------- 關於麻專站 ---------- */
#view-about{width:100%;overflow-y:auto;}
.about-wrap{width:100%;}
.about-inner{max-width:760px;margin:0 auto;padding:40px 24px 100px;}
.about-inner h1{font-family:var(--font-display);font-weight:700;font-size:28px;margin:0 0 10px;color:var(--ink);}
.about-inner h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:36px 0 12px;color:var(--ink);}
.about-lede{color:var(--ink-dim);font-size:15px;margin:0 0 8px;}
.about-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.about-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px 16px;}
.about-card h3{font-family:var(--font-display);font-size:15px;margin:0 0 5px;color:var(--ecg);}
.about-card p{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-dim);}
.about-tips{margin:0;padding-left:20px;}
.about-tips li{margin:9px 0;font-size:14px;line-height:1.8;color:var(--ink-dim);}
.about-tips b{color:var(--ink);}
.changelog{display:flex;flex-direction:column;gap:2px;}
.cl-entry{border-left:2px solid var(--line);padding:12px 0 12px 16px;}
.cl-entry.big{border-left-color:var(--ecg);}
.cl-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;}
.cl-date{font-size:12px;color:var(--ink-faint);letter-spacing:.04em;flex:none;}
.cl-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);}
.cl-badge{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;flex:none;
  color:var(--ink-on-accent);background:var(--ecg);border-radius:3px;padding:2px 7px;
}
.cl-items{margin:6px 0 0;padding-left:18px;}
.cl-items li{margin:5px 0;font-size:13.5px;line-height:1.8;color:var(--ink-dim);}
.cl-items b{color:var(--ink);}
.about-foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);}

/* ---------- admin tab ---------- */
.admin-wrap h3{font-family:var(--font-display);font-size:16px;margin:30px 0 8px;color:var(--ink);}
.admin-note{font-size:12.5px;line-height:1.7;color:var(--ink-faint);margin:0 0 12px;}
.stat-tiles{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 6px;}
.stat-tile{
  flex:1 1 140px;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-card);padding:14px 16px;
}
.stat-tile .n{font-size:26px;font-weight:600;color:var(--ecg);line-height:1.2;}
.stat-tile .l{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
.stat-tile .s{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.month-rows{display:flex;flex-direction:column;gap:2px;}
.month-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;}
.month-row .mk{color:var(--ink-dim);flex:none;width:60px;}
.month-row .bar{flex:1;min-width:40px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;}
.month-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--nibp),var(--resp) 50%,var(--ecg));}
.month-row .v{width:54px;text-align:right;color:var(--ink-dim);flex:none;}
.month-row .v2{width:64px;text-align:right;color:var(--ink-faint);flex:none;font-size:11.5px;}
@media (max-width:640px){
  .month-row{flex-wrap:wrap;}
  .month-row .bar{order:9;flex-basis:100%;}
}
.admin-wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px;}
.admin-gate{max-width:320px;margin:80px auto 0;display:flex;flex-direction:column;gap:12px;text-align:center;}
.admin-gate h2{font-family:var(--font-display);font-size:18px;margin:0 0 4px;}
.admin-gate input{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-ctl);
  color:var(--ink);padding:10px 12px;font-size:14px;
}
.admin-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.admin-bar h2{font-family:var(--font-display);font-size:20px;margin:0;}
table.admin-table{border-collapse:collapse;width:100%;font-size:13px;}
table.admin-table th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.admin-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-dim);}
table.admin-table tr:last-child td{border-bottom:none;}
.pill-ok{color:var(--ecg);font-family:var(--font-mono);font-size:12px;}
.pill-bad{color:var(--nibp);font-family:var(--font-mono);font-size:12px;}

@media (max-width:820px){
  .sidebar{width:230px;}
  .content-inner{padding:28px 18px 80px;}
}
@media (max-width:640px){
  #view-read.active{flex-direction:column;}
  .sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--line);}
  .topbar{gap:10px;padding:0 12px;}
  .topbar .brand .sub{display:none;}
  .topbar .author{display:none;}

  /* ================= tiny helpers ================= */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(s){
    // **bold**, ~~strike~~ and ==highlight== -> safe <b>/<s>/<mark>, everything else escaped
    var out = "", src = String(s || "");
    var re = /\*\*(.+?)\*\*|~~(.+?)~~|==(.+?)==/g, m, last = 0;
    while((m = re.exec(src))){
      out += esc(src.slice(last, m.index));
      if(m[1] !== undefined){ out += "<b>" + esc(m[1]) + "</b>"; }
      else if(m[2] !== undefined){ out += "<s>" + esc(m[2]) + "</s>"; }
      else { out += "<mark>" + esc(m[3]) + "</mark>"; }
      last = re.lastIndex;
    }
    out += esc(src.slice(last));
    return out;
  }
  function uid(prefix){
    return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= mini-markdown parser (mirrors the docx/site build pipeline) ================= */
  function parseBody(text){
    var lines = String(text || "").split("\n");
    var blocks = [];
    var i = 0, n = lines.length;
    while(i < n){
      var line = lines[i].replace(/\s+$/,"");
      if(line.trim() === ""){ i++; continue; }

      if(line.replace(/^\s+/,"").indexOf("|") === 0){
        var tableLines = [];
        while(i < n && lines[i].replace(/\s+$/,"").replace(/^\s+/,"").indexOf("|") === 0){
          tableLines.push(lines[i].replace(/\s+$/,""));
          i++;
        }
        var rows = tableLines.map(function(tl){
          var cells = tl.trim().split("|");
          if(cells.length && cells[0].trim() === "") cells = cells.slice(1);
          if(cells.length && cells[cells.length-1].trim() === "") cells = cells.slice(0,-1);
          return cells.map(function(c){ return c.trim(); });
        });
        blocks.push({type:"table", rows: rows});
        continue;
      }

      var textOnly = line.trim();
      if(/^-\s*$/.test(textOnly)){ i++; continue; }

      var mH = line.match(/^(#{1,3})\s+(.*)$/);
      if(mH){
        var level = Math.min(mH[1].length + 1, 4);
        blocks.push({type:"h"+level, text: mH[2].trim()});
        i++; continue;
      }

      var mLi = line.match(/^(\s*)-\s+(.*)$/);
      if(mLi){
        var indent = Math.floor(mLi[1].length / 2);
        blocks.push({type:"li", indent: indent, text: mLi[2].trim()});
        i++; continue;
      }

      var mQ = line.match(/^>\s?(.*)$/);
      if(mQ){
        blocks.push({type:"quote", text: mQ[1].trim()});
        i++; continue;
      }

      blocks.push({type:"p", text: line.trim()});
      i++;
    }
    return blocks;
  }

  /* ================= rendering: blocks -> HTML ================= */
  function renderBlocks(blocks){
    if(!blocks || !blocks.length){
      return '<div class="empty-state">此章節目前沒有內容。</div>';
    }
    return blocks.map(function(b){
      if(b.type === "h2") return '<div class="block-h2">' + inline(b.text) + '</div>';
      if(b.type === "h3") return '<div class="block-h3">' + inline(b.text) + '</div>';
      if(b.type === "h4") return '<div class="block-h4">' + inline(b.text) + '</div>';
      if(b.type === "quote") return '<div class="block-quote"><span class="tag">TIP</span>' + inline(b.text) + '</div>';
      if(b.type === "link") return '<div class="block-link"><a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + inline(b.text) + '</a></div>';
      if(b.type === "divider") return '<hr class="content-divider">';
      if(b.type === "img") return '<figure class="block-img"><img src="' + esc(b.path) + '" alt="筆記附圖" loading="lazy">' +
        (b.caption ? '<figcaption>' + b.caption.split("\n").map(function(l){ return inline(l); }).join('<br>') + '</figcaption>' : '') +
        '</figure>';
      /* 夾到 6：筆記最深有 10 層，但第 7 層以上合計只有 50 個項目，再往下給縮排
         在手機上會擠掉正文寬度。CSS 對應定義到 indent-6。 */
      if(b.type === "li") return '<div class="block-li indent-' + Math.min(b.indent,6) + '"><span class="bullet">&#9656;</span><span class="txt">' + inline(b.text) + '</span></div>';
      if(b.type === "table"){
        var thead = b.headerRow ? '<thead><tr>' + b.headerRow.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead>' : '';
        var rows = b.rows.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('');
        return '<div class="table-wrap"><table class="block-table">' + thead + '<tbody>' + rows + '</tbody></table></div>';
      }
      if(b.type === "callout") return '<div class="block-callout callout-' + esc(b.subtype || "note") + '">' +
        (b.title ? '<div class="callout-title">' + inline(b.title) + '</div>' : '') +
        renderBlocks(b.items) +
        '</div>';
      return '<div class="block-p">' + inline(b.text) + '</div>';
    }).join("");
  }

  /* ================= views ================= */
  var root = document.getElementById('root');

  function chapterMatches(c, term){
    if(!term) return true;
    var t = term.toLowerCase();
    if(c.title.toLowerCase().indexOf(t) !== -1) return true;
    for(var i=0;i<c.blocks.length;i++){
      var bt = c.blocks[i].text;
      if(bt && bt.toLowerCase().indexOf(t) !== -1) return true;
      if(c.blocks[i].type === "table"){
        var rows = c.blocks[i].rows;
        for(var r=0;r<rows.length;r++){
          for(var k=0;k<rows[r].length;k++){
            if(rows[r][k].toLowerCase().indexOf(t) !== -1) return true;
          }
        }
      }
    }
    return false;
  }

  /* ---------- favorites & attempts ---------- */

    var id = getEmployeeId();
    if(!id) return;
    if(q.isExam){

      recordPapers2026Attempt(q, selectedIndex, correct);

    var row = {
      id: uid('att'), employee_id: id, chapter_id: q.chapterId,
      question_id: q.id, selected_index: selectedIndex, is_correct: correct
    };
    sbInsert("quiz_attempts", row).then(function(saved){ STATE.attempts.push(saved); });
  }
  function allAttempts(){ return STATE.attempts.concat(STATE.examAttempts).concat(STATE.papers2026Attempts); }
  function latestAttemptsByQuestion(employeeId, sinceIso){
    var mine = allAttempts().filter(function(a){
      return a.employee_id === employeeId && (!sinceIso || a.answered_at >= sinceIso);
    });
    mine.sort(function(a,b){ return new Date(a.answered_at) - new Date(b.answered_at); });
    var map = {};
    mine.forEach(function(a){ map[a.question_id] = a; });
    return map;
  }
  function getBaseline(employeeId){
    var row = STATE.baselines.filter(function(b){ return b.employee_id === employeeId; })[0];
    return row ? row.reset_at : null;
  }
  /* ---------- resumable quiz session ----------
     quiz_sessions 的主鍵是 (employee_id, source)（schema v13），所以同一個人可以
     同時各留一份未完成進度。目前用到兩個 source：
       'chapter' —— 測驗分頁（舊資料 backfill 成這個值，不能改）
       'browse'  —— 考古題分頁的題目瀏覽器，三個題庫共用一份
     瀏覽器刻意只留一份：它本來就是「換一個題庫範圍就重開一輪」，跟測驗分頁換章節
     的語意一樣；若照題庫範圍各存一份，一個人最多會累積 87 列而且續作卡片得先讓他
     挑是哪一批，不划算。 */
  var SESSION_CHAPTER = 'chapter', SESSION_BROWSE = 'browse';

  function getSession(employeeId, source){
    var src = source || SESSION_CHAPTER;
    return STATE.sessions.filter(function(s){
      return s.employee_id === employeeId && (s.source || SESSION_CHAPTER) === src;
    })[0] || null;
  }
  function saveSession(employeeId, quizObj, source){
    var src = source || SESSION_CHAPTER;
    var row = {
      employee_id: employeeId,
      source: src,
      question_ids: quizObj.questions.map(function(q){ return q.id; }),
      idx: quizObj.idx,
      score: quizObj.score,
      updated_at: new Date().toISOString()
    };
    sbUpsert("quiz_sessions", row, "employee_id,source").then(function(saved){
      STATE.sessions = STATE.sessions.filter(function(s){
        return !(s.employee_id === employeeId && (s.source || SESSION_CHAPTER) === src);
      });
      STATE.sessions.push(saved);
    });
  }
  function clearSession(employeeId, source){
    var src = source || SESSION_CHAPTER;
    STATE.sessions = STATE.sessions.filter(function(s){
      return !(s.employee_id === employeeId && (s.source || SESSION_CHAPTER) === src);
    });
    sbDelete("quiz_sessions", "employee_id=eq." + encodeURIComponent(employeeId) +
      "&source=eq." + encodeURIComponent(src)).catch(function(){});
  }

  /* id -> quiz 形狀，三個題庫都查得到。「我的紀錄」的錯題與收藏清單靠它把三個題庫
     的題目攤平成同一種形狀來顯示。 */
  function quizIndexById(){
    var byId = {};
    allQuestions().forEach(function(q){ byId[q.id] = q; });
    STATE.examQuestions.forEach(function(q){ byId[q.id] = examToQuizShape(q); });
    STATE.papers2026Quiz.forEach(function(q){ byId[q.id] = papers2026ToQuizShape(q); });
    return byId;
  }

  /* ---------- 作答過的題目 ----------
     「做到哪裡」真正可靠的來源是 attempts，不是續作進度那一列：每一次作答都永久
     記在 quiz_attempts / exam_attempts / papers2026_attempts 裡，跨題庫、跨裝置、
     換範圍都還在。續作進度只多記「停在第幾個位置」與「本輪幾分」，綁死一批題目、
     一跳題就失準。所以題庫範圍的「做過／未做」與「只出沒做過的」都走這裡。 */
  function answeredIdSet(employeeId){
    var seen = {};
    allAttempts().forEach(function(a){
      if(a.employee_id === employeeId) seen[a.question_id] = true;
    });
    return seen;
  }

  function resetBaseline(employeeId, onDone){

      return;

    var row = { employee_id: employeeId, reset_at: new Date().toISOString() };
    sbUpsert("stat_baselines", row, "employee_id").then(function(saved){
      STATE.baselines = STATE.baselines.filter(function(b){ return b.employee_id !== employeeId; });
      STATE.baselines.push(saved);
      if(onDone) onDone();

  }

  function getEffectiveTheme(){
    var stored = null;
    try{ stored = localStorage.getItem('theme'); }catch(e){}
    if(stored === 'light' || stored === 'dark') return stored;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function toggleTheme(){
    var next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('theme', next); }catch(e){}
    document.documentElement.setAttribute('data-theme', next);
    updateThemeToggleIcon();
  }
  function updateThemeToggleIcon(){
    var btn = document.getElementById('theme-toggle');
    if(!btn) return;
    var eff = getEffectiveTheme();
    btn.textContent = eff === 'dark' ? '☾' : '☀';
    btn.title = eff === 'dark' ? '切換為淺色' : '切換為深色';
  }

  /* ---------- 共用：附在筆記底下的模擬筆試卡片 ----------
     章節筆記題與「2026麻專18篇」共用同一份 markup / CSS。
     傳入的題目必須已正規化成 {id, question, options, answerIndex, explanation}
     （papers2026 的 snake_case 列請先過 papers2026ToQuizShape）。 */
  function mockQuizCardsHtml(list){
    return list.map(function(q, qi){
      return '<div class="mock-quiz-q" data-qid="' + esc(q.id) + '" data-answer="' + q.answerIndex + '">' +
        '<div class="quiz-q" style="font-size:14.5px;margin-bottom:12px;">Q' + (qi+1) + '. ' + inline(q.question) +
          '<button class="fav-star' + (isFavorited(q.id) ? ' active' : '') + '" title="收藏這題">&#9733;</button>' +
        '</div>' +
        '<div class="quiz-options">' +
          q.options.map(function(opt, oi){
            return '<button class="opt-btn" data-idx="' + oi + '"><span class="k">' +
              String.fromCharCode(65+oi) + '</span><span>' + inline(opt) + '</span></button>';
          }).join('') +
        '</div>' +
        '<div class="quiz-explain" hidden><span class="tag">解析</span>' + inline(q.explanation) + '</div>' +
      '</div>';
    }).join('');
  }

  /* scope 一定要指定（'#view-read' / '#view-papers2026'）：兩個分頁的 DOM
     同時存在，全域 querySelectorAll('.mock-quiz-q') 會把另一個分頁的卡片
     也綁上錯誤的 source / 題庫。 */
  function wireMockQuizCards(scope, lookup, source){
    document.querySelectorAll(scope + ' .mock-quiz-q').forEach(function(card){
      var qid = card.getAttribute('data-qid');
      var q = lookup(qid);
      var answerIdx = parseInt(card.getAttribute('data-answer'), 10);
      var opts = card.querySelectorAll('.opt-btn');
      var starBtn = card.querySelector('.fav-star');
      if(starBtn){
        starBtn.addEventListener('click', function(){
          toggleFavorite(qid, source, function(){ starBtn.classList.toggle('active', isFavorited(qid)); });
        });
      }
      opts.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(card.classList.contains('answered')) return;
          card.classList.add('answered');
          var chosen = parseInt(btn.getAttribute('data-idx'), 10);
          opts.forEach(function(b){
            b.disabled = true;
            var idx = parseInt(b.getAttribute('data-idx'), 10);
            if(idx === answerIdx) b.classList.add('correct');
            else if(idx === chosen) b.classList.add('incorrect');
          });
          var exp = card.querySelector('.quiz-explain');
          if(exp) exp.hidden = false;
          if(q) recordAttempt(q, chosen, chosen === answerIdx);
        });
      });
    });
  }
