<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻專站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0A0E12;
  --panel:#10161C;
  --panel-2:#161D24;
  --line:#232C35;
  --line-soft:#1A2129;
  --ink:#E8EEF1;
  --ink-dim:#7E8C97;
  --ink-faint:#4C5861;
  --ecg:#33D6A6;
  --ecg-dim:#1E7A5F;
  --spo2:#4FB8EA;
  --resp:#E4B750;
  --nibp:#E2617C;
  --radius-card:8px;
  --radius-ctl:5px;
  --font-display:"IBM Plex Sans Condensed","Noto Sans TC",sans-serif;
  --font-body:"Noto Sans TC","IBM Plex Sans Condensed",sans-serif;
  --font-mono:"IBM Plex Mono","Noto Sans TC",monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ecg-dim);color:#fff;}

a{color:var(--spo2);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ---------- app shell ---------- */
#root{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:24px;
  padding:0 20px;height:56px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.topbar .brand{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--font-display);
  font-weight:700;letter-spacing:.02em;
  font-size:18px;color:var(--ink);
  white-space:nowrap;
}
.topbar .brand .pulse{color:var(--ecg);font-size:15px;}
.topbar .brand .sub{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);
  letter-spacing:.12em;text-transform:uppercase;
}
.tabs{display:flex;gap:4px;margin-left:auto;}
.tab-btn{
  appearance:none;border:1px solid transparent;background:transparent;
  color:var(--ink-dim);font-family:var(--font-display);font-weight:600;
  font-size:14px;letter-spacing:.02em;padding:8px 14px;border-radius:var(--radius-ctl);
  cursor:pointer;transition:color .15s ease,background .15s ease;
}
.tab-btn:hover{color:var(--ink);background:var(--panel-2);}
.tab-btn.active{color:var(--bg);background:var(--ecg);}
.tab-btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}

.view{flex:1;display:none;min-height:0;}
.view.active{display:flex;}

/* ---------- read view ---------- */
#view-read{width:100%;}
.sidebar{
  width:300px;flex:none;
  border-right:1px solid var(--line);
  background:var(--panel);
  display:flex;flex-direction:column;
  max-height:calc(100vh - 56px);
}
.sidebar-search{padding:14px;border-bottom:1px solid var(--line);}
.sidebar-search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--radius-ctl);padding:9px 11px;
  font-size:13.5px;
}
.sidebar-search input:focus-visible{outline:2px solid var(--spo2);outline-offset:1px;}
.sidebar-search .count{
  margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
}
.chapter-list{overflow-y:auto;flex:1;padding:6px;}
.chapter-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-ctl);
  border-left:2px solid transparent;
  cursor:pointer;color:var(--ink-dim);
}
.chapter-item:hover{background:var(--panel-2);color:var(--ink);}
.chapter-item.active{
  background:var(--panel-2);color:var(--ink);
  border-left:2px solid var(--ecg);
}
.chapter-item .t{font-size:13px;line-height:1.35;}
.chapter-item .badge{
  margin-left:auto;flex:none;font-family:var(--font-mono);font-size:9px;
  color:var(--ecg);border:1px solid var(--ecg-dim);border-radius:3px;padding:1px 4px;
}

.content-pane{flex:1;overflow-y:auto;min-width:0;}
.content-inner{max-width:720px;margin:0 auto;padding:40px 32px 100px;}
.content-inner h1.chapter-title{
  font-family:var(--font-display);font-weight:700;font-size:30px;
  letter-spacing:.01em;margin:0 0 6px;text-wrap:balance;color:var(--ink);
}
.chapter-meta{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px;
}
.content-inner hr.divider{border:none;border-top:1px solid var(--line);margin:0 0 28px;}

.block-h2{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--ink);margin:30px 0 12px;text-wrap:balance;}
.block-h3{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--spo2);margin:22px 0 8px;text-wrap:balance;}
.block-h4{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink-dim);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
.block-p{margin:10px 0;color:var(--ink);}
.block-li{
  display:flex;gap:10px;margin:7px 0;padding-left:2px;
}
.block-li .bullet{flex:none;color:var(--ecg);font-family:var(--font-mono);padding-top:2px;}
.block-li .txt{flex:1;min-width:0;}
.block-li.indent-0{margin-left:0;}
.block-li.indent-1{margin-left:22px;}
.block-li.indent-2{margin-left:44px;}
.block-li.indent-3{margin-left:66px;}
.block-li.indent-1 .bullet,.block-li.indent-2 .bullet,.block-li.indent-3 .bullet{color:var(--spo2);opacity:.8;}

.block-quote{
  margin:16px 0;padding:12px 14px;background:var(--panel-2);
  border-left:3px solid var(--resp);border-radius:0 var(--radius-ctl) var(--radius-ctl) 0;
  color:var(--ink);
}
.block-quote .tag{
  font-family:var(--font-mono);font-size:10px;color:var(--resp);
  letter-spacing:.1em;margin-right:8px;
}

.block-img{margin:18px 0;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-ctl);text-align:center;}
.block-img img{max-width:100%;height:auto;border-radius:3px;display:inline-block;}

.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius-ctl);}
table.block-table{border-collapse:collapse;width:100%;font-size:13.5px;}
table.block-table td{
  border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
  padding:8px 12px;font-family:var(--font-mono);white-space:nowrap;
}
table.block-table tr:first-child td{background:var(--panel-2);color:var(--spo2);font-weight:600;}
table.block-table tr:last-child td{border-bottom:none;}
table.block-table td:last-child{border-right:none;}

b{color:var(--ink);font-weight:700;}
s{color:var(--ink-faint);}

.empty-state{color:var(--ink-faint);padding:60px 32px;text-align:center;font-family:var(--font-display);}

/* ---------- quiz view ---------- */
#view-quiz{width:100%;justify-content:center;overflow-y:auto;}
.quiz-wrap{max-width:640px;width:100%;padding:40px 24px 100px;margin:0 auto;}
.quiz-setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.quiz-setup h2, .quiz-live h2{font-family:var(--font-display);font-size:20px;margin:0 0 14px;}
.quiz-setup label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.quiz-setup select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px;border-radius:var(--radius-ctl);font-size:14px;margin-bottom:16px;
}
.btn{
  appearance:none;border:none;border-radius:var(--radius-ctl);
  padding:10px 18px;font-family:var(--font-display);font-weight:600;font-size:14px;
  cursor:pointer;letter-spacing:.02em;
}
.btn-primary{background:var(--ecg);color:#04120D;}
.btn-primary:hover{background:#45E6B6;}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint);}
.btn:focus-visible{outline:2px solid var(--spo2);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.quiz-progress{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
.quiz-progress .idx{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.06em;}
.quiz-progress .score{font-family:var(--font-mono);font-size:22px;color:var(--ecg);font-weight:600;}
.quiz-chapter-tag{
  display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--spo2);
  border:1px solid var(--ecg-dim);border-color:#22506B;border-radius:3px;padding:2px 6px;margin-bottom:12px;
}
.quiz-q{font-size:17px;color:var(--ink);margin:0 0 18px;text-wrap:balance;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius-ctl);padding:12px 14px;font-size:14px;cursor:pointer;
  display:flex;gap:10px;line-height:1.5;
}
.opt-btn:hover:not(:disabled){border-color:var(--ink-faint);}
.opt-btn .k{font-family:var(--font-mono);color:var(--ink-faint);flex:none;}
.opt-btn.correct{border-color:var(--ecg);background:rgba(51,214,166,.12);}
.opt-btn.correct .k{color:var(--ecg);}
.opt-btn.incorrect{border-color:var(--nibp);background:rgba(226,97,124,.12);}
.opt-btn.incorrect .k{color:var(--nibp);}
.opt-btn:disabled{cursor:default;}
.quiz-explain{
  margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:var(--radius-ctl);
  border-left:3px solid var(--spo2);font-size:13.5px;color:var(--ink-dim);
}
.quiz-explain .tag{font-family:var(--font-mono);font-size:10px;color:var(--spo2);letter-spacing:.1em;margin-right:8px;}
.quiz-nav{display:flex;justify-content:flex-end;margin-top:20px;}
.quiz-done{text-align:center;}
.quiz-done .final{font-family:var(--font-mono);font-size:44px;color:var(--ecg);margin:8px 0;}
.quiz-done .label{color:var(--ink-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}

/* ---------- add view ---------- */
#view-add{width:100%;overflow-y:auto;justify-content:center;}
.add-wrap{max-width:640px;width:100%;padding:40px 24px 100px;display:flex;flex-direction:column;gap:24px;}
.readonly-banner{
  background:var(--panel-2);border:1px solid var(--nibp);color:var(--nibp);
  border-radius:var(--radius-ctl);padding:12px 14px;font-size:13.5px;display:none;
}
.readonly-banner.show{display:block;}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;}
.form-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
.form-card .hint{color:var(--ink-faint);font-size:12.5px;margin:0 0 18px;line-height:1.6;}
.form-card .hint code{background:var(--panel-2);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:11.5px;color:var(--spo2);}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.field input[type=text], .field textarea, .field select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 11px;border-radius:var(--radius-ctl);font-size:14px;resize:vertical;
}
.field textarea{min-height:160px;font-family:var(--font-mono);font-size:13px;line-height:1.6;}
.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--spo2);outline-offset:1px;}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.opt-row input[type=radio]{accent-color:var(--ecg);flex:none;}
.opt-row input[type=text]{flex:1;}
.form-status{margin-top:12px;font-size:13px;}
.form-status.ok{color:var(--ecg);}
.form-status.err{color:var(--nibp);}

@media (max-width:820px){
  .sidebar{width:230px;}
  .content-inner{padding:28px 18px 80px;}
}
@media (max-width:640px){
  #view-read.active{flex-direction:column;}
  .sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--line);}
  .topbar{gap:10px;padding:0 12px;}
  .topbar .brand .sub{display:none;}
  .tab-btn{padding:8px 10px;font-size:13px;}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
}

</style>

<body>
<div id="root"></div>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://oveuukmlfmddanzwuwhq.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92ZXV1a21sZm1kZGFuend1d2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDA4ODIsImV4cCI6MjEwMzIxNjg4Mn0.eazZ272x7UsLcD1YvfMI19SB9i5B6XDQfV93H5c2vsQ";

  /* ================= data & state ================= */
  var STATE = { chapters: [], questions: [] };

  function allChapters(){ return STATE.chapters; }
  function allQuestions(){ return STATE.questions; }
  function findChapter(id){ return allChapters().filter(function(c){ return c.id === id; })[0]; }

  /* ================= Supabase (PostgREST) ================= */
  function sbHeaders(extra){
    var h = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    };
    if(extra){ for(var k in extra){ h[k] = extra[k]; } }
    return h;
  }

  function sbSelect(table){
    return fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*", { headers: sbHeaders() })
      .then(function(r){
        if(!r.ok) throw new Error("讀取 " + table + " 失敗 (HTTP " + r.status + ")");
        return r.json();
      });
  }

  function sbInsert(table, row){
    return fetch(SUPABASE_URL + "/rest/v1/" + table, {
      method: "POST",
      headers: sbHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify([row])
    }).then(function(r){
      if(!r.ok){
        return r.json().catch(function(){ return {}; }).then(function(err){
          throw new Error(err.message || ("新增失敗 (HTTP " + r.status + ")"));
        });
      }
      return r.json();
    }).then(function(rows){ return rows[0]; });
  }

  function loadAll(){
    return Promise.all([sbSelect("chapters"), sbSelect("questions")]).then(function(results){
      STATE.chapters = results[0];
      STATE.questions = results[1];
    });
  }

  /* ================= tiny helpers ================= */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(s){
    // **bold** and ~~strike~~ -> safe <b>/<s>, everything else escaped
    var out = "", src = String(s || "");
    var re = /\*\*(.+?)\*\*|~~(.+?)~~/g, m, last = 0;
    while((m = re.exec(src))){
      out += esc(src.slice(last, m.index));
      if(m[1] !== undefined){ out += "<b>" + esc(m[1]) + "</b>"; }
      else { out += "<s>" + esc(m[2]) + "</s>"; }
      last = re.lastIndex;
    }
    out += esc(src.slice(last));
    return out;
  }
  function uid(prefix){
    return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= mini-markdown parser (mirrors the docx/site build pipeline) ================= */
  function parseBody(text){
    var lines = String(text || "").split("\n");
    var blocks = [];
    var i = 0, n = lines.length;
    while(i < n){
      var line = lines[i].replace(/\s+$/,"");
      if(line.trim() === ""){ i++; continue; }

      if(line.replace(/^\s+/,"").indexOf("|") === 0){
        var tableLines = [];
        while(i < n && lines[i].replace(/\s+$/,"").replace(/^\s+/,"").indexOf("|") === 0){
          tableLines.push(lines[i].replace(/\s+$/,""));
          i++;
        }
        var rows = tableLines.map(function(tl){
          var cells = tl.trim().split("|");
          if(cells.length && cells[0].trim() === "") cells = cells.slice(1);
          if(cells.length && cells[cells.length-1].trim() === "") cells = cells.slice(0,-1);
          return cells.map(function(c){ return c.trim(); });
        });
        blocks.push({type:"table", rows: rows});
        continue;
      }

      var textOnly = line.trim();
      if(/^-\s*$/.test(textOnly)){ i++; continue; }

      var mH = line.match(/^(#{1,3})\s+(.*)$/);
      if(mH){
        var level = Math.min(mH[1].length + 1, 4);
        blocks.push({type:"h"+level, text: mH[2].trim()});
        i++; continue;
      }

      var mLi = line.match(/^(\s*)-\s+(.*)$/);
      if(mLi){
        var indent = Math.floor(mLi[1].length / 2);
        blocks.push({type:"li", indent: indent, text: mLi[2].trim()});
        i++; continue;
      }

      var mQ = line.match(/^>\s?(.*)$/);
      if(mQ){
        blocks.push({type:"quote", text: mQ[1].trim()});
        i++; continue;
      }

      blocks.push({type:"p", text: line.trim()});
      i++;
    }
    return blocks;
  }

  /* ================= rendering: blocks -> HTML ================= */
  function renderBlocks(blocks){
    if(!blocks || !blocks.length){
      return '<div class="empty-state">此章節目前沒有內容。</div>';
    }
    return blocks.map(function(b){
      if(b.type === "h2") return '<div class="block-h2">' + inline(b.text) + '</div>';
      if(b.type === "h3") return '<div class="block-h3">' + inline(b.text) + '</div>';
      if(b.type === "h4") return '<div class="block-h4">' + inline(b.text) + '</div>';
      if(b.type === "quote") return '<div class="block-quote"><span class="tag">TIP</span>' + inline(b.text) + '</div>';
      if(b.type === "img") return '<div class="block-img"><img src="' + esc(b.path) + '" alt="筆記附圖" loading="lazy"></div>';
      if(b.type === "li") return '<div class="block-li indent-' + Math.min(b.indent,3) + '"><span class="bullet">&#9656;</span><span class="txt">' + inline(b.text) + '</span></div>';
      if(b.type === "table"){
        var rows = b.rows.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        }).join('');
        return '<div class="table-wrap"><table class="block-table">' + rows + '</table></div>';
      }
      return '<div class="block-p">' + inline(b.text) + '</div>';
    }).join("");
  }

  /* ================= views ================= */
  var root = document.getElementById('root');
  var currentTab = "read";
  var currentChapterId = null;
  var searchTerm = "";
  var quiz = null; // {questions:[], idx:0, score:0, answered:false}

  function chapterMatches(c, term){
    if(!term) return true;
    var t = term.toLowerCase();
    if(c.title.toLowerCase().indexOf(t) !== -1) return true;
    for(var i=0;i<c.blocks.length;i++){
      var bt = c.blocks[i].text;
      if(bt && bt.toLowerCase().indexOf(t) !== -1) return true;
      if(c.blocks[i].type === "table"){
        var rows = c.blocks[i].rows;
        for(var r=0;r<rows.length;r++){
          for(var k=0;k<rows[r].length;k++){
            if(rows[r][k].toLowerCase().indexOf(t) !== -1) return true;
          }
        }
      }
    }
    return false;
  }

  function questionCountFor(chapterId){
    return allQuestions().filter(function(q){ return q.chapterId === chapterId || q.chapter_id === chapterId; }).length;
  }

  function renderShell(){
    root.innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="pulse">&#9673;</span> 麻專站 <span class="sub">Anesthesia Board Console</span></div>' +
        '<div class="tabs">' +
          '<button class="tab-btn" data-tab="read">讀筆記</button>' +
          '<button class="tab-btn" data-tab="quiz">測驗</button>' +
          '<button class="tab-btn" data-tab="add">新增內容</button>' +
        '</div>' +
      '</div>' +
      '<div class="view" id="view-read">' +
        '<div class="sidebar">' +
          '<div class="sidebar-search">' +
            '<input type="text" id="search-input" placeholder="搜尋章節關鍵字…" autocomplete="off">' +
            '<div class="count mono" id="search-count"></div>' +
          '</div>' +
          '<div class="chapter-list" id="chapter-list"></div>' +
        '</div>' +
        '<div class="content-pane"><div class="content-inner" id="content-inner"></div></div>' +
      '</div>' +
      '<div class="view" id="view-quiz"><div class="quiz-wrap" id="quiz-wrap"></div></div>' +
      '<div class="view" id="view-add"><div class="add-wrap" id="add-wrap"></div></div>';

    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ setTab(btn.getAttribute('data-tab')); });
    });
    document.getElementById('search-input').addEventListener('input', function(e){
      searchTerm = e.target.value;
      renderChapterList();
    });
  }

  function setTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    ['read','quiz','add'].forEach(function(t){
      document.getElementById('view-' + t).classList.toggle('active', t === tab);
    });
    if(tab === 'read') renderRead();
    if(tab === 'quiz') renderQuizSetup();
    if(tab === 'add') renderAdd();
  }

  /* ---------- read tab ---------- */
  function renderRead(){
    renderChapterList();
    if(!currentChapterId){
      var sorted = allChapters().slice().sort(function(a,b){ return (a.num||999) - (b.num||999); });
      if(sorted[0]) currentChapterId = sorted[0].id;
      renderChapterList();
    }
    renderChapterContent();
  }

  function renderChapterList(){
    var list = document.getElementById('chapter-list');
    var chapters = allChapters().slice().sort(function(a,b){ return (a.num||999) - (b.num||999); });
    var filtered = chapters.filter(function(c){ return chapterMatches(c, searchTerm); });
    document.getElementById('search-count').textContent = filtered.length + ' / ' + chapters.length + ' 章';
    list.innerHTML = filtered.map(function(c){
      var qc = questionCountFor(c.id);
      return '<div class="chapter-item' + (c.id === currentChapterId ? ' active' : '') + '" data-id="' + esc(c.id) + '">' +
        '<span class="t">' + esc(c.title) + '</span>' +
        (qc ? '<span class="badge">' + qc + 'Q</span>' : '') +
      '</div>';
    }).join('') || '<div class="empty-state">找不到符合的章節</div>';

    list.querySelectorAll('.chapter-item').forEach(function(item){
      item.addEventListener('click', function(){
        currentChapterId = item.getAttribute('data-id');
        renderChapterList();
        renderChapterContent();
      });
    });
  }

  function renderChapterContent(){
    var pane = document.getElementById('content-inner');
    var c = findChapter(currentChapterId);
    if(!c){ pane.innerHTML = '<div class="empty-state">選擇左側章節開始閱讀</div>'; return; }
    pane.innerHTML =
      '<h1 class="chapter-title">' + esc(c.title) + '</h1>' +
      (questionCountFor(c.id) ? '<div class="chapter-meta">' + questionCountFor(c.id) + ' 題測驗題</div>' : '') +
      '<hr class="divider">' +
      renderBlocks(c.blocks);
    pane.scrollTop = 0;
    document.querySelector('.content-pane').scrollTop = 0;
  }

  /* ---------- quiz tab ---------- */
  function renderQuizSetup(){
    var wrap = document.getElementById('quiz-wrap');
    var chaptersWithQ = allChapters().filter(function(c){ return questionCountFor(c.id) > 0; })
      .sort(function(a,b){ return (a.num||999)-(b.num||999); });
    var options = chaptersWithQ.map(function(c){
      return '<option value="' + esc(c.id) + '">' + esc(c.title) + '（' + questionCountFor(c.id) + ' 題）</option>';
    }).join('');
    wrap.innerHTML =
      '<div class="quiz-setup">' +
        '<h2>選擇題測驗</h2>' +
        (chaptersWithQ.length ? '' : '<div class="empty-state" style="padding:20px 0;">目前題庫是空的，先去「新增內容」新增幾題吧。</div>') +
        (chaptersWithQ.length ?
          '<label>章節範圍</label>' +
          '<select id="quiz-chapter"><option value="__all__">全部章節混合（' + allQuestions().length + ' 題）</option>' + options + '</select>' +
          '<button class="btn btn-primary" id="quiz-start">開始測驗</button>'
        : '') +
      '</div>';
    var startBtn = document.getElementById('quiz-start');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        var chId = document.getElementById('quiz-chapter').value;
        var pool = chId === '__all__' ? allQuestions() : allQuestions().filter(function(q){ return q.chapterId === chId; });
        quiz = { questions: shuffle(pool), idx: 0, score: 0, answered: false };
        renderQuizLive();
      });
    }
  }

  function renderQuizLive(){
    var wrap = document.getElementById('quiz-wrap');
    if(!quiz || quiz.idx >= quiz.questions.length){
      var total = quiz ? quiz.questions.length : 0;
      var score = quiz ? quiz.score : 0;
      wrap.innerHTML =
        '<div class="quiz-live quiz-done">' +
          '<div class="label">測驗結束</div>' +
          '<div class="final mono">' + score + ' / ' + total + '</div>' +
          '<div class="label">' + (total ? Math.round(score/total*100) : 0) + '% 正確率</div>' +
          '<div class="quiz-nav" style="justify-content:center;margin-top:24px;">' +
            '<button class="btn btn-ghost" id="quiz-again">再測一次</button>' +
          '</div>' +
        '</div>';
      document.getElementById('quiz-again').addEventListener('click', renderQuizSetup);
      return;
    }
    quiz.answered = false;
    var q = quiz.questions[quiz.idx];
    var ch = findChapter(q.chapterId);
    wrap.innerHTML =
      '<div class="quiz-live">' +
        '<div class="quiz-progress"><span class="idx mono">第 ' + (quiz.idx+1) + ' / ' + quiz.questions.length + ' 題</span><span class="score mono">' + quiz.score + '</span></div>' +
        (ch ? '<div class="quiz-chapter-tag">' + esc(ch.title) + '</div>' : '') +
        '<div class="quiz-q">' + esc(q.question) + '</div>' +
        '<div class="quiz-options" id="quiz-options"></div>' +
        '<div id="quiz-explain-slot"></div>' +
        '<div class="quiz-nav"><button class="btn btn-primary" id="quiz-next" disabled>下一題</button></div>' +
      '</div>';

    var optWrap = document.getElementById('quiz-options');
    q.options.forEach(function(optText, idx){
      var b = document.createElement('button');
      b.className = 'opt-btn';
      b.innerHTML = '<span class="k mono">' + String.fromCharCode(65+idx) + '</span><span>' + esc(optText) + '</span>';
      b.addEventListener('click', function(){ answerQuiz(idx); });
      optWrap.appendChild(b);
    });

    document.getElementById('quiz-next').addEventListener('click', function(){
      quiz.idx++;
      renderQuizLive();
    });
  }

  function answerQuiz(idx){
    if(quiz.answered) return;
    quiz.answered = true;
    var q = quiz.questions[quiz.idx];
    var correct = q.answerIndex;
    var buttons = document.querySelectorAll('#quiz-options .opt-btn');
    buttons.forEach(function(btn, i){
      btn.disabled = true;
      if(i === correct) btn.classList.add('correct');
      else if(i === idx) btn.classList.add('incorrect');
    });
    if(idx === correct) quiz.score++;
    document.getElementById('quiz-explain-slot').innerHTML =
      '<div class="quiz-explain"><span class="tag">解析</span>' + esc(q.explanation || '') + '</div>';
    document.getElementById('quiz-next').disabled = false;
  }

  /* ---------- add tab ---------- */
  function renderAdd(){
    var wrap = document.getElementById('add-wrap');
    var chapterOptions = allChapters().slice().sort(function(a,b){ return (a.num||999)-(b.num||999); })
      .map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.title) + '</option>'; }).join('');

    wrap.innerHTML =
      '<div class="form-card">' +
        '<h2>新增章節</h2>' +
        '<p class="hint">支援簡易語法：<code># / ## / ###</code> 標題、<code>- </code> 項目符號（每兩個空格縮排一層）、<code>**粗體**</code>、<code>&gt; 提醒文字</code>、<code>|欄位|欄位|</code> 表格列。送出後所有人打開網站都會看到。</p>' +
        '<div class="field"><label>章節標題</label><input type="text" id="new-chapter-title" placeholder="例如：Ch88 新章節主題"></div>' +
        '<div class="field"><label>內容</label><textarea id="new-chapter-body" placeholder="## 小標題&#10;- 重點一&#10;- 重點二"></textarea></div>' +
        '<button class="btn btn-primary" id="new-chapter-submit">新增章節</button>' +
        '<div class="form-status" id="new-chapter-status"></div>' +
      '</div>' +
      '<div class="form-card">' +
        '<h2>新增測驗題目</h2>' +
        '<div class="field"><label>所屬章節</label><select id="new-q-chapter">' + chapterOptions + '</select></div>' +
        '<div class="field"><label>題目</label><input type="text" id="new-q-text" placeholder="輸入題目敘述"></div>' +
        '<div class="field"><label>選項（點選圓圈標記正確答案）</label>' +
          [0,1,2,3].map(function(i){
            return '<div class="opt-row"><input type="radio" name="new-q-answer" value="' + i + '"' + (i===0?' checked':'') + '><input type="text" id="new-q-opt-' + i + '" placeholder="選項 ' + String.fromCharCode(65+i) + '"></div>';
          }).join('') +
        '</div>' +
        '<div class="field"><label>解析</label><textarea id="new-q-explain" style="min-height:90px;font-family:var(--font-body);"></textarea></div>' +
        '<button class="btn btn-primary" id="new-q-submit">新增題目</button>' +
        '<div class="form-status" id="new-q-status"></div>' +
      '</div>';

    document.getElementById('new-chapter-submit').addEventListener('click', submitNewChapter);
    document.getElementById('new-q-submit').addEventListener('click', submitNewQuestion);
  }

  function setStatus(elId, msg, ok){
    var s = document.getElementById(elId);
    s.textContent = msg;
    s.className = 'form-status ' + (ok ? 'ok' : 'err');
  }

  function submitNewChapter(){
    var title = document.getElementById('new-chapter-title').value.trim();
    var body = document.getElementById('new-chapter-body').value;
    if(!title){ setStatus('new-chapter-status', '請填寫章節標題', false); return; }
    var blocks = parseBody(body);
    var btn = document.getElementById('new-chapter-submit');
    btn.disabled = true;
    setStatus('new-chapter-status', '儲存中…', true);
    sbInsert('chapters', { id: uid('user-ch'), num: null, title: title, blocks: blocks })
      .then(function(row){
        STATE.chapters.push(row);
        setStatus('new-chapter-status', '已新增，所有人都看得到了。', true);
        document.getElementById('new-chapter-title').value = '';
        document.getElementById('new-chapter-body').value = '';
        renderAdd();
      })
      .catch(function(err){
        setStatus('new-chapter-status', '儲存失敗：' + err.message, false);
        btn.disabled = false;
      });
  }

  function submitNewQuestion(){
    var chapterId = document.getElementById('new-q-chapter').value;
    var question = document.getElementById('new-q-text').value.trim();
    var options = [0,1,2,3].map(function(i){ return document.getElementById('new-q-opt-' + i).value.trim(); });
    var answerIndex = parseInt((document.querySelector('input[name=new-q-answer]:checked') || {}).value || '0', 10);
    var explanation = document.getElementById('new-q-explain').value.trim();
    if(!question || options.some(function(o){ return !o; })){
      setStatus('new-q-status', '請填寫題目與全部四個選項', false); return;
    }
    var btn = document.getElementById('new-q-submit');
    btn.disabled = true;
    setStatus('new-q-status', '儲存中…', true);
    sbInsert('questions', {
      id: uid('user-q'), chapter_id: chapterId, question: question,
      options: options, answer_index: answerIndex, explanation: explanation
    }).then(function(row){
      STATE.questions.push({
        id: row.id, chapterId: row.chapter_id, question: row.question,
        options: row.options, answerIndex: row.answer_index, explanation: row.explanation
      });
      setStatus('new-q-status', '已新增，所有人都看得到了。', true);
      document.getElementById('new-q-text').value = '';
      [0,1,2,3].forEach(function(i){ document.getElementById('new-q-opt-' + i).value = ''; });
      document.getElementById('new-q-explain').value = '';
      renderAdd();
    }).catch(function(err){
      setStatus('new-q-status', '儲存失敗：' + err.message, false);
      btn.disabled = false;
    });
  }

  /* ================= boot ================= */
  function boot(){
    root.innerHTML = '<div class="empty-state" style="margin:auto;">載入中…</div>';
    loadAll().then(function(){
      // normalize question rows (Postgres snake_case -> the shape the rest of the app expects)
      STATE.questions = STATE.questions.map(function(q){
        return {
          id: q.id, chapterId: q.chapterId || q.chapter_id, question: q.question,
          options: q.options, answerIndex: (q.answerIndex != null ? q.answerIndex : q.answer_index),
          explanation: q.explanation
        };
      });
      renderShell();
      setTab('read');
    }).catch(function(err){
      root.innerHTML = '<div class="empty-state" style="margin:auto;">資料載入失敗：' + esc(err.message) + '<br>請重新整理頁面再試一次。</div>';
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
